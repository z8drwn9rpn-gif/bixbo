name: Repair device-local admin config
on:
  push:
    paths:
      - '.github/scripts/repair-device-local-admin-config.py'
      - '.github/workflows/repair-device-local-admin-config.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/install-device-local-admin-config.py
      - run: python .github/scripts/repair-device-local-admin-config.py
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Audit direct synced adminConfig reads
        run: |
          echo 'Direct references after migration:'
          grep -R "settings\.adminConfig" src --include='*.ts' --include='*.tsx' || true
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/deviceAdminConfig.ts src/lib/appRegistry.ts src/lib/layoutRegistry.ts src/routes/admin.tsx src/components/LayoutOrderEditor.tsx src/components/CustomLogBuilder.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Make admin configuration device-local with touch drag ordering'
            git push
          fi
