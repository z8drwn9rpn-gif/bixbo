name: Run screenshot UI fix
on:
  push:
    paths:
      - '.github/workflows/run-screenshot-ui-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/fix-screenshot-ui.py
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Verify requested changes
        run: |
          ! grep -q 'Array.from({ length: 21 }, (_, i) => i / 2)' src/components/LogSheet.tsx
          grep -q 'text={t(b.label)}' src/components/LogSheet.tsx
          grep -q 'visibleHealthDay === todayKey() ? t("Today")' src/routes/couple.tsx
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/LogSheet.tsx src/routes/couple.tsx src/lib/i18n.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix Blueberry and workout scales and remaining Slovak UI"
          git push
