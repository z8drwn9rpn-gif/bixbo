name: Apply Profile diagnostics launcher patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Profile diagnostics launcher patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Profile launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shared = Path('src/features/profile/shared.tsx')
          text = shared.read_text()
          old_sig = '''export function HealthHub({
            onHome,
            onOpen,
            onNotifications,
            onAdmin,
          }: {
            onHome: () => void;
            onOpen: (view: HealthView) => void;
            onNotifications: () => void;
            onAdmin?: () => void;
          }) {'''
          new_sig = '''export function HealthHub({
            onHome,
            onOpen,
            onNotifications,
            onDiagnostics,
            onAdmin,
          }: {
            onHome: () => void;
            onOpen: (view: HealthView) => void;
            onNotifications: () => void;
            onDiagnostics: () => void;
            onAdmin?: () => void;
          }) {'''
          if old_sig not in text:
              raise SystemExit('HealthHub signature not found')
          text = text.replace(old_sig, new_sig, 1)

          old_rows = '''            <HubRow
              icon={<ClockIcon size={22} />}
              title="Notifications"
              subtitle="All notification and reminder settings in one place"
              onClick={onNotifications}
            />
            <div className="ml-[4.5rem] border-t border-border/60" />

            <HubRow
              icon={<ProfileIcon size={22} />}
              title="About BIXBO"'''
          new_rows = '''            <HubRow
              icon={<ClockIcon size={22} />}
              title="Notifications"
              subtitle="All notification and reminder settings in one place"
              onClick={onNotifications}
            />
            <div className="ml-[4.5rem] border-t border-border/60" />

            <HubRow
              icon={<WarningIcon size={22} />}
              title="App diagnostics"
              subtitle="Scan BIXBO for app, storage and runtime errors"
              onClick={onDiagnostics}
            />
            <div className="ml-[4.5rem] border-t border-border/60" />

            <HubRow
              icon={<ProfileIcon size={22} />}
              title="About BIXBO"'''
          if old_rows not in text:
              raise SystemExit('Notifications/Profile rows not found')
          shared.write_text(text.replace(old_rows, new_rows, 1))

          special = Path('src/features/profile/ProfilePageSpecialViews.tsx')
          text = special.read_text()
          old = '''        onNotifications={() => navigate({ to: "/notifications" as never })}
        onAdmin={deviceAdminEnabled ? () => navigate({ to: "/admin" as never }) : undefined}'''
          new = '''        onNotifications={() => navigate({ to: "/notifications" as never })}
        onDiagnostics={() => navigate({ to: "/diagnostics" })}
        onAdmin={deviceAdminEnabled ? () => navigate({ to: "/admin" as never }) : undefined}'''
          if old not in text:
              raise SystemExit('HealthHub invocation not found')
          special.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/profile-diagnostics-launcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/profile/shared.tsx src/features/profile/ProfilePageSpecialViews.tsx .github/workflows/profile-diagnostics-launcher.yml
          git commit -m "Add Profile app diagnostics launcher"
          git push
