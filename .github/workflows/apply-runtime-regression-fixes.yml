name: Apply runtime regression fixes
on:
  push:
    branches:
      - agent/fix-period-admin-couple-notes
    paths:
      - scripts/apply_runtime_regression_fixes.py
      - .github/workflows/apply-runtime-regression-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-period-admin-couple-notes
      - name: Apply exact fixes
        run: python scripts/apply_runtime_regression_fixes.py
      - name: Commit patched app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No app changes to commit"
          else
            git commit -m "Fix period, admin, couple and notes regressions"
            git push
          fi
