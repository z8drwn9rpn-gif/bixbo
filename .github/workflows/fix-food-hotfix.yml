name: Apply Food hotfix

on:
  push:
    branches:
      - fix/food-overview-textarea

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[food-hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/food-overview-textarea
          fetch-depth: 0

      - name: Patch Food overview, touch chips and textarea caret
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Day Overview: restore the old red Histamine flare line and keep the flame inline before the label.
          replace_once(
              "src/components/home/DayOverview.tsx",
              '''                  {f.histamineFlare ? (\n                    <p className="mt-px text-xs leading-relaxed text-destructive">\n                      <span className="font-semibold"><Ico e="🔥" size={13} /> {t("Histamine flare")}:</span>{" "}\n                      {f.histamineSymptoms?.length ? f.histamineSymptoms.join(", ") : t("Yes")}\n                    </p>\n                  ) : null}''',
              '''                  {f.histamineFlare ? (\n                    <p className="mt-px text-xs leading-relaxed text-destructive">\n                      <span className="inline-flex items-center gap-1 align-middle font-semibold text-destructive">\n                        <Ico e="🔥" size={13} />\n                        <span>{t("Histamine flare")}:</span>\n                      </span>{" "}\n                      <span className="text-destructive">\n                        {f.histamineSymptoms?.length ? f.histamineSymptoms.join(", ") : t("Yes")}\n                      </span>\n                    </p>\n                  ) : null}''',
          )

          # Textarea: for ordinary text use the native textarea rendering. The mirrored overlay is only
          # needed when a custom BIXBO emoji glyph is present; keeping it over plain text breaks iOS hit-testing
          # and caret placement when a line wraps.
          replace_once(
              "src/components/ui/textarea.tsx",
              '''    const canonicalValue = normalizeBixboText(controlled ? asText(value) : uncontrolledValue);\n    const nativeValue = encodeBixboNativeText(canonicalValue);\n    const portalHost = pickerOpen''',
              '''    const canonicalValue = normalizeBixboText(controlled ? asText(value) : uncontrolledValue);\n    const nativeValue = encodeBixboNativeText(canonicalValue);\n    const mirrorActive = Boolean(canonicalValue && EMOJI_RE.test(canonicalValue));\n    const portalHost = pickerOpen''',
          )
          replace_once(
              "src/components/ui/textarea.tsx",
              '''            "relative z-10 flex min-h-[120px] w-full rounded-xl border border-input bg-background px-3 py-2.5 pr-14 text-base leading-normal text-transparent caret-foreground shadow-sm transition-[border-color,box-shadow,background-color] duration-150",\n            "[-webkit-text-fill-color:transparent] placeholder:[-webkit-text-fill-color:var(--muted-foreground)] placeholder:text-muted-foreground",''',
              '''            "relative z-10 flex min-h-[120px] w-full rounded-xl border border-input bg-background px-3 py-2.5 pr-14 text-base leading-normal caret-foreground shadow-sm transition-[border-color,box-shadow,background-color] duration-150",\n            mirrorActive\n              ? "text-transparent [-webkit-text-fill-color:transparent] placeholder:[-webkit-text-fill-color:var(--muted-foreground)]"\n              : "text-foreground",\n            "placeholder:text-muted-foreground",''',
          )
          replace_once(
              "src/components/ui/textarea.tsx",
              '''        {canonicalValue ? (\n          <div''',
              '''        {mirrorActive ? (\n          <div''',
          )

          # Chips: ignore a touch that has turned into a vertical scroll. This prevents Food mood chips
          # (How do I feel after food?) from selecting themselves while the user scrolls through the form.
          replace_once(
              "src/features/logging/LogFormPrimitives.tsx",
              '''import { Children, isValidElement, useState, type ReactNode } from "react";''',
              '''import { Children, isValidElement, useRef, useState, type ReactNode } from "react";''',
          )
          replace_once(
              "src/features/logging/LogFormPrimitives.tsx",
              '''}) {\n  const { t } = useI18n();\n  return (\n    <button\n      type="button"\n      onClick={onClick}\n      title={title}\n      className={`rounded-full px-3 py-1.5 text-xs font-semibold transition ${''',
              '''}) {\n  const { t } = useI18n();\n  const pointerStart = useRef<{ x: number; y: number } | null>(null);\n  const pointerMoved = useRef(false);\n  return (\n    <button\n      type="button"\n      onPointerDown={(event) => {\n        if (event.pointerType !== "touch") return;\n        pointerStart.current = { x: event.clientX, y: event.clientY };\n        pointerMoved.current = false;\n      }}\n      onPointerMove={(event) => {\n        if (event.pointerType !== "touch" || !pointerStart.current) return;\n        const dx = event.clientX - pointerStart.current.x;\n        const dy = event.clientY - pointerStart.current.y;\n        if (Math.hypot(dx, dy) > 8) pointerMoved.current = true;\n      }}\n      onPointerUp={(event) => {\n        if (event.pointerType === "touch" && pointerStart.current) {\n          const dx = event.clientX - pointerStart.current.x;\n          const dy = event.clientY - pointerStart.current.y;\n          if (Math.hypot(dx, dy) > 8) pointerMoved.current = true;\n        }\n        pointerStart.current = null;\n      }}\n      onPointerCancel={() => {\n        pointerStart.current = null;\n        pointerMoved.current = true;\n      }}\n      onClick={(event) => {\n        if (event.detail !== 0 && pointerMoved.current) {\n          pointerMoved.current = false;\n          event.preventDefault();\n          return;\n        }\n        pointerMoved.current = false;\n        onClick();\n      }}\n      title={title}\n      className={`rounded-full px-3 py-1.5 text-xs font-semibold transition ${''',
          )

          # The workflow is temporary; remove it in the same source-fix commit.
          Path(".github/workflows/fix-food-hotfix.yml").unlink()
          PY

          git config user.name "bixbo-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx src/components/ui/textarea.tsx src/features/logging/LogFormPrimitives.tsx .github/workflows/fix-food-hotfix.yml
          git commit -m "Fix Food flare, mood touch and multiline caret [food-hotfix-applied]"
          git push origin HEAD:fix/food-overview-textarea
