name: Fix Slovak leftovers
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix-slovak-leftovers.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('src/lib/i18n.ts'); s=p.read_text(); marker='  "Today": "Dnes",'
          entries={
          'Only the explicitly shared categories for the selected month.':'Iba výslovne zdieľané kategórie za vybraný mesiac.','Daily average pain. Tap a bar to see its value. Solid bars are yours; striped bars belong to Partner.':'Denný priemer bolesti. Ťukni na stĺpec a zobrazí sa jeho hodnota. Plné stĺpce sú tvoje; pruhované patria partnerovi.','Tap any pain bar to see the exact value.':'Ťukni na ľubovoľný stĺpec bolesti a zobrazí sa presná hodnota.','You — solid':'Ty — plné','striped':'pruhované','Solid bars are yours. Striped bars belong to your partner.':'Plné stĺpce sú tvoje. Pruhované stĺpce patria tvojmu partnerovi.','Selected association':'Vybraná súvislosť','Not enough data':'Nedostatok údajov','Days with trigger':'Dni so spúšťačom','Days without trigger':'Dni bez spúšťača','Confidence depends on the number of days in both groups':'Spoľahlivosť závisí od počtu dní v oboch skupinách','Save this comparison':'Uložiť toto porovnanie','Possible trigger':'Možný spúšťač','Compare with outcome':'Porovnať s výsledkom','High caffeine (≥200 mg)':'Vysoký príjem kofeínu (≥200 mg)','Hot flash':'Nával tepla','Low energy':'Nízka energia','Most improved':'Najväčšie zlepšenie','Needs attention':'Vyžaduje pozornosť','Most stable':'Najstabilnejšie','compared over the same number of days.':'porovnané za rovnaký počet dní.','Medication adherence':'Dodržiavanie liekov','Workouts':'Cvičenia','HAK at a glance':'HAK v skratke','Started':'Začiatok','Logged data':'Zaznamenané údaje','Overall':'Celkovo','Strongest change':'Najväčšia zmena','Type':'Typ','Magnesium before workout?':'Magnézium pred cvičením?','Triggered a symptom? (optional)':'Vyvolalo cvičenie príznak? (voliteľné)','No tetany or pain entries logged for this day yet.':'Pre tento deň zatiaľ nie je zaznamenaná tetánia ani bolesť.','Weight after (kg, optional)':'Hmotnosť po cvičení (kg, voliteľné)',"Saved with this workout only — it doesn't change your daily weight.":'Uloží sa iba k tomuto cvičeniu — nezmení tvoju dennú hmotnosť.','How you feel':'Ako sa cítiš','Great':'Výborne','Good':'Dobre','Ok':'OK','Tired':'Unavená','Sore':'Boľavá','Yoga':'Joga','Walk':'Chôdza','Run':'Beh','Hike':'Turistika','Cycling':'Cyklistika','Strength':'Silový tréning','Stretching':'Strečing','Swim':'Plávanie','Meditation':'Meditácia','Distance (km)':'Vzdialenosť (km)','Elevation gain (m)':'Prevýšenie (m)','Exercise name':'Názov cviku','Remove exercise':'Odstrániť cvik','Sets':'Série','Reps':'Opakovania','Type of pressure':'Typ tlaku','Flu symptoms note':'Poznámka k príznakom chrípky','Yes — log it':'Áno — zaznamenať','Type of nausea':'Typ nevoľnosti','Nausea severity scale':'Stupnica nevoľnosti','Relieved by':'Čo pomohlo','Headache type':'Typ bolesti hlavy','Headache scale':'Stupnica bolesti hlavy','Medication + dose':'Liek + dávka','Hot flashes scale':'Stupnica návalov tepla','Location':'Miesto','Tetany scale':'Stupnica tetánie','Panic scale':'Stupnica paniky','Saved weight measurements':'Uložené merania hmotnosti','How I slept':'Ako som spala','Add extra dose':'Pridať extra dávku','From':'Od','To':'Do','Time from':'Čas od','Time to':'Čas do','Color':'Farba','What to do…':'Čo treba urobiť…','Clear postpartum symptoms':'Vymazať popôrodné príznaky','Custom…':'Vlastné…','Reorder':'Zmeniť poradie','Drag circles to reorder':'Presúvaním kruhov zmeníš poradie','Level':'Úroveň'}
          block=''.join(f'  {json.dumps(k,ensure_ascii=False)}: {json.dumps(v,ensure_ascii=False)},\n' for k,v in entries.items())
          if '"Only the explicitly shared categories for the selected month."' not in s: s=s.replace(marker,block+marker)
          p.write_text(s)

          p=Path('src/components/LogSheet.tsx'); s=p.read_text()
          s=s.replace('className="mt-2 flex flex-wrap justify-center gap-1.5 px-1"','className="mt-2 flex flex-nowrap items-center justify-center gap-0.5 px-0"',1)
          s=s.replace('className={`h-8 w-8 rounded-full text-[11px] font-semibold transition ${','className={`h-7 w-7 shrink-0 rounded-full text-[10px] font-semibold transition ${',1)
          s=s.replace('>{f}\n            </Chip>','>{t(f)}\n            </Chip>')
          s=s.replace("Saved with this workout only — it doesn't change your daily weight.",'{t("Saved with this workout only — it doesn\'t change your daily weight.")}')
          s=s.replace('<p className="text-xs uppercase tracking-wider text-muted-foreground">{today ? "Today" : date}</p>','<p className="text-xs uppercase tracking-wider text-muted-foreground">{today ? t("Today") : date}</p>')
          s=s.replace('>As needed{m.dose ? ` · ${m.dose}` : ""}</p>','>{t("As needed")}{m.dose ? ` · ${m.dose}` : ""}</p>')
          s=s.replace('>\n              Saved weight measurements\n            </p>','>{t("Saved weight measurements")}</p>')
          s=s.replace('>Clear postpartum symptoms\n        </button>','>{t("Clear postpartum symptoms")}\n        </button>')
          p.write_text(s)

          p=Path('src/routes/couple.tsx'); s=p.read_text()
          s=s.replace('          You — solid','          {t("You — solid")}')
          for x in ['Only the explicitly shared categories for the selected month.','Daily average pain. Tap a bar to see its value. Solid bars are yours; striped bars belong to Partner.','Solid bars are yours. Striped bars belong to your partner.']:
              s=s.replace(x,'{t('+json.dumps(x)+')}')
          p.write_text(s)
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-slovak-leftovers.yml
          git add src/components/LogSheet.tsx src/lib/i18n.ts src/routes/couple.tsx
          git commit -m "Translate remaining Slovak UI and compact workout RPE"
          git push
