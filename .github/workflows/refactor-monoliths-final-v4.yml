name: Refactor monoliths final v4
on:
  push:
    paths:
      - '.github/workflows/refactor-monoliths-final-v4.yml'
permissions:
  contents: write
concurrency:
  group: bixbo-monolith-final-v4
  cancel-in-progress: false
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run corrected modularizer and update source-location regression tests
        run: |
          python3 <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/refactor-monoliths-final-once.yml').read_text()
          start=src.index("          const ts = require('typescript');")
          end=src.index("\n          JS",start)
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())
          script=script.replace("const body=selected.map(d=>exportify(d.st,sf,text)).join('\\n\\n');","const body=selected.map(d=>{ let s=exportify(d.st,sf,text); if(opts.adjustBody) s=opts.adjustBody(s); return s; }).join('\\n\\n');")
          script=script.replace("defaults:d=>d.start>=883&&d.start<1008,","defaults:d=>d.start>=883&&d.start<974,")
          script=script.replace("runtime:d=>d.start>=1526&&d.start<2149,","runtime:d=>(d.start>=1526&&d.start<2149)||d.names.includes('hasStoredBixboSnapshot')||d.names.includes('clearBixboLocalStorage'),")
          old="buildGroupedModules(source,'src/lib/storage',groups,{ext:'ts',adjustImports:s=>s.replace(/\"\\.\\//g,'\"../'),extraPrelude:{types:exportDecls}});"
          new="buildGroupedModules(source,'src/lib/storage',groups,{ext:'ts',adjustImports:s=>s.replace(/\"\\.\\//g,'\"../'),adjustBody:s=>s.replace(/\"\\.\\//g,'\"../'),extraPrelude:{types:exportDecls}});"
          script=script.replace(old,new)
          marker="// Remove temporary one-shot audit/refactor workflows."
          patch=r'''// Repair strict callback inference already present on main.
          {
            const p='src/components/CustomLogBuilder.tsx'; let s=read(p);
            s=s.replace('(field.options ?? []).map((option, optionIndex) => (','(field.options ?? []).map((option: string, optionIndex: number) => (');
            s=s.replace('(field.options ?? []).filter((_, i) => i !== optionIndex)','(field.options ?? []).filter((_: string, i: number) => i !== optionIndex)');
            write(p,s);
          }

          // Keep source-inspection regression tests pointed at the new modular source files.
          {
            const p='src/lib/__tests__/admin-button-wiring.test.ts'; let s=read(p);
            s=s.replace('expect(src("src/routes/patterns.tsx")).toContain("data-bixbo-pattern-tab");','expect(src("src/features/patterns/shared.tsx")).toContain("data-bixbo-pattern-tab");');
            write(p,s);
          }
          {
            const p='src/lib/__tests__/pain-symptom-update-regression.test.ts'; let s=read(p);
            const old='readFileSync(resolve(process.cwd(), "src/components/LogSheet.tsx"), "utf8")';
            const repl='[readFileSync(resolve(process.cwd(), "src/components/LogSheet.tsx"), "utf8"), readFileSync(resolve(process.cwd(), "src/features/logging/LogSheetRoot.tsx"), "utf8"), readFileSync(resolve(process.cwd(), "src/features/logging/PainWizard.tsx"), "utf8")].join("\\n")';
            s=s.split(old).join(repl);
            write(p,s);
          }

          '''
          script=script.replace(marker,patch+marker)
          Path('refactor-monoliths.cjs').write_text(script)
          PY
          node refactor-monoliths.cjs
          rm refactor-monoliths.cjs
      - name: Verify everything
        run: |
          bun run typecheck
          bun test
          bun run build
          python3 <<'PY'
          from pathlib import Path
          roots=['src/components/LogSheet.tsx','src/routes/patterns.tsx','src/routes/profile.tsx','src/lib/storage.ts','src/lib/i18n.ts']
          for p in roots: print('ROOT',p,Path(p).stat().st_size)
          bad=[]
          for d in ['src/features/logging','src/features/patterns','src/features/profile','src/lib/storage','src/lib/i18n']:
            for p in Path(d).glob('*.ts*'):
              n=p.stat().st_size; print(p,n)
              if n>50000: bad.append((str(p),n))
          if bad: raise SystemExit('oversized modules remain: '+repr(bad))
          PY
      - name: Commit verified result
        run: |
          rm -f .github/workflows/refactor-monoliths-final-v4.yml .github/workflows/refactor-monoliths-final-v3.yml .github/workflows/refactor-monoliths-final-v2.yml .github/workflows/refactor-monoliths-final-once.yml .github/workflows/audit-monolith-structure-once.yml .github/workflows/audit-large-components-once.yml .github/workflows/refactor-i18n-locales-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: modularize remaining monoliths"
          git fetch origin main
          git rebase origin/main
          git push origin main
