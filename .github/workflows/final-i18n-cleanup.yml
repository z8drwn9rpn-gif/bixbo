name: Final i18n cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-i18n-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final i18n cleanup
        run: python .github/scripts/final_i18n_cleanup.py
      - name: Commit cleanup
        run: |
          rm -f .github/scripts/final_i18n_cleanup.py
          rm -f .github/scripts/i18n_audit.py
          rm -f .github/workflows/i18n-audit-temp.yml
          rm -f .github/workflows/final-i18n-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete remaining i18n UI cleanup"
          git push
