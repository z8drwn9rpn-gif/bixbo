name: One-time verify Home dose popup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.head_commit.message == 'Trigger full quality check for Home dose popup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Clean temporary workflow
        run: |
          rm -f .github/workflows/one-time-verify-home-dose-popup.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Home dose quality workflow"
          git push origin HEAD:main
# Trigger full quality check for Home dose popup
