name: Activate BIXBO UI polish once

on:
  push:
    branches: [agent/ui-ux-consistency-pass]
    paths:
      - .github/workflows/ui-ux-calendar-icons-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-ux-consistency-pass
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Import final UI polish layers
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/styles.css')
          s = p.read_text()
          marker = '@import "tw-animate-css";\n'
          addition = '@import "./ui-polish.css";\n@import "./ui-components-polish.css";\n'
          if addition not in s:
              if marker not in s:
                  raise SystemExit('styles.css import marker not found')
              s = s.replace(marker, marker + addition, 1)
          p.write_text(s)
      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit changes
        run: |
          git config user.name "BIXBO UI bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "style: activate final UI polish layers"
          git push origin HEAD:agent/ui-ux-consistency-pass
