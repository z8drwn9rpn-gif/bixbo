name: Apply BIXBO Health Hub polish once

on:
  push:
    branches: [agent/ui-ux-consistency-pass]
    paths:
      - .github/workflows/ui-ux-calendar-icons-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-ux-consistency-pass
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch Health Hub layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/profile/shared.tsx')
          s = p.read_text()
          replacements = [
            ('<div className="space-y-5 px-5 pb-28 pt-4">', '<div className="space-y-5 px-5 pb-28 pt-4 lg:px-0 lg:pb-12">'),
            ('<div className="space-y-4 px-5 pb-28 pt-4">{children}</div>', '<div className="space-y-4 px-5 pb-28 pt-4 lg:px-0 lg:pb-12">{children}</div>'),
            ('className="flex w-full items-center gap-3 px-4 py-3 text-left transition hover:bg-tint"', 'className="flex min-h-[68px] w-full items-center gap-3 px-4 py-3 text-left transition hover:bg-tint focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring"'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Health Hub target not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit changes
        run: |
          git config user.name "BIXBO UI bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/profile/shared.tsx
          git diff --cached --quiet && exit 0
          git commit -m "polish Health Hub responsive layout"
          git push origin HEAD:agent/ui-ux-consistency-pass
