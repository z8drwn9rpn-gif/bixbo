name: Apply BIXBO Home icon polish once

on:
  push:
    branches: [agent/ui-ux-consistency-pass]
    paths:
      - .github/workflows/ui-ux-calendar-icons-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-ux-consistency-pass
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch Home greeting icon
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/home/HomePage.tsx')
          s = p.read_text()
          old_import = 'import { ChevronLeft, ChevronRight, HeartIcon, Ico } from "@/components/icons/BixboIcons";'
          new_import = 'import { ChevronLeft, ChevronRight, HeartIcon, StarIcon } from "@/components/icons/BixboIcons";'
          old_title = '<span className="text-xs font-normal text-muted-foreground">{t("Hi")}, {view.settings.userName?.trim() || t("there")} <Ico e="❤️" size={12} /></span>'
          new_title = '<span className="text-xs font-normal text-muted-foreground">{t("Hi")}, {view.settings.userName?.trim() || t("there")} <StarIcon size={12} /></span>'
          if old_import not in s or old_title not in s:
              raise SystemExit('Home greeting targets not found')
          s = s.replace(old_import, new_import, 1).replace(old_title, new_title, 1)
          p.write_text(s)
      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit changes
        run: |
          git config user.name "BIXBO UI bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/home/HomePage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "replace Home greeting heart with BIXBO star"
          git push origin HEAD:agent/ui-ux-consistency-pass
