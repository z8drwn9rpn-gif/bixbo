name: Apply BIXBO UI UX detail polish once

on:
  push:
    branches: [agent/ui-ux-consistency-pass]
    paths:
      - .github/workflows/ui-ux-calendar-icons-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-ux-consistency-pass
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch overview and profile UI
        shell: python
        run: |
          from pathlib import Path

          day = Path('src/components/home/DayOverview.tsx')
          s = day.read_text()
          replacements = [
            ('className="mx-5 mt-4 rounded-3xl bg-surface p-6 text-center ring-1 ring-border"', 'className="mx-5 mt-4 rounded-3xl border border-border/70 bg-surface p-6 text-center shadow-sm ring-1 ring-border lg:mx-0"'),
            ('<div className="space-y-3 px-5 pt-3 pb-32">', '<div className="space-y-3 px-5 pt-3 pb-32 lg:px-0 lg:pb-12">'),
            ('className={`rounded-3xl bg-surface ring-1 ring-border ${compact ? "px-4 py-3" : "p-4"}`}', 'className={`rounded-3xl border border-border/70 bg-surface shadow-sm ring-1 ring-border ${compact ? "px-4 py-3" : "p-4"}`}'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'DayOverview target not found: {old}')
              s = s.replace(old, new, 1)
          day.write_text(s)

          profile = Path('src/features/profile/shared.tsx')
          p = profile.read_text()
          marker = 'export function DoctorForm('
          before, after = p.split(marker, 1)
          old_grid = '<div className="grid grid-cols-2 gap-2">'
          if old_grid not in after:
              raise SystemExit('DoctorForm grid target not found')
          after = after.replace(old_grid, '<div className="grid grid-cols-1 gap-2 sm:grid-cols-2">', 1)
          p = before + marker + after
          old_select = 'className="h-11 w-full rounded-md border border-input bg-background px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"'
          if old_select not in p:
              raise SystemExit('SelectField target not found')
          p = p.replace(old_select, 'className="h-11 w-full rounded-xl border border-input bg-background px-3 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"', 1)
          profile.write_text(p)
      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit changes
        run: |
          git config user.name "BIXBO UI bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx src/features/profile/shared.tsx
          git diff --cached --quiet && exit 0
          git commit -m "polish day overview and profile responsiveness"
          git push origin HEAD:agent/ui-ux-consistency-pass
