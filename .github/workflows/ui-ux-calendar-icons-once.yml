name: Apply BIXBO calendar heart marker once

on:
  push:
    branches: [agent/ui-ux-consistency-pass]
    paths:
      - .github/workflows/ui-ux-calendar-icons-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-ux-consistency-pass
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch calendar marker rendering
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/components/MonthCalendar.tsx')
          s = p.read_text()
          pattern = re.compile(
              r'<div className="mt-0\.5 flex h-4 max-w-full items-center justify-center gap-px overflow-hidden leading-none lg:mt-1 lg:h-5 lg:gap-0\.5">\s*'
              r'\{icons\.length > 0 \? \(.*?\) : \(\s*'
              r'<span aria-hidden className="block h-\[14px\] w-\[14px\] lg:h-\[17px\] lg:w-\[17px\]" />\s*'
              r'\)\}\s*</div>',
              re.S,
          )
          replacement = '''<div className="mt-0.5 flex h-4 items-center justify-center leading-none lg:mt-1 lg:h-5">
                        {icons.includes("❤️") ? (
                          <Ico e="❤️" size={14} className="h-[14px] w-[14px] lg:h-[17px] lg:w-[17px] xl:h-[18px] xl:w-[18px]" />
                        ) : (
                          <span aria-hidden className="block h-[14px] w-[14px] lg:h-[17px] lg:w-[17px]" />
                        )}
                      </div>'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one calendar marker block, found {count}')
          p.write_text(s2)
      - name: Install and validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit changes
        run: |
          git config user.name "BIXBO UI bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/MonthCalendar.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep only calendar heart marker"
          git push origin HEAD:agent/ui-ux-consistency-pass
