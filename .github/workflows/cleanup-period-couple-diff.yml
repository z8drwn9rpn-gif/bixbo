name: Clean Period Couple diff
on:
  push:
    branches: [agent/fix-period-couple-current-main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-period-couple-current-main
          fetch-depth: 0
      - name: Restore generated route tree from main
        run: |
          git fetch origin main
          git checkout origin/main -- src/routeTree.gen.ts
          rm -f .github/workflows/cleanup-period-couple-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated route tree noise"
          git push origin HEAD:agent/fix-period-couple-current-main
