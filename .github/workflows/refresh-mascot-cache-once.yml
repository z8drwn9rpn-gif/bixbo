name: Refresh mascot cache once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-mascot-cache-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh mascot URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/home/HomePage.tsx')
          s = p.read_text()
          s = s.replace('/bixbo-mascot-user.png?v=20260813-real', '/bixbo-mascot-user.png?v=20260813-full')
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          rm -f .github/workflows/refresh-mascot-cache-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.tsx .github/workflows/refresh-mascot-cache-once.yml
          git commit -m "fix: refresh full mascot asset cache"
          git pull --rebase origin main
          git push origin HEAD:main
