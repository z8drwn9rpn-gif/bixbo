name: Stability refactor stage 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger stability refactor stage 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply refactor
        run: |
          python3 scripts/stability-refactor-stage2.py
          # The Home route still uses today's values in other cards. Restore it,
          # then extract only the header UI so no shared route state is removed.
          git checkout HEAD -- src/routes/index.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          anchor = 'import { DayPreview, ShareDayButton } from "@/components/home/DayOverview";\n'
          if anchor not in s:
              raise SystemExit('Home import anchor missing')
          s = s.replace(anchor, anchor + 'import { TodayHeaderSummary } from "@/components/home/TodayHeaderSummary";\n', 1)
          old = '''          <button
            type="button"
            onClick={() => {
              setSummaryMode("today");
              setSummaryMonthAnchor(new Date());
              setTodayOpen(true);
            }}
            className="flex min-w-[82px] flex-col items-end justify-center rounded-2xl px-2 py-1 transition hover:bg-tint"
            aria-label={t("Open today's summary")}
          >
            <span className="text-[10px] font-semibold leading-none text-muted-foreground">{t("Today")}</span>
            <span className="mt-1 flex items-center gap-1 whitespace-nowrap text-[11px] font-semibold leading-none text-foreground">
              <Ico name="flame" size={14} /> {todayPain != null ? todayPain.toFixed(1) : "—"}
              <span className="text-muted-foreground">·</span>
              <PillIcon size={14} /> {todayMedsTaken}/{todayScheduled.length}
            </span>
          </button>
'''
          new = '''          <TodayHeaderSummary
            data={view}
            onOpen={() => {
              setSummaryMode("today");
              setSummaryMonthAnchor(new Date());
              setTodayOpen(true);
            }}
          />
'''
          if old not in s:
              raise SystemExit('Home Today header block missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Full verification
        run: |
          test ! -f .env
          test -f .env.example
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified changes
        run: |
          rm -f scripts/stability-refactor-stage2.py .github/workflows/stability-refactor-stage2.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete stability refactor and meds centralization"
          git push origin HEAD:main
