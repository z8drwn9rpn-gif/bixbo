name: Stability refactor stage 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger stability refactor stage 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply refactor
        run: python3 scripts/stability-refactor-stage2.py
      - name: Full verification
        run: |
          test ! -f .env
          test -f .env.example
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified changes
        run: |
          rm -f scripts/stability-refactor-stage2.py .github/workflows/stability-refactor-stage2.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete stability refactor and meds centralization"
          git push origin HEAD:main
