name: Fix urinary-only bowel once
on:
  push:
    branches: [agent/fix-urinary-only-bowel]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[urinary-only-bowel]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-urinary-only-bowel
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch urinary-only flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Explicitly mark urinary-only entries in the existing BowelEntry model.
          p = Path('src/lib/storage/types.ts')
          s = p.read_text()
          old = '''export interface BowelEntry {\n  id: string;\n  time: string;\n  bristol: number;\n  note?: string;\n  feelings?: string[];\n  symptoms?: string[];\n  urinary?: string[];\n}'''
          new = '''export interface BowelEntry {\n  id: string;\n  time: string;\n  bristol: number;\n  /** True when this entry contains urinary data only and no bowel movement was logged. */\n  urinaryOnly?: boolean;\n  note?: string;\n  feelings?: string[];\n  symptoms?: string[];\n  urinary?: string[];\n}'''
          if old not in s:
              raise SystemExit('BowelEntry interface pattern not found')
          p.write_text(s.replace(old, new, 1))

          # 2) No default Type 4. A user can save urinary without choosing a bowel type.
          p = Path('src/features/logging/LifestyleForms.tsx')
          s = p.read_text()
          old = '  const [bristol, setBristol] = useState<number>(initialEntry?.bristol ?? 4);'
          new = '  const [bristol, setBristol] = useState<number | null>(initialEntry?.urinaryOnly ? null : (initialEntry?.bristol ?? null));'
          if old not in s:
              raise SystemExit('Bristol default state pattern not found')
          s = s.replace(old, new, 1)

          old = '''  const save = () => {\n    const editing = !!initialEntry;\n    const entry: BowelEntry = {\n      id: initialEntry?.id ?? schema?.sourceEntryId ?? crypto.randomUUID(),\n      time,\n      bristol,'''
          new = '''  const save = () => {\n    if (bristol == null && urinary.length === 0) return;\n    const editing = !!initialEntry;\n    const urinaryOnly = bristol == null && urinary.length > 0;\n    const entry: BowelEntry = {\n      id: initialEntry?.id ?? schema?.sourceEntryId ?? crypto.randomUUID(),\n      time,\n      bristol: urinaryOnly ? -2 : (bristol as number),\n      urinaryOnly: urinaryOnly || undefined,'''
          if old not in s:
              raise SystemExit('Bowel save pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Overview: urinary-only entries render in their own Urinary card,
          # and are excluded from the Bowel card entirely.
          p = Path('src/components/home/DayOverview.tsx')
          s = p.read_text()
          anchor = '  const cycleTrackingHidden = isCycleTrackingHidden(data);\n'
          insert = '''  const cycleTrackingHidden = isCycleTrackingHidden(data);\n  const urinaryOnlyEntries = (log?.bowel ?? []).filter((entry) => entry.urinaryOnly || entry.bristol === -2);\n  const bowelEntries = (log?.bowel ?? []).filter((entry) => !entry.urinaryOnly && entry.bristol !== -2);\n'''
          if anchor not in s:
              raise SystemExit('DayOverview cycleTrackingHidden anchor not found')
          s = s.replace(anchor, insert, 1)

          old_start = '      {log?.bowel?.length ? (\n        <Card title="Bowel" icon="💩" compact>\n          <ul className="space-y-1">\n            {log.bowel.map((b: BowelEntry, index) => {'
          new_start = '      {bowelEntries.length ? (\n        <Card title="Bowel" icon="💩" compact>\n          <ul className="space-y-1">\n            {bowelEntries.map((b: BowelEntry, index) => {'
          if old_start not in s:
              raise SystemExit('Bowel overview start pattern not found')
          s = s.replace(old_start, new_start, 1)

          marker = '''      ) : null}\n\n      {log?.workout?.length ? ('''
          urinary_card = '''      ) : null}\n\n      {urinaryOnlyEntries.length ? (\n        <Card title="Urinary" icon="💧" compact>\n          <ul className="space-y-1">\n            {urinaryOnlyEntries.map((b: BowelEntry, index) => (\n              <li key={b.id} className={`flex items-start gap-2 ${index ? "border-t border-border/60 pt-1.5" : ""}`}>\n                <button onClick={() => onEdit?.("bowel", b)} className="min-w-0 flex-1 text-left">\n                  <p className="text-xs text-muted-foreground">{b.time}</p>\n                  <div className="my-1 border-t border-border/60" />\n                  {b.urinary?.length ? (\n                    <p className="text-xs leading-relaxed text-muted-foreground">\n                      <span className="font-semibold text-foreground">{t("Urinary")}:</span>{" "}\n                      <IcoText text={b.urinary.map(t).join(", ")} size={13} />\n                    </p>\n                  ) : null}\n                  {b.note ? (\n                    <p className="mt-1 text-xs leading-snug whitespace-pre-line">\n                      <span className="font-semibold">{t("Note")}:</span> {b.note}\n                    </p>\n                  ) : null}\n                  <p className="mt-0.5 text-[10px] text-primary">{t("Tap to edit")}</p>\n                </button>\n                <DeleteBtn\n                  onClick={() =>\n                    update((d) => ({\n                      ...d,\n                      dayLogs: {\n                        ...d.dayLogs,\n                        [date]: {\n                          ...d.dayLogs[date],\n                          bowel: (d.dayLogs[date]?.bowel ?? []).filter((x) => x.id !== b.id),\n                        },\n                      },\n                    }))\n                  }\n                />\n              </li>\n            ))}\n          </ul>\n        </Card>\n      ) : null}\n\n      {log?.workout?.length ? ('''
          if marker not in s:
              raise SystemExit('Workout marker after Bowel block not found')
          s = s.replace(marker, urinary_card, 1)
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/fix-urinary-only-bowel-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate urinary-only entries from bowel overview [urinary-only-bowel]"
          git push origin HEAD:agent/fix-urinary-only-bowel