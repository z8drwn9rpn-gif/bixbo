name: Final i18n render audit
on:
  push:
    paths:
      - '.github/workflows/final-i18n-render-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan direct render strings
        run: python3 .github/scripts/final_i18n_render_audit.py
