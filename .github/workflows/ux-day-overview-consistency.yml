name: Day Overview UX consistency
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run Day Overview UX consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply UX patch
        run: python3 scripts/ux-day-overview-consistency.py
      - name: Verify complete app
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified UX changes and clean temporary patch files
        run: |
          rm -f scripts/ux-day-overview-consistency.py .github/workflows/ux-day-overview-consistency.yml
          rm -f scripts/format-blueberry-pain-notes.py .github/workflows/format-blueberry-pain-notes.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Unify Day Overview log card UX"
          git push origin HEAD:main
