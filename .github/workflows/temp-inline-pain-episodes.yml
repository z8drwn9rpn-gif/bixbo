name: Inline Pain episode forms

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-inline-pain-episodes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Pain Episodes inline
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/logging/PainWizard.tsx
          git rm .github/workflows/temp-inline-pain-episodes.yml
          git commit -m "Keep Tetany and Panic inline in Pain Episodes"
          git push
