name: Fix Histamine flare typography

on:
  push:
    branches:
      - fix/histamine-flare-typography-2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[flare-typography-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/histamine-flare-typography-2
          fetch-depth: 0

      - name: Patch Histamine flare style
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/home/DayOverview.tsx')
          text = path.read_text()
          old = '''                  {f.histamineFlare ? (\n                    <p className="mt-px text-xs font-semibold leading-relaxed text-destructive">\n                      <span className="inline-flex items-center gap-1 align-middle">\n                        <Ico e="🔥" size={13} />\n                        <span>{t("Histamine flare")}:</span>\n                      </span>{" "}\n                      <span>{f.histamineSymptoms?.length ? f.histamineSymptoms.join(", ") : t("Yes")}</span>\n                    </p>\n                  ) : null}'''
          new = '''                  {f.histamineFlare ? (\n                    <p\n                      className="mt-px text-xs leading-relaxed text-destructive"\n                      style={{ color: "var(--destructive)", fontWeight: 700 }}\n                    >\n                      <span className="inline-flex items-center gap-1 align-middle">\n                        <Ico e="🔥" size={13} />\n                        <span>{t("Histamine flare")}:</span>\n                      </span>{" "}\n                      <span>{f.histamineSymptoms?.length ? f.histamineSymptoms.join(", ") : t("Yes")}</span>\n                    </p>\n                  ) : null}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Histamine flare block, found {count}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-histamine-flare-typography.yml').unlink()
          PY

          git config user.name "bixbo-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx .github/workflows/fix-histamine-flare-typography.yml
          git commit -m "Fix Histamine flare typography override [flare-typography-fixed]"
          git push origin HEAD:fix/histamine-flare-typography-2
