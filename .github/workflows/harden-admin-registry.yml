name: Harden BIXBO admin registry
on:
  push:
    paths:
      - '.github/workflows/harden-admin-registry.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/harden-admin-registry.py
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Verify hardening
        run: |
          grep -q 'getRegistryFeature(data, id).icon' src/components/MonthCalendar.tsx
          grep -q 'label: getRegistryFeature(data, option.id).label' src/routes/insights.tsx
          grep -q 'preserves admin registry configuration through cloud merge' src/lib/__tests__/appRegistry.test.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'Harden BIXBO Admin Registry integration'
          git push
