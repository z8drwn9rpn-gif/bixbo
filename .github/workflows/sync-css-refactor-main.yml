name: Sync CSS refactor with main

on:
  push:
    branches:
      - refactor/css-component-architecture

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[main-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/css-component-architecture
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bixbo-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "Merge latest main into CSS architecture refactor [main-synced]"
          rm .github/workflows/sync-css-refactor-main.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:refactor/css-component-architecture
