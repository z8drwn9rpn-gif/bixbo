name: Fix PDF export link
on:
  push:
    paths:
      - '.github/workflows/fix-pdf-export-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Patch Export section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/routes/profile.tsx')
          s=p.read_text(encoding='utf-8')
          export_pos=s.find('if (healthView === "export")')
          if export_pos < 0:
              raise SystemExit('Export section not found')
          head=s[:export_pos]
          tail=s[export_pos:]
          if '{t("PDF Reports")}' not in tail[:3000]:
              addition='''
          <Link
            to="/report"
            className="inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-primary/10 px-4 text-sm font-semibold text-primary ring-1 ring-primary/20"
          >
            {t("PDF Reports")}
          </Link>'''
              pattern=r'(Export daily health CSV\s*</button>)'
              tail2,count=re.subn(pattern,lambda m:m.group(1)+addition,tail,count=1)
              if count != 1:
                  raise SystemExit('CSV button text not found in Export section')
              s=head+tail2
              p.write_text(s,encoding='utf-8')
          PY
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/profile.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix PDF reports link in Health Export'
            git push
          fi
