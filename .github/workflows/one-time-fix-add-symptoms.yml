name: One-time Add symptoms fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/fix-add-symptoms-once.py
      - name: Commit
        run: |
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Pain add symptoms flow without duplicating pain"
          git push origin HEAD:main
