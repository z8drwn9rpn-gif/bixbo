name: Remove unused cloud auth dependency

on:
  push:
    branches: [code-audit-hardening-no-notes]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Remove unused cloud auth package') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code-audit-hardening-no-notes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Remove unused dependency
        run: bun remove @lovable.dev/cloud-auth-js
      - name: Commit lockfile cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Remove unused cloud auth package"
          git push origin HEAD:code-audit-hardening-no-notes
