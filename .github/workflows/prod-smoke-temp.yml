name: Temporary production smoke

on:
  push:
    branches: [code-audit-hardening-no-notes]

jobs:
  prod-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment and verify production
        shell: bash
        run: |
          set -euo pipefail
          base="https://bixbo.z8drwn9rpn.workers.dev"
          for attempt in $(seq 1 30); do
            echo "Production check attempt ${attempt}/30"
            ok=1
            curl -fsS --max-time 15 "$base/" -o /tmp/root.html || ok=0
            curl -fsS --max-time 15 "$base/auth" -o /tmp/auth.html || ok=0
            curl -fsS --max-time 15 "$base/manifest.json" -o /tmp/manifest.json || ok=0
            curl -fsS --max-time 15 "$base/bixbo-push-sw.js" -o /tmp/sw.js || ok=0
            if [ "$ok" -eq 1 ] && grep -q 'BIXBO\|Bixbo' /tmp/root.html && grep -q '"name"' /tmp/manifest.json; then
              echo "BIXBO production smoke passed."
              echo "root=$(wc -c </tmp/root.html) bytes auth=$(wc -c </tmp/auth.html) bytes manifest=$(wc -c </tmp/manifest.json) bytes sw=$(wc -c </tmp/sw.js) bytes"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become healthy within the retry window."
          exit 1
