name: Apply HAK custom sections
on:
  push:
    branches: [agent/hak-custom-sections]
    paths:
      - .github/workflows/apply-hak-custom-sections.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hak-custom-sections
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_hak_custom_sections.py
      - run: rm .github/scripts/apply_hak_custom_sections.py .github/workflows/apply-hak-custom-sections.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/appRegistry.ts src/lib/effectiveAdminConfig.ts src/routes/index.tsx src/components/HakAdminEditOverlay.tsx src/lib/__tests__/hak-custom-blocks.test.ts .github
          git commit -m 'add admin custom sections inside HAK'
          git push origin HEAD:agent/hak-custom-sections
