name: Temporary non-Notes lint cleanup

on:
  push:
    branches: [audit-final-cleanup-no-notes]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Clean non-Notes lint warnings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-final-cleanup-no-notes
      - name: Match current source shapes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/fix_lint_cleanup.py')
          s = p.read_text()
          s = s.replace(
              '"  }, [cells, cycleTrackingHidden, data.dayLogs, data.settings.adminConfig, data.settings.birthControlSince, predictedKeys]);",',
              '"  }, [cells, cycleTrackingHidden, data.cycle.lastPeriodEnd, data.cycle.lastPeriodStart, data.dayLogs, predictedKeys]);",',
              1,
          )
          old = '''one(
              "src/components/home/BirthControlCard.tsx",
              "  }, []);\\n",
              "  }, [hakTheme.background]);\\n",
              "BirthControl effect dependency",
          )'''
          new = '''one(
              "src/components/home/BirthControlCard.tsx",
              "      } else if (themeMeta) {\\n        themeMeta.content = previousThemeColor;\\n      }\\n    };\\n  }, []);",
              "      } else if (themeMeta) {\\n        themeMeta.content = previousThemeColor;\\n      }\\n    };\\n  }, [hakTheme.background]);",
              "BirthControl effect dependency",
          )'''
          if old not in s:
              raise SystemExit('BirthControl cleanup-script block missing')
          s = s.replace(old, new, 1)
          s = s.replace('anchor = "export function LogSheetRoot("', 'anchor = "export function LogSheet("', 1)
          p.write_text(s)
          PY
      - name: Apply focused lint correctness fixes
        run: python3 scripts/fix_lint_cleanup.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Clean non-Notes lint warnings"
          git push origin HEAD:audit-final-cleanup-no-notes
