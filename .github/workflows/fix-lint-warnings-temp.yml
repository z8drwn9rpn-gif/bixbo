name: Temporary non-Notes lint cleanup

on:
  push:
    branches: [audit-final-cleanup-no-notes]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Clean non-Notes lint warnings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-final-cleanup-no-notes
      - name: Apply focused lint correctness fixes
        run: python3 scripts/fix_lint_cleanup.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Clean non-Notes lint warnings"
          git push origin HEAD:audit-final-cleanup-no-notes
