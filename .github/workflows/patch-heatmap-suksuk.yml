name: Patch Heatmap Suksuk

on:
  push:
    branches:
      - agent/heatmap-suksuk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/heatmap-suksuk
      - name: Apply exact Heatmap patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/insights.tsx')
          text = path.read_text()

          replacements = [
              (
                  'type HeatmapMetric = "pain" | "period" | "bowel" | "panic" | "tetany" | "hotFlashes" | "sleep" | `custom:${string}:${string}`;',
                  'type HeatmapMetric = "pain" | "period" | "bowel" | "panic" | "tetany" | "hotFlashes" | "sleep" | "sex" | `custom:${string}:${string}`;'
              ),
              (
                  '  { id: "sleep", label: "Sleep" },\n];',
                  '  { id: "sleep", label: "Sleep" },\n  { id: "sex", label: "ŠukŠuk!" },\n];'
              ),
              (
                  '''      const hours = log.sleepHours ?? log.pregnancy?.sleepHours ?? log.postpartum?.sleepHours;\n      if (hours == null || !Number.isFinite(hours)) return null;''',
                  '''      if (selectedMetric === "sex") {\n        const entries = log.sex ?? [];\n        if (!entries.length) return null;\n\n        const feature = getRegistryFeature(data, "sex");\n        const latest = entries[entries.length - 1];\n        const kindLabels: Record<string, string> = {\n          sex: "Sex",\n          fingering: "Fingering",\n          suck_dick: "Oral — giving",\n          oral: "Oral",\n          other: "Other",\n          sex_with_condom: "Sex with condom",\n          sex_without_condom: "Sex without condom",\n          oral_giving: "Oral — giving",\n          oral_receiving: "Oral — receiving",\n        };\n        const latestKind = kindLabels[latest.kind] ?? String(latest.kind);\n\n        return {\n          color: feature.color,\n          tooltipColor: feature.color,\n          value: `${entries.length}×`,\n          popupValue: feature.label,\n          description: `Latest: ${latestKind}`,\n          entryCount: entries.length,\n        };\n      }\n\n      const hours = log.sleepHours ?? log.pregnancy?.sleepHours ?? log.postpartum?.sleepHours;\n      if (hours == null || !Number.isFinite(hours)) return null;'''
              ),
              (
                  '''    if (metric === "sleep") {\n      return [''',
                  '''    if (metric === "sex") {\n      const feature = getRegistryFeature(data, "sex");\n      return [[feature.label, feature.color]] as const;\n    }\n\n    if (metric === "sleep") {\n      return ['''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Remove temporary workflow from resulting commit
        run: rm .github/workflows/patch-heatmap-suksuk.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/insights.tsx .github/workflows/patch-heatmap-suksuk.yml
          git commit -m "fix ŠukŠuk heatmap metric"
          git push origin HEAD:agent/heatmap-suksuk
