name: Apply requested UI fixes 2026-08-12

on:
  push:
    paths:
      - scripts/apply_requested_ui_fixes_20260812.py
      - .github/workflows/apply-requested-ui-fixes-20260812.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        run: python scripts/apply_requested_ui_fixes_20260812.py
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/report.tsx src/lib/appRegistry.ts src/components/LogSheet.tsx src/components/CustomLogBuilder.tsx src/routes/insights.tsx src/routes/notes-editor.tsx src/routes/profile.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix PDF, logs, notes, Heatmap and profile UI"
            git push origin HEAD:main
          fi
