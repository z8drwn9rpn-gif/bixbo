name: Clear day-level admin fields
on:
  push:
    branches: [agent/clear-day-level-admin-fields]
    paths:
      - '.github/scripts/clear_day_level_admin_fields.py'
      - '.github/workflows/clear-day-level-admin-fields.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clear-day-level-admin-fields
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/clear_day_level_admin_fields.py
      - run: rm .github/scripts/clear_day_level_admin_fields.py .github/workflows/clear-day-level-admin-fields.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'clear day-level admin fields with core data'
          git push origin HEAD:agent/clear-day-level-admin-fields
