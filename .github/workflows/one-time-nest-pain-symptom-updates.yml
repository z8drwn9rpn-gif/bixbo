name: One-time nest pain symptom updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time pain symptom nesting fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused pain follow-up patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/routes/index.tsx')
          s = path.read_text()

          start_marker = '      {(log?.pain?.some((entry) => entry.entryKind !== "symptom-update") && ('
          next_marker = '      {log?.pain?.some((entry) => entry.entryKind === "symptom-update") ? ('
          start = s.index(start_marker)
          next_pos = s.index(next_marker, start)
          pain = s[start:next_pos]

          old_li = '<li key={p.id} className="flex items-start gap-3">'
          if old_li not in pain:
            raise SystemExit('Pain row marker not found')
          pain = pain.replace(old_li, '<li key={p.id} className="flex flex-wrap items-start gap-3">', 1)

          close_marker = '''                />\n              </li>'''
          close_pos = pain.rfind(close_marker)
          if close_pos < 0:
            raise SystemExit('Pain row closing marker not found')

          nested = '''                />
                {log.pain.some((entry) => entry.entryKind === "symptom-update" && entry.sourcePainId === p.id) ? (
                  <div className="basis-full pl-12 pr-7">
                    <div className="mt-1 space-y-2 border-l-2 border-primary/25 pl-3">
                      {log.pain
                        .filter((entry) => entry.entryKind === "symptom-update" && entry.sourcePainId === p.id)
                        .map((entry) => (
                          <div key={entry.id} className="flex items-start gap-2 rounded-xl bg-primary/5 px-2.5 py-2 ring-1 ring-primary/15">
                            <button onClick={() => onEditPain?.(entry)} className="min-w-0 flex-1 text-left">
                              <p className="text-[11px] font-semibold text-primary">{entry.time} · {t("Add symptoms")}</p>
                              {entry.symptoms.length > 0 ? <p className="mt-0.5 text-sm">{entry.symptoms.map(t).join(", ")}</p> : null}
                              {entry.nausea || entry.nauseaSeverity != null || entry.nauseaTypes?.length ? (
                                <p className="text-sm">{t("Nausea")}{entry.nauseaSeverity != null ? ` ${entry.nauseaSeverity}/10` : ""}{entry.nauseaTypes?.length ? ` · ${entry.nauseaTypes.map(t).join(", ")}` : ""}</p>
                              ) : null}
                              {entry.headache || entry.headacheIntensity != null || entry.headacheTypes?.length ? (
                                <p className="text-sm">{t("Headache")}{entry.headacheIntensity != null ? ` ${entry.headacheIntensity}/10` : ""}{entry.headacheTypes?.length ? ` · ${entry.headacheTypes.map(t).join(", ")}` : ""}</p>
                              ) : null}
                              {entry.hotFlashesOn || entry.hotFlashes != null ? <p className="text-sm">{t("Hot flashes")}{entry.hotFlashes != null ? ` ${entry.hotFlashes}/5` : ""}</p> : null}
                              {entry.pcosSymptoms?.length ? <p className="text-sm">PCOS: {entry.pcosSymptoms.map(t).join(", ")}</p> : null}
                              {entry.fluNote ? <p className="text-sm">Flu: {entry.fluNote}</p> : null}
                              {entry.note ? <p className="mt-1 whitespace-pre-line text-sm">{entry.note}</p> : null}
                              <p className="mt-1 text-[10px] text-primary">{t("Tap to edit")}</p>
                            </button>
                            <DeleteBtn
                              onClick={() =>
                                update((d) => ({
                                  ...d,
                                  dayLogs: {
                                    ...d.dayLogs,
                                    [date]: {
                                      ...d.dayLogs[date],
                                      pain: (d.dayLogs[date]?.pain ?? []).filter((item) => item.id !== entry.id),
                                    },
                                  },
                                }))
                              }
                            />
                          </div>
                        ))}
                    </div>
                  </div>
                ) : null}
              </li>'''
          pain = pain[:close_pos] + nested + pain[close_pos + len(close_marker):]
          s = s[:start] + pain + s[next_pos:]

          # Linked symptom updates now live under their source pain. Keep the separate
          # Add symptoms card only as a safe fallback for legacy/orphan records.
          s = s.replace(
            '      {log?.pain?.some((entry) => entry.entryKind === "symptom-update") ? (',
            '      {log?.pain?.some((entry) => entry.entryKind === "symptom-update" && !entry.sourcePainId) ? (',
            1,
          )
          standalone_start = s.index('      {log?.pain?.some((entry) => entry.entryKind === "symptom-update" && !entry.sourcePainId) ? (')
          standalone_end = s.index('      {log?.panic?.length ? (', standalone_start)
          standalone = s[standalone_start:standalone_end]
          old_filter = '.filter((entry) => entry.entryKind === "symptom-update")'
          if old_filter not in standalone:
            raise SystemExit('Standalone symptom update filter not found')
          standalone = standalone.replace(
            old_filter,
            '.filter((entry) => entry.entryKind === "symptom-update" && !entry.sourcePainId)',
            1,
          )
          s = s[:standalone_start] + standalone + s[standalone_end:]
          path.write_text(s)

          test_path = Path('src/lib/__tests__/pain-symptom-update-regression.test.ts')
          t = test_path.read_text()
          needle = '    expect(home).toContain(\'<Card title="Add symptoms" icon="➕">\');\n'
          if needle not in t:
            raise SystemExit('Regression test insertion point not found')
          replacement = needle + '''    expect(home).toContain('entry.sourcePainId === p.id');
    expect(home).toContain('entry.entryKind === "symptom-update" && !entry.sourcePainId');
'''
          test_path.write_text(t.replace(needle, replacement, 1))

          Path('.github/workflows/one-time-nest-pain-symptom-updates.yml').unlink()
          PY
      - name: Verify patch
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun test src/lib/__tests__/pain-symptom-update-regression.test.ts
      - name: Commit patch
        run: |
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Nest Add symptoms under source pain"
          git push origin HEAD:main
