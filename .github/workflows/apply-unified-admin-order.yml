name: Apply unified admin order
on:
  push:
    branches: [agent/unified-core-custom-field-order]
    paths:
      - '.github/scripts/apply_unified_admin_order.py'
      - '.github/workflows/apply-unified-admin-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-core-custom-field-order
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_unified_admin_order.py
      - run: rm .github/scripts/apply_unified_admin_order.py .github/workflows/apply-unified-admin-order.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'unify admin core and custom field order'
          git push origin HEAD:agent/unified-core-custom-field-order
