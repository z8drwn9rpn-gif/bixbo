name: One-time calendar To Do tabs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger calendar todo tabs patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/patch-calendar-todo-tabs.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test src/lib/__tests__/calendar-event-todo-tabs-regression.test.ts
      - name: Commit
        run: |
          rm -f scripts/patch-calendar-todo-tabs.py .github/workflows/one-time-calendar-todo-tabs.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add To Do tab to calendar events popup"
          git push origin HEAD:main
