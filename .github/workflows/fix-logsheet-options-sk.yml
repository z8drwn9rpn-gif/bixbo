name: Fix LogSheet option Slovak
on:
  push:
    paths:
      - .github/workflows/fix-logsheet-options-sk.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Add option translations
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('src/lib/i18n.ts'); s=p.read_text()
          marker='  "Pain still feels the same?": "Bolesť je stále rovnaká?",'
          entries={
            'Abdomen':'Brucho','Chest':'Hrudník','Face':'Tvár','Fingers':'Prsty','Groin':'Slabiny','Hands':'Ruky','Head':'Hlava','Legs':'Nohy','Lips':'Pery','Lower abdomen':'Podbruško','Lower back':'Kríže','Ovaries':'Vaječníky','Pelvis':'Panva','Toes':'Prsty na nohách','Uterus':'Maternica','Vagina':'Vagína','Calves':'Lýtka','Lower belly':'Spodná časť brucha','Around mouth':'Okolo úst',
            'Aching':'Boľavá','Burning':'Pálivá','Cramping':'Kŕčovitá','Dull':'Tupá','Sharp':'Ostrá','Shooting':'Vystreľujúca','Stabbing':'Bodavá','Throbbing':'Pulzujúca','Tension':'Tlaková','Pressure':'Tlak',
            'Abdominal':'Brušný','Pelvic':'Panvový','Rectal':'Rektálny','Urinary':'Močový','Urgent':'Naliehavý','Incomplete':'Neúplný','Straining':'Tlačenie','Urgency':'Naliehavosť','Incomplete emptying':'Neúplné vyprázdnenie','Mucus':'Hlien','Blood':'Krv',
            'Type 1 — Constipation':'Typ 1 — zápcha','Type 2 — Constipation':'Typ 2 — zápcha','Type 3 — Normal':'Typ 3 — normálna','Type 4 — Normal':'Typ 4 — normálna','Type 5 — Lacks fiber':'Typ 5 — nedostatok vlákniny','Type 6 — Diarrhea':'Typ 6 — hnačka','Type 7 — Diarrhea':'Typ 7 — hnačka',
            'Migraine':'Migréna','Tension headache':'Tenzná bolesť hlavy','Cluster':'Clusterová','Sinus':'Dutiny','Cervicogenic':'Cervikogénna','Hormonal':'Hormonálna','Dehydration':'Dehydratácia','Eye strain':'Namáhanie očí','Caffeine withdrawal':'Vysadenie kofeínu','Hangover':'Opica','Ice-pick':'Bodavá','Thunderclap':'Thunderclap',
            'Migraine — throbbing pain (often one-sided), sensitivity to light/sound, nausea. May include aura (flashes, tingling).':'Migréna — pulzujúca bolesť (často jednostranná), citlivosť na svetlo/zvuk, nevoľnosť. Môže zahŕňať auru (záblesky, mravčenie).',
            'Tension headache — dull, pressing pain on both sides, like a band around the head. Often from stress, fatigue, or poor posture.':'Tenzná bolesť hlavy — tupá tlaková bolesť na oboch stranách, ako obruč okolo hlavy. Často zo stresu, únavy alebo zlého držania tela.',
            'Cluster — extremely severe pain behind/around one eye, in bouts; watery eye, blocked nose on that side.':'Clusterová — extrémne silná záchvatovitá bolesť za alebo okolo jedného oka; slzenie a upchatý nos na tej strane.',
            'Sinus — pressure in the face/behind the eyes/forehead, worse when bending forward; typically with a cold or sinusitis.':'Dutiny — tlak v tvári/za očami/na čele, horší pri predklone; typicky pri nádche alebo zápale dutín.',
            'Cervicogenic — originates in the neck; pain rises from the nape up into the head, worse with neck movement.':'Cervikogénna — vychádza z krku; bolesť stúpa zo zátylku do hlavy a zhoršuje sa pohybom krku.',
            'Hormonal — linked to the cycle (before/during period), ovulation, or contraception.':'Hormonálna — súvisí s cyklom, ovuláciou alebo antikoncepciou.',
            'Dehydration — dull, whole-head pain from low fluid intake, worse with movement.':'Dehydratácia — tupá bolesť celej hlavy z nízkeho príjmu tekutín, horšia pri pohybe.',
            'Eye strain — after long screen time; pressure behind the eyes, blurred vision.':'Namáhanie očí — po dlhom čase pri obrazovke; tlak za očami a rozmazané videnie.',
            'Caffeine withdrawal — dull pain with fatigue after skipping coffee.':'Vysadenie kofeínu — tupá bolesť s únavou po vynechaní kávy.',
            'Hangover — throbbing pain with nausea after drinking alcohol.':'Opica — pulzujúca bolesť s nevoľnosťou po alkohole.',
            '“Ice-pick” — brief, sharp stabbing jabs of pain lasting seconds.':'„Bodavá“ — krátke ostré bodnutia bolesti trvajúce sekundy.',
            '“Thunderclap” — sudden, extremely severe pain peaking within 1 minute. WARNING: seek medical help, can be serious.':'„Thunderclap“ — náhla extrémne silná bolesť s vrcholom do 1 minúty. UPOZORNENIE: vyhľadaj lekársku pomoc.',
            'Morning nausea':'Ranná nevoľnosť','Post-meal nausea':'Nevoľnosť po jedle','Motion-induced nausea':'Nevoľnosť z pohybu','Intermittent nausea':'Prerušovaná nevoľnosť','Constant nausea':'Neustála nevoľnosť','Mild nausea':'Mierna nevoľnosť','Moderate nausea':'Stredná nevoľnosť','Severe nausea':'Silná nevoľnosť',
            'No nausea — feeling completely normal':'Bez nevoľnosti — úplne normálny pocit','Very mild — occasionally noticeable, doesn\'t bother me':'Veľmi mierna — občas badateľná, neprekáža mi','Slight queasiness you can easily ignore.':'Mierny pocit nevoľnosti, ktorý sa dá ľahko ignorovať.','Mild — unpleasant, but I can function and eat normally':'Mierna — nepríjemná, ale môžem normálne fungovať a jesť','Clearly unpleasant, but you can still eat and function.':'Výrazne nepríjemná, ale stále môžeš jesť a fungovať.','Moderate — need to sit or rest, food is very unappealing':'Stredná — potrebujem si sadnúť alebo oddýchnuť, jedlo je veľmi nelákavé','Strong — hard to concentrate, feel like I\'ll vomit':'Silná — ťažko sa sústredím, mám pocit, že budem vracať','Hard to function; vomiting feels likely.':'Ťažko sa funguje; vracanie je pravdepodobné.','Very strong — almost unbearable, vomiting likely or already started':'Veľmi silná — takmer neznesiteľná, vracanie je pravdepodobné alebo už začalo','Extreme — constant vomiting or the worst nausea imaginable':'Extrémna — neustále vracanie alebo najhoršia predstaviteľná nevoľnosť',
            'Car ride':'Jazda autom','Smell':'Pach','Hunger':'Hlad','Cycle phase':'Fáza cyklu','After food':'Po jedle','Lying down':'Ľahnutie si','Fresh air':'Čerstvý vzduch','Ginger tea':'Zázvorový čaj','Slow breathing':'Pomalé dýchanie','Nothing helped':'Nič nepomohlo',
            'Tingling / numbness':'Mravčenie / necitlivosť','Carpopedal spasm':'Karpopedálny spazmus','Chvostek sign':'Chvostekov príznak','Trousseau sign':'Trousseauov príznak','Fasciculations':'Fascikulácie','Eyelid twitching':'Šklbanie viečka','Twitches around mouth/face':'Zášklby okolo úst/tváre','Calf cramps':'Kŕče v lýtkach','Whole body tremor':'Tras celého tela','Jaw clenching':'Zatínanie čeľuste','Hyperventilation / stress':'Hyperventilácia / stres','Extra magnesium':'Extra magnézium','Breathe into bag/hands':'Dýchanie do vrecka/dlaní','Grounding':'Uzemnenie','Someone with me':'Niekto pri mne','Slow exhale':'Pomalý výdych','Rest':'Oddych',
            'Pins and needles or numbness (lips, fingers, limbs).':'Mravčenie alebo necitlivosť pier, prstov či končatín.','Fine muscle rippling under the skin without limb movement.':'Jemné vlnenie svalov pod kožou bez pohybu končatiny.','Eyelid twitch — often with fatigue or low magnesium.':'Šklbanie viečka — často pri únave alebo nízkom magnéziu.','Small twitches around the mouth or face.':'Malé zášklby okolo úst alebo tváre.','Painful cramps in the calves, often at night or after exertion.':'Bolestivé kŕče v lýtkach, často v noci alebo po námahe.','Whole-body tremor or shaking from within.':'Tras celého tela alebo vnútorné chvenie.','Jaw clenching, teeth grinding.':'Zatínanie čeľuste, škrípanie zubami.',
            'Acne':'Akné','Hirsutism (excess hair)':'Hirzutizmus (nadmerné ochlpenie)','Hair thinning / crown loss':'Rednutie vlasov / vypadávanie na temene','Oily skin':'Mastná pleť','Dark skin patches (acanthosis nigricans)':'Tmavé kožné škvrny (acanthosis nigricans)','Skin tags':'Kožné výrastky','Weight gain / hard to lose':'Priberanie / ťažké chudnutie','Sugar cravings / energy swings after meals':'Chuť na sladké / výkyvy energie po jedle','Fatigue / low energy':'Únava / nízka energia',
            'Fish':'Ryby','Shellfish':'Kôrovce a mäkkýše','Eggs':'Vajcia','Nuts':'Orechy','Peanuts':'Arašidy','Soy':'Sója','Gluten':'Lepok','Casein / dairy':'Kazeín / mliečne výrobky',
            'High histamine food?':'Jedlo s vysokým obsahom histamínu?','Histamine flare?':'Histamínová reakcia?','Histamine flare symptoms':'Príznaky histamínovej reakcie','Symptoms after food':'Príznaky po jedle','How do I feel after food?':'Ako sa cítim po jedle?','Fatigue after food':'Únava po jedle','Hunger soon after eating':'Hlad krátko po jedle','Flushing / redness':'Návaly / začervenanie','Hives / rash':'Žihľavka / vyrážka','Itching':'Svrbenie','Rapid heart rate':'Rýchly tep','Stuffy nose':'Upchatý nos','GI issues':'Tráviace ťažkosti','Gassy':'Plynatosť',
            'Fingering':'Prstovanie','Oral (receiving)':'Orálny sex (prijímanie)','Suck dick':'Orálny sex (dávanie)','Painful?':'Bolestivé?','Discharge (optional)':'Výtok (voliteľné)','Discharge note (optional)':'Poznámka k výtoku (voliteľné)','Clear / egg-white':'Číry / ako vaječný bielok','White / creamy':'Biely / krémový','Brown / spotting':'Hnedý / špinenie','Yellow':'Žltý','Blood in urine':'Krv v moči','Painful urination':'Bolestivé močenie','Frequent urination':'Časté močenie','Night urination':'Nočné močenie'
          }
          block=''.join(f'  {json.dumps(k,ensure_ascii=False)}: {json.dumps(v,ensure_ascii=False)},\n' for k,v in entries.items() if f'  {json.dumps(k,ensure_ascii=False)}:' not in s)
          if marker not in s: raise RuntimeError('marker missing')
          p.write_text(s.replace(marker,block+marker,1))
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-logsheet-options-sk.yml
          git add src/lib/i18n.ts
          git commit -m "Translate all LogSheet option chips"
          git push
