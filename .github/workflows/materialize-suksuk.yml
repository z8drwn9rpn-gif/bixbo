name: Materialize SukSuk source

on:
  push:
    branches: [code-audit-hardening-no-notes]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'Materialize SukSuk source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code-audit-hardening-no-notes
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply_suksuk_customize.py
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/storage/types.ts src/lib/storage/defaults.ts src/features/logging/CycleForms.tsx src/components/home/DayOverview.tsx vite.config.ts
          git commit -m "Materialize SukSuk source"
          git push origin HEAD:code-audit-hardening-no-notes
