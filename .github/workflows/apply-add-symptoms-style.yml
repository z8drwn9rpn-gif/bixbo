name: Apply Add symptoms style

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-add-symptoms-style.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply style
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/home/DayOverview.tsx')
          s = p.read_text()
          before = s
          s = s.replace('''                  <div className="basis-full pl-12 pr-7">\n                    <div className="mt-1 space-y-2 border-l-2 border-primary/25 pl-3">\n                      {(log.pain ?? [])\n                        .filter((entry) => entry.entryKind === "symptom-update" && entry.sourcePainId === p.id)\n                        .map((entry) => (\n                          <div key={entry.id} className="flex items-start gap-2 rounded-xl bg-primary/5 px-2.5 py-2 ring-1 ring-primary/15">''','''                  <div className="basis-full pl-12 pr-7">\n                    <div className="mt-1 border-l border-border/70 pl-3">\n                      {(log.pain ?? [])\n                        .filter((entry) => entry.entryKind === "symptom-update" && entry.sourcePainId === p.id)\n                        .map((entry, index) => (\n                          <div key={entry.id} className={`flex items-start gap-2 py-2 ${index ? "border-t border-border/60" : ""}`}>''',1)
          s = s.replace('''                              <p className="text-[11px] font-semibold text-primary">{entry.time} · {t("Add symptoms")}</p>\n                              {entry.symptoms.length > 0 ? <p className="mt-0.5 text-sm">{entry.symptoms.map(t).join(", ")}</p> : null}\n                              {entry.nausea || entry.nauseaSeverity != null || entry.nauseaTypes?.length ? (\n                                <p className="text-sm">{t("Nausea")}{entry.nauseaSeverity != null ? ` ${entry.nauseaSeverity}/10` : ""}{entry.nauseaTypes?.length ? ` · ${entry.nauseaTypes.map(t).join(", ")}` : ""}</p>\n                              ) : null}\n                              {entry.headache || entry.headacheIntensity != null || entry.headacheTypes?.length ? (\n                                <p className="text-sm">{t("Headache")}{entry.headacheIntensity != null ? ` ${entry.headacheIntensity}/10` : ""}{entry.headacheTypes?.length ? ` · ${entry.headacheTypes.map(t).join(", ")}` : ""}</p>\n                              ) : null}\n                              {entry.hotFlashesOn || entry.hotFlashes != null ? <p className="text-sm">{t("Hot flashes")}{entry.hotFlashes != null ? ` ${entry.hotFlashes}/5` : ""}</p> : null}\n                              {entry.pcosSymptoms?.length ? <p className="text-sm">PCOS: {entry.pcosSymptoms.map(t).join(", ")}</p> : null}\n                              {entry.fluNote ? <p className="text-sm">Flu: {entry.fluNote}</p> : null}\n                              {entry.note ? <p className="mt-1 whitespace-pre-line text-sm"><span className="font-semibold">{t("Note")}:</span> {entry.note}</p> : null}\n                              <p className="mt-1 text-[10px] text-primary">{t("Tap to edit")}</p>''','''                              <p className="text-xs text-muted-foreground">{entry.time} · {t("Add symptoms")}</p>\n                              <div className="my-1.5 border-t border-border/60" />\n                              {entry.symptoms.length > 0 ? (\n                                <p className="text-xs leading-relaxed text-muted-foreground"><span className="font-semibold text-foreground">{t("Symptoms")}:</span> {entry.symptoms.map(t).join(", ")}</p>\n                              ) : null}\n                              {entry.nausea || entry.nauseaSeverity != null || entry.nauseaTypes?.length ? (\n                                <p className="mt-1.5 text-xs leading-relaxed text-muted-foreground"><span className="font-semibold text-foreground">{t("Nausea")}:</span>{entry.nauseaSeverity != null ? ` ${entry.nauseaSeverity}/10` : ""}{entry.nauseaTypes?.length ? ` · ${entry.nauseaTypes.map(t).join(", ")}` : ""}</p>\n                              ) : null}\n                              {entry.headache || entry.headacheIntensity != null || entry.headacheTypes?.length ? (\n                                <p className="mt-1.5 text-xs leading-relaxed text-muted-foreground"><span className="font-semibold text-foreground">{t("Headache")}:</span>{entry.headacheIntensity != null ? ` ${entry.headacheIntensity}/10` : ""}{entry.headacheTypes?.length ? ` · ${entry.headacheTypes.map(t).join(", ")}` : ""}</p>\n                              ) : null}\n                              {entry.hotFlashesOn || entry.hotFlashes != null ? <p className="mt-1.5 text-xs leading-relaxed text-muted-foreground"><span className="font-semibold text-foreground">{t("Hot flashes")}:</span>{entry.hotFlashes != null ? ` ${entry.hotFlashes}/5` : ""}</p> : null}\n                              {entry.pcosSymptoms?.length ? <p className="mt-1.5 text-xs leading-relaxed text-muted-foreground"><span className="font-semibold text-foreground">PCOS:</span> {entry.pcosSymptoms.map(t).join(", ")}</p> : null}\n                              {entry.fluNote ? <p className="mt-1.5 text-xs leading-relaxed text-muted-foreground"><span className="font-semibold text-foreground">Flu:</span> {entry.fluNote}</p> : null}\n                              {entry.note ? <p className="mt-1.5 whitespace-pre-line text-xs leading-relaxed text-muted-foreground"><span className="font-semibold text-foreground">{t("Note")}:</span> {entry.note}</p> : null}\n                              <p className="mt-1 text-[10px] text-primary">{t("Tap to edit")}</p>''',1)
          if s == before:
              raise SystemExit('Add symptoms block was not found; no files changed')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          bun install --frozen-lockfile
          bun run typecheck
      - name: Commit
        run: |
          rm .github/workflows/apply-add-symptoms-style.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx .github/workflows/apply-add-symptoms-style.yml
          git commit -m "style: make Add symptoms match daily overview"
          git push origin HEAD:main
