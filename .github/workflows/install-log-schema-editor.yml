name: Install log schema editor
on:
  push:
    paths:
      - '.github/workflows/install-log-schema-editor.yml'

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/install-log-schema-editor.py
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/appRegistry.ts src/routes/admin.tsx src/components/LogSheet.tsx src/lib/__tests__/appRegistry.test.ts src/routeTree.gen.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add dynamic log schema editor"
          git push
