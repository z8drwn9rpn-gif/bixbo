name: Profile and notifications localization fix
on:
  push:
    paths:
      - '.github/workflows/profile-notifications-i18n-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply profile and notifications patch
        run: python3 .github/scripts/profile_notifications_i18n_fix.py
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profile.tsx src/routes/notifications.tsx src/lib/i18n.ts
          git diff --cached --quiet && exit 0
          git commit -m "Complete profile settings localization and simplify notifications"
          git push
