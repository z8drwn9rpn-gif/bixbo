name: Move Blueberry controls once
on:
  push:
    branches: [agent/move-blueberry-controls]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-blueberry-controls
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Reorder Blueberry controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/logging/CycleForms.tsx')
          s = p.read_text()
          pregnant_start = '    <Field label="Pregnant?" schemaFieldId="pregnant">'
          cycle = '    <div className="rounded-2xl bg-tint p-3 text-[11px] leading-relaxed text-muted-foreground">Cycle prediction is based on your last period and cycle length (edit in Settings later).</div>\n'
          delete_start = '    {cur && <button type="button" onClick={() => {'
          birth = '    <Field label="Birth control since (optional)" schemaFieldId="birthControlSince">'

          if s.count(cycle) != 1:
              raise SystemExit(f'Expected one cycle prediction block, found {s.count(cycle)}')
          if s.count(pregnant_start) != 1 or s.count(birth) != 1 or s.count(delete_start) != 1:
              raise SystemExit('Expected Blueberry markers not found exactly once')

          # Extract delete block as the line containing the conditional button.
          ds = s.index(delete_start)
          de = s.index('\n', ds) + 1
          delete_block = s[ds:de]

          # Remove cycle + delete from current location.
          s = s.replace(cycle, '', 1)
          s = s.replace(delete_block, '', 1)

          # Insert both immediately before Pregnant? (i.e. directly after Birth control field).
          ps = s.index(pregnant_start)
          s = s[:ps] + cycle + delete_block + s[ps:]
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/move-blueberry-controls-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: move Blueberry controls under birth control"
          git push origin HEAD:agent/move-blueberry-controls
