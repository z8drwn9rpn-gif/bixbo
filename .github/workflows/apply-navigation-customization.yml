name: Apply navigation customization
on:
  push:
    branches:
      - agent/admin-navigation-customization
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-navigation-customization
      - name: Apply patch
        run: python scripts/apply_navigation_customization.py
      - name: Commit patch
        run: |
          git rm .github/workflows/apply-navigation-customization.yml scripts/apply_navigation_customization.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/appRegistry.ts src/lib/effectiveAdminConfig.ts src/components/BottomNav.tsx src/components/SideNav.tsx src/routes/__root.tsx
          git commit -m "add admin navigation customization"
          git push origin HEAD:agent/admin-navigation-customization
