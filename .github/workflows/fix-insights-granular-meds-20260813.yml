name: Fix granular meds adherence insights
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger granular meds adherence insights fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/fix-insights-granular-meds-20260813.py
      - name: Full verification
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit fix
        run: |
          rm -f scripts/fix-insights-granular-meds-20260813.py .github/workflows/fix-insights-granular-meds-20260813.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix granular meds adherence insights"
          git push origin HEAD:main
