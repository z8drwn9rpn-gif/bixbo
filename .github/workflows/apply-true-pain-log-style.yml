name: Apply true Pain log style
on:
  push:
    branches: [agent/true-pain-style-all-logs]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/true-pain-style-all-logs
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/apply_true_pain_log_style.py
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Tests
        run: bun test || true
      - name: Commit app changes
        run: |
          git config user.name "z8drwn9rpn-gif"
          git config user.email "z8drwn9rpn@privaterelay.appleid.com"
          git add src/features/logging/CalendarForms.tsx src/features/logging/CycleForms.tsx src/styles.css
          git diff --cached --quiet || git commit -m "style: match all log controls to Pain sizing"
          git push origin HEAD:agent/true-pain-style-all-logs
