name: Episodes single page once
on:
  push:
    branches: [agent/episodes-single-page]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[episodes-single-page]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/episodes-single-page
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch Episodes to one page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/features/logging/LogSheetRoot.tsx')
          s = p.read_text()

          s = s.replace('  const [episodeChooserOpen, setEpisodeChooserOpen] = useState(false);\n  const [episodeFlowStarted, setEpisodeFlowStarted] = useState(false);\n', '')
          s = s.replace('    setEpisodeChooserOpen(false);\n    setEpisodeFlowStarted(false);\n', '')

          s = re.sub(
              r'''  const back = \(\) => \{\n    setCustomEditEntry\(undefined\);\n    if \(episodeChooserOpen\) \{.*?\n    setCat\(null\);\n  \};''',
              '''  const back = () => {\n    setCustomEditEntry(undefined);\n    if (initial) {\n      close();\n      return;\n    }\n    setCat(null);\n  };''',
              s,
              flags=re.S,
          )

          s = s.replace('''                              if (c.id === "tetany") {\n                                setCat("tetany");\n                                setEpisodeFlowStarted(true);\n                                setEpisodeChooserOpen(true);\n                              } else {\n                                setCat(c.id);\n                              }''', '''                              setCat(c.id);''')

          s = re.sub(
              r'''                \{t\(\n                  episodeChooserOpen\n                    \? "Episodes"\n                    : active === "tetany"\n                      \? "Tetany episode"\n                      : active === "panic"\n                        \? "Panic attack"\n                        : orderedCats\.find\(\(c\) => c\.id === active\)\?\.label \?\? CATEGORIES\.find\(\(c\) => c\.id === active\)\?\.label \?\? "",\n                \)\}''',
              '''                {t(\n                  active === "tetany" || active === "panic"\n                    ? "Episodes"\n                    : orderedCats.find((c) => c.id === active)?.label ?? CATEGORIES.find((c) => c.id === active)?.label ?? "",\n                )}''',
              s,
          )

          pattern = re.compile(r'''              \{episodeChooserOpen && \(active === "tetany" \|\| active === "panic"\) && \(.*?              \{!episodeChooserOpen && active === "tetany" && \(\n                <TetanyForm\n                  date=\{date\}\n                  data=\{data\}\n                  update=\{update\}\n                  onDone=\{close\}\n                  initialEntry=\{edit as TetanyEpisode \| undefined\}\n                />\n              \)\}\n''', re.S)
          replacement = '''              {(active === "tetany" || active === "panic") && (\n                <div className="mx-auto flex w-full max-w-md flex-col gap-4 py-4">\n                  <div className="grid grid-cols-2 gap-2 rounded-2xl bg-tint p-1">\n                    {isRegistrySurfaceEnabled(data, "tetany", "log") && (\n                      <button\n                        type="button"\n                        onClick={() => setCat("tetany")}\n                        className={`rounded-xl px-3 py-2.5 text-sm font-semibold transition ${\n                          active === "tetany"\n                            ? "bg-background text-foreground shadow-sm ring-1 ring-border"\n                            : "text-muted-foreground"\n                        }`}\n                      >\n                        <span className="inline-flex items-center gap-2"><Ico e="⭐" size={18} /> {t("Tetany")}</span>\n                      </button>\n                    )}\n                    {isRegistrySurfaceEnabled(data, "panic", "log") && (\n                      <button\n                        type="button"\n                        onClick={() => setCat("panic")}\n                        className={`rounded-xl px-3 py-2.5 text-sm font-semibold transition ${\n                          active === "panic"\n                            ? "bg-background text-foreground shadow-sm ring-1 ring-border"\n                            : "text-muted-foreground"\n                        }`}\n                      >\n                        <span className="inline-flex items-center gap-2"><Ico e="✨" size={18} /> {t("Panic attack")}</span>\n                      </button>\n                    )}\n                  </div>\n\n                  {active === "panic" ? (\n                    <PanicForm\n                      date={date}\n                      data={data}\n                      update={update}\n                      onDone={close}\n                      initialEntry={edit as PanicAttack | undefined}\n                    />\n                  ) : (\n                    <TetanyForm\n                      date={date}\n                      data={data}\n                      update={update}\n                      onDone={close}\n                      initialEntry={edit as TetanyEpisode | undefined}\n                    />\n                  )}\n                </div>\n              )}\n'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected to replace episode block once, got {n}')
          p.write_text(s2)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/episodes-single-page-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Episodes a single page [episodes-single-page]"
          git push origin HEAD:agent/episodes-single-page
