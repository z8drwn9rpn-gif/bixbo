name: Apply admin touch drag

on:
  push:
    branches:
      - agent/hak-custom-sections
    paths:
      - .github/scripts/apply_admin_touch_drag.py
      - .github/workflows/apply-admin-touch-drag.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hak-custom-sections
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_admin_touch_drag.py
      - run: rm .github/scripts/apply_admin_touch_drag.py .github/workflows/apply-admin-touch-drag.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HakAdminEditOverlay.tsx src/components/AdminEditOverlay.tsx .github/scripts/apply_admin_touch_drag.py .github/workflows/apply-admin-touch-drag.yml
          git commit -m 'restore touch drag in admin editors'
          git push
