name: Apply admin feature reorder
on:
  push:
    branches: [agent/admin-feature-reorder]
    paths:
      - .github/workflows/apply-admin-feature-reorder.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-feature-reorder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_admin_feature_reorder.py
      - run: rm .github/scripts/apply_admin_feature_reorder.py .github/workflows/apply-admin-feature-reorder.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdminEditOverlay.tsx src/lib/__tests__/admin-feature-order.test.ts .github
          git commit -m 'add admin reorder controls for features'
          git push origin HEAD:agent/admin-feature-reorder
