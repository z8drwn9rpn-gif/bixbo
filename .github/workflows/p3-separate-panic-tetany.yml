name: P3 separate Panic and Tetany
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger P3 separate Panic and Tetany'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply P3 patch
        run: python3 scripts/p3-separate-panic-tetany.py
      - name: Full verification
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified P3 changes
        run: |
          rm -f scripts/p3-separate-panic-tetany.py .github/workflows/p3-separate-panic-tetany.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Separate Panic and Tetany from Pain logging"
          git push origin HEAD:main
