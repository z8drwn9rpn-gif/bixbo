name: Apply pain wizard registry
on:
  push:
    branches: [agent/pain-wizard-step-drag]
    paths:
      - '.github/scripts/apply_pain_wizard_registry.py'
      - '.github/workflows/apply-pain-wizard-registry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pain-wizard-step-drag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_pain_wizard_registry.py
      - run: rm .github/scripts/apply_pain_wizard_registry.py .github/workflows/apply-pain-wizard-registry.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'make pain wizard steps truly reorderable'
          git push
