name: Apply sex thermo drag
on:
  push:
    branches: [agent/sex-thermo-field-drag]
    paths:
      - '.github/scripts/apply_sex_thermo_drag.py'
      - '.github/workflows/apply-sex-thermo-drag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python .github/scripts/apply_sex_thermo_drag.py
      - run: rm .github/scripts/apply_sex_thermo_drag.py .github/workflows/apply-sex-thermo-drag.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'make Sex and Heat fields truly reorderable'
          git push
