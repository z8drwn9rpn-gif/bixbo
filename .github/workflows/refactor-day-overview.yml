name: Apply Day Overview maintainability refactor

on:
  push:
    branches: [code-audit-hardening-no-notes]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'Refactor Day Overview sections') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code-audit-hardening-no-notes
      - name: Extract shared card and SukSuk section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/home/DayOverview.tsx")
          s = p.read_text()

          import_marker = 'import { ScheduledDosePopup, type ScheduledDoseTarget } from "@/components/home/ScheduledDosePopup";\n'
          imports = (
              'import { DayOverviewSexCard } from "@/components/home/DayOverviewSexCard";\n'
              'import { DayOverviewCard as Card, DayOverviewDeleteButton as DeleteBtn } from "@/components/home/DayOverviewPrimitives";\n'
          )
          if import_marker not in s: raise SystemExit("DayOverview import marker missing")
          s = s.replace(import_marker, import_marker + imports, 1)

          start_marker = '      {log?.sex?.length ? (\n        <Card title="ŠukŠuk!" icon="❤️" compact>\n'
          end_marker = '      {log?.heat?.length ? (\n'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0: raise SystemExit("SukSuk block markers missing")
          replacement = '      <DayOverviewSexCard entries={log?.sex ?? []} date={date} update={update} onEdit={onEdit} />\n\n'
          s = s[:start] + replacement + s[end:]

          defs_start = s.find('export function DeleteBtn({ onClick }: { onClick: () => void }) {\n')
          defs_end = s.find('export const stripEmoji =', defs_start)
          if defs_start < 0 or defs_end < 0: raise SystemExit("DayOverview primitive definitions missing")
          compatibility = 'export { DayOverviewCard as Card, DayOverviewDeleteButton as DeleteBtn } from "./DayOverviewPrimitives";\n\n'
          s = s[:defs_start] + compatibility + s[defs_end:]
          p.write_text(s)
          PY
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx
          git commit -m "Refactor Day Overview sections"
          git push origin HEAD:code-audit-hardening-no-notes
