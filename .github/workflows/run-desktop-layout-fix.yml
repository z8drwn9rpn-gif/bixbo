name: Run desktop layout fix
on:
  push:
    paths:
      - '.github/workflows/run-desktop-layout-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/fix-desktop-layout.py
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Verify requested layout changes
        run: |
          grep -q 'space-y-3 lg:contents' src/routes/patterns.tsx
          grep -q 'minWidth: `${width}px`' src/routes/couple.tsx
          grep -q 'h-\[206px\] w-full max-w-none' src/routes/couple.tsx
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/patterns.tsx src/routes/couple.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix desktop Patterns and Couple chart layout'
          git push
