name: Install global admin publish
on:
  push:
    paths:
      - '.github/scripts/install-global-admin-publish.py'
      - '.github/workflows/install-global-admin-publish.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/install-global-admin-publish.py
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260811014000_global_admin_config.sql src/lib/globalAdminConfig.ts src/lib/effectiveAdminConfig.ts src/lib/appRegistry.ts src/lib/layoutRegistry.ts src/routes/__root.tsx src/routes/admin.tsx src/integrations/supabase/types.ts src/lib/__tests__/effectiveAdminConfig.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add local draft and globally published admin configuration'
            git push
          fi
