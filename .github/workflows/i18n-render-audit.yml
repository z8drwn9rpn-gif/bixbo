name: I18n render audit
on:
  push:
    paths:
      - '.github/workflows/i18n-render-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan render layer
        run: python3 .github/scripts/i18n_render_audit.py
