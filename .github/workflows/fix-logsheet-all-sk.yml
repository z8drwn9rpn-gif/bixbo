            "Whole body tremor": "Tras celého tela", "Whole-body tremor or shaking from within.": "Tras celého tela alebo vnútorné chvenie.", "Worst ever — unbearable, emergency-level": "Najhoršia — neznesiteľná, urgentná úroveň", "Worst right after waking, before eating.": "Najhoršia hneď po zobudení, pred jedlom.", "Yellow": "Žltý",
            "Quick symptom update": "Rýchla aktualizácia príznakov", "New entry ·": "Nový záznam ·", "Next": "Ďalej", "Level": "Úroveň", "Add": "Pridať",
            "Where does it hurt?": "Kde to bolí?", "How does it hurt?": "Aká je bolesť?", "Other symptoms": "Ďalšie príznaky", "Nausea?": "Nevoľnosť?", "Headache?": "Bolesť hlavy?",
            "Associated symptoms": "Sprievodné príznaky", "Triggers": "Spúšťače", "Pain still feels the same?": "Bolesť je stále rovnaká?", "Pain scale (Mankosky)": "Stupnica bolesti (Mankosky)"
          }
          ''')
          p=Path('src/lib/i18n.ts'); s=p.read_text()
          start=s.index('const sk')
          brace=s.index('{',start); depth=0; end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: end=i; break
          if end is None: raise RuntimeError('SK dictionary end not found')
          sk=s[brace:end]
          existing=set()
          import re
          for m in re.finditer(r'^\s*["\']([^"\']+)["\']\s*:',sk,re.M): existing.add(m.group(1))
          add=''
          for k,v in entries.items():
              if k not in existing: add+=f'  {json.dumps(k,ensure_ascii=False)}: {json.dumps(v,ensure_ascii=False)},\n'
          s=s[:end]+add+s[end:]; p.write_text(s)

          p=Path('src/components/LogSheet.tsx'); s=p.read_text()
          replacements={
            '>\n                Add\n              </Button>':'>\n                {t("Add")}\n              </Button>',
            '<span className="text-sm font-semibold leading-none">{step < 4 ? "Next" : "Save"}</span>':'<span className="text-sm font-semibold leading-none">{t(step < 4 ? "Next" : "Save")}</span>',
            '            Quick symptom update\n':'            {t("Quick symptom update")}\n',
            '<span className="text-xs text-muted-foreground">New entry · {time}</span>':'<span className="text-xs text-muted-foreground">{t("New entry ·")} {time}</span>',
            '                    Last log: {latestPain.time} · pain {latestPain.score}/10. Reuse it and add only the new symptoms.\n':'                    {t("Last log:")} {latestPain.time} {t("· pain")} {latestPain.score}{t("/10. Reuse it and add only the new symptoms.")}\n',
            '                Same pain — add symptoms\n':'                {t("Same pain — add symptoms")}\n',
            '                Pain {score}/10 copied from {copiedFromTime ?? "the latest log"}\n':'                {t("Pain")} {score}{t("/10 copied from")} {copiedFromTime ?? t("the latest log")}\n',
            '                This saves a new entry at {time}; the older log stays unchanged. Add or adjust the symptoms below.\n':'                {t("This saves a new entry at")} {time}{t("; the older log stays unchanged. Add or adjust the symptoms below.")}\n',
            '            Level {Number.isInteger(value) ? value : value.toFixed(1)}:\n':'            {t("Level")} {Number.isInteger(value) ? value : value.toFixed(1)}:\n',
            'aria-label={editingOrder ? "Finish reordering log categories" : "Reorder log categories"}':'aria-label={t(editingOrder ? "Finish reordering log categories" : "Reorder log categories")}',
            'aria-label={`Info ${v}`}':'aria-label={`${t("Info")} ${t(v)}`}',
            'aria-label={`Rename ${v}`}':'aria-label={`${t("Rename")} ${v}`}',
            'aria-label={`Remove ${v}`}':'aria-label={`${t("Remove")} ${v}`}'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Commit complete LogSheet translation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-logsheet-all-sk.yml .github/workflows/audit-logsheet-i18n.yml
          git add src/components/LogSheet.tsx src/lib/i18n.ts
          git commit -m "Complete Slovak translation for all LogSheet forms"
          git push
