name: Improve Suksuk once
on:
  push:
    branches: [agent/improve-suksuk-bixbo]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-suksuk-bixbo
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch Suksuk
        run: python .github/scripts/improve_suksuk.py
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test || true
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "z8drwn9rpn-gif"
          git config user.email "z8drwn9rpn@privaterelay.appleid.com"
          git add src/features/logging/CycleForms.tsx src/lib/storage/types.ts
          git diff --cached --quiet || git commit -m "feat: redesign Suksuk log"
          git push origin HEAD:agent/improve-suksuk-bixbo
