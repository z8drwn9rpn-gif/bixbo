name: Enlarge scale popups and reorder pain scales
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run scale popup and ordering update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/enlarge-scale-popups-and-reorder.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified fix
        run: |
          rm -f scripts/enlarge-scale-popups-and-reorder.py .github/workflows/enlarge-scale-popups-and-reorder.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enlarge scale popups and put scales first"
          git push origin HEAD:main
