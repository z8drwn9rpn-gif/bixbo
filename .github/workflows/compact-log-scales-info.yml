name: Compact log scales and info
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger compact log scale UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply UX patch
        run: python3 scripts/compact-log-scales-info.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified fix
        run: |
          rm -f scripts/compact-log-scales-info.py .github/workflows/compact-log-scales-info.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Compact log scales and move legends behind info"
          git push origin HEAD:main
