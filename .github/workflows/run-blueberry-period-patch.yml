name: Run Blueberry period patch

on:
  push:
    paths:
      - .github/blueberry-period-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/patch-blueberry-period.py
      - run: |
          rm -f scripts/patch-blueberry-period.py .github/workflows/run-blueberry-period-patch.yml .github/blueberry-period-patch-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Blueberry period symptoms and clots"
          git push
