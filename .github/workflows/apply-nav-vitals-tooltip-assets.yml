name: Apply nav assets and vital tooltips

on:
  push:
    branches:
      - agent/nav-image-assets-vital-tooltips
    paths:
      - scripts/apply-nav-vitals-tooltip-assets.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nav-image-assets-vital-tooltips
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/apply-nav-vitals-tooltip-assets.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Restore vital trend tooltips and annual record details"
            git push origin HEAD:agent/nav-image-assets-vital-tooltips
          fi
