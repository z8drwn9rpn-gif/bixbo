name: Refactor Pain add symptoms note
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run Pain add symptoms cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/refactor-pain-add-symptoms-note.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified source changes
        run: |
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/LogSheet.tsx src/lib/__tests__/pain-symptom-update-regression.test.ts
          git diff --cached --check
          git commit -m "Clean Pain wizard and add symptom follow-up notes"
          git push origin HEAD:main
