name: Fix Quick Log persistence

on:
  push:
    paths:
      - ".github/workflows/fix-quicklog-persistence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch device-local Quick Log persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/storage.ts')
          s = p.read_text()

          anchor = 'function emit() {\n  listeners.forEach((l) => l());\n}\n\n'
          insert = '''const DEVICE_QUICK_LOG_KEY = "bixbo-device-quick-log-v1";\n\ntype DeviceQuickLogPrefs = Pick<BixboData["settings"], "quickTagOrder" | "hiddenQuickTags" | "customQuickTags">;\n\nfunction readDeviceQuickLogPrefs(): DeviceQuickLogPrefs | null {\n  if (typeof window === "undefined") return null;\n  try {\n    const raw = window.localStorage.getItem(DEVICE_QUICK_LOG_KEY);\n    if (!raw) return null;\n    const parsed = JSON.parse(raw) as DeviceQuickLogPrefs;\n    return parsed && typeof parsed === "object" ? parsed : null;\n  } catch {\n    return null;\n  }\n}\n\nfunction writeDeviceQuickLogPrefs(data: BixboData): void {\n  if (typeof window === "undefined") return;\n  try {\n    window.localStorage.setItem(DEVICE_QUICK_LOG_KEY, JSON.stringify({\n      quickTagOrder: data.settings.quickTagOrder ?? [],\n      hiddenQuickTags: data.settings.hiddenQuickTags ?? [],\n      customQuickTags: data.settings.customQuickTags ?? [],\n    } satisfies DeviceQuickLogPrefs));\n  } catch {\n    // Device storage may be unavailable in private/restricted browser contexts.\n  }\n}\n\nfunction applyDeviceQuickLogPrefs(data: BixboData): BixboData {\n  const local = readDeviceQuickLogPrefs();\n  if (!local) return data;\n  return {\n    ...data,\n    settings: {\n      ...data.settings,\n      quickTagOrder: local.quickTagOrder ?? [],\n      hiddenQuickTags: local.hiddenQuickTags ?? [],\n      customQuickTags: local.customQuickTags ?? [],\n    },\n  };\n}\n\n'''
          if 'DEVICE_QUICK_LOG_KEY' not in s:
              if anchor not in s:
                  raise SystemExit('emit anchor not found')
              s = s.replace(anchor, insert + anchor, 1)

          old = '_state = raw ? migrate(JSON.parse(raw)) : freshEmptyState();'
          new = '_state = applyDeviceQuickLogPrefs(raw ? migrate(JSON.parse(raw)) : freshEmptyState());'
          if old in s:
              s = s.replace(old, new, 1)

          old_set = '''  _state = migrate(withLocalSyncMetadata(previous, next));\n  persist();'''
          new_set = '''  _state = migrate(withLocalSyncMetadata(previous, next));\n  writeDeviceQuickLogPrefs(_state);\n  persist();'''
          if old_set in s:
              s = s.replace(old_set, new_set, 1)

          old_replace = '''  _state = reason === "local" ? migrate(withLocalSyncMetadata(_state, next)) : next;\n  persist();'''
          new_replace = '''  _state = reason === "local"\n    ? migrate(withLocalSyncMetadata(_state, next))\n    : applyDeviceQuickLogPrefs(next);\n  if (reason === "local") writeDeviceQuickLogPrefs(_state);\n  persist();'''
          if old_replace in s:
              s = s.replace(old_replace, new_replace, 1)

          p.write_text(s)
          PY
      - name: Quality
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit
        run: |
          git config user.name "bixbo-bot"
          git config user.email "bixbo-bot@users.noreply.github.com"
          git add src/lib/storage.ts
          git commit -m "Preserve Quick Log customisation per device across updates"
          git pull --rebase origin main
          git push origin HEAD:main
