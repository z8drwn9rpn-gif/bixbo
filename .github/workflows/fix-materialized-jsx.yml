name: Repair materialized JSX

on:
  push:
    branches: [code-audit-hardening-no-notes]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair materialized JSX fragments') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code-audit-hardening-no-notes
      - name: Restore React fragment closers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["src/components/home/DayOverview.tsx", "src/features/logging/CycleForms.tsx"]:
              p = Path(name)
              s = p.read_text()
              s = s.replace("< />", "</>")
              p.write_text(s)
          PY
      - name: Commit repair
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx src/features/logging/CycleForms.tsx
          git commit -m "Repair materialized JSX fragments"
          git push origin HEAD:code-audit-hardening-no-notes
