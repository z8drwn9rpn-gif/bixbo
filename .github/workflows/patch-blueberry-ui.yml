name: Apply Blueberry UI polish

on:
  push:
    paths:
      - .github/scripts/patch_blueberry_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Blueberry form
        run: python .github/scripts/patch_blueberry_ui.py
      - name: Commit Blueberry UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/logging/CycleForms.tsx
          if git diff --cached --quiet; then
            echo "No Blueberry changes needed"
            exit 0
          fi
          git commit -m "Polish Blueberry log layout"
          git push
