name: BIXBO one-time multi-entry sleep repair

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.number == 229
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply multi-entry sleep repair
        id: apply
        run: python3 .github/scripts/fix_sleep_multi.py

      - name: Verify source repair
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Saved sleep measurements' src/features/logging/LogSheetRoot.tsx
          grep -Fq 'sleepEntries: nextSleepEntries' src/features/logging/LogSheetRoot.tsx
          grep -Fq 'deleteSleep' src/features/logging/LogSheetRoot.tsx
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Report repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/229" \
            --raw-field body="One-time multi-entry Sleep repair. Apply: ${APPLY_OUTCOME:-not-run}. Verify: ${VERIFY_OUTCOME:-not-run}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Commit repair and clean one-time files
        if: steps.apply.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-sleep-multi-once.yml .github/scripts/fix_sleep_multi.py
          git add src/features/logging/LogSheetRoot.tsx
          git config user.name "BIXBO automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Add multi-entry sleep logging"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
