name: Final UI i18n and Couple fix
on:
  push:
    paths:
      - '.github/workflows/final-ui-i18n-couple-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 .github/scripts/final_ui_i18n_couple_fix.py
          python3 .github/scripts/final_ui_i18n_couple_fix_v2.py
          python3 .github/scripts/final_ui_i18n_couple_fix_v3.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Diagnose object duplicate keys
        run: |
          node - <<'JS'
          const fs = require('fs');
          const ts = require('typescript');
          const file = 'src/lib/i18n.ts';
          const source = fs.readFileSync(file, 'utf8');
          const sf = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          function propName(p) {
            if (!p.name) return null;
            if (ts.isStringLiteral(p.name) || ts.isNumericLiteral(p.name) || ts.isIdentifier(p.name)) return p.name.text;
            return null;
          }
          function visit(node) {
            if (ts.isObjectLiteralExpression(node)) {
              const seen = new Map();
              for (const p of node.properties) {
                if (!ts.isPropertyAssignment(p) && !ts.isShorthandPropertyAssignment(p)) continue;
                const name = propName(p);
                if (!name) continue;
                const line = sf.getLineAndCharacterOfPosition(p.getStart(sf)).line + 1;
                if (seen.has(name)) console.log(`DUPLICATE ${JSON.stringify(name)} first=${seen.get(name)} second=${line}`);
                else seen.set(name, line);
              }
            }
            ts.forEachChild(node, visit);
          }
          visit(sf);
          JS
          bun run typecheck
      - name: Tests before commit
        run: bun test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profile.tsx src/routes/index.tsx src/components/QuickTags.tsx src/routes/insights.tsx src/routes/patterns.tsx src/routes/couple.tsx src/lib/i18n.ts src/lib/coupleSimilarity.ts
          git diff --cached --quiet && exit 0
          git commit -m "Complete Slovak UI and fix Couple similarity"
          git push
