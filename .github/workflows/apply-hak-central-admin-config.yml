name: Apply HAK central admin config
on:
  push:
    branches: [agent/hak-central-admin-config]
    paths:
      - .github/workflows/apply-hak-central-admin-config.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hak-central-admin-config
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_hak_central_admin_config.py
      - run: rm .github/scripts/apply_hak_central_admin_config.py .github/workflows/apply-hak-central-admin-config.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/appRegistry.ts src/lib/effectiveAdminConfig.ts src/components/HakAdminEditOverlay.tsx src/lib/__tests__/admin-hak-config.test.ts .github
          git commit -m 'move HAK customization into central AdminConfig'
          git push origin HEAD:agent/hak-central-admin-config
