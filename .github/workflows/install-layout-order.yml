name: Install layout order
on:
  push:
    paths:
      - '.github/workflows/install-layout-order.yml'
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/install-layout-order.py
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/layoutRegistry.ts src/components/LayoutOrderEditor.tsx src/lib/appRegistry.ts src/routes/admin.tsx src/routes/index.tsx src/routes/insights.tsx src/routes/patterns.tsx src/routes/couple.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add admin layout ordering across BIXBO pages"
          git push
