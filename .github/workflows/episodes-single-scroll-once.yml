name: Episodes single scroll once
on:
  push:
    branches: [agent/episodes-single-scroll-form]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[episodes-single-scroll]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/episodes-single-scroll-form
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch episode forms to one scrollable page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/features/logging/EpisodeForms.tsx')
          s = p.read_text()

          s = s.replace(
              'import { Chip, CustomChipList, DurationField, Field, IntensityScale, toggleIn } from "./LogFormPrimitives";',
              'import { Chip, CustomChipList, DurationField, Field, IntensityScale, SaveBar, toggleIn } from "./LogFormPrimitives";'
          )

          s = re.sub(r'\n  const \[step, setStep\] = useState\(0\);\n  const steps = \["Episode", "Symptoms", "Trigger & relief", "Notes"\];', '', s)

          s, nav_count = re.subn(
              r'\s*<EpisodeWizardNav\b.*?onSave=\{save\}\s*/>',
              '\n      <SaveBar onCancel={onDone} onSave={save} />',
              s,
              flags=re.S,
          )
          if nav_count != 2:
              raise SystemExit(f'Expected 2 rendered EpisodeWizardNav components, got {nav_count}')

          lines = s.splitlines()
          out = []
          section_open = re.compile(r'^(\s*)\{step === [0-3] && (<div className="space-y-4">)$')
          opened = 0
          closed = 0
          for line in lines:
              m = section_open.match(line)
              if m:
                  out.append(m.group(1) + m.group(2))
                  opened += 1
                  continue
              if line == '      </div>}':
                  out.append('      </div>')
                  closed += 1
                  continue
              out.append(line)
          s = '\n'.join(out) + ('\n' if s.endswith('\n') else '')

          if opened != 8 or closed != 8:
              raise SystemExit(f'Expected 8 episode sections, opened={opened}, closed={closed}')
          if 'step ===' in s:
              raise SystemExit('Wizard step condition remains in EpisodeForms.tsx')
          if '<EpisodeWizardNav step=' in s:
              raise SystemExit('Rendered EpisodeWizardNav remains in EpisodeForms.tsx')

          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/episodes-single-scroll-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show panic and tetany forms on one page [episodes-single-scroll]"
          git push origin HEAD:agent/episodes-single-scroll-form
