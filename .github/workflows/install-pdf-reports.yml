name: Install PDF reports
on:
  push:
    paths:
      - 'src/routes/report.tsx'
      - '.github/workflows/install-pdf-reports.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Add PDF reports entry to Profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/profile.tsx')
          s = p.read_text(encoding='utf-8')
          if 'to="/report"' not in s:
              anchor = '<TrText value="Export JSON" /></button>'
              if anchor not in s:
                  raise SystemExit('Export JSON anchor not found')
              addition = anchor + '''

          <Link
            to="/report"
            className="inline-flex min-h-11 w-full items-center justify-center rounded-xl border border-input bg-primary/10 px-4 text-sm font-semibold text-primary"
          >{t("PDF reports")}</Link>'''
              s = s.replace(anchor, addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/profile.tsx src/routeTree.gen.ts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Integrate BIXBO PDF reports into Profile'
            git push
          fi
