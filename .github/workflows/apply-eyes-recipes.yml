name: Apply Eyes and Recipes integration

on:
  push:
    branches:
      - feature/eyes-recipes

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyes-recipes
          fetch-depth: 0

      - name: Patch existing app files
        shell: bash
        run: |
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Storage model: Eyes is a first-class episode; recipes reuse synced notebook entries.
          replace(
              "src/lib/storage/types.ts",
              '''export interface ThermoSession {''',
              '''export interface EyesEpisode {
            id: string;
            time: string;
            affected: "left" | "right" | "both";
            painWithMovement: boolean;
            visionChanges: string[];
            note?: string;
          }

          export interface ThermoSession {''',
          )
          replace(
              "src/lib/storage/types.ts",
              '''  panic?: PanicAttack[];
            heat?: ThermoSession[];''',
              '''  panic?: PanicAttack[];
            eyes?: EyesEpisode[];
            heat?: ThermoSession[];''',
          )
          replace(
              "src/lib/storage/types.ts",
              '''export interface Note {''',
              '''export type RecipeCategory = "baking" | "cooking" | "spreads" | "other";
          export type RecipeStatus = "ready" | "draft" | "needs-review";

          export interface RecipeSection {
            title?: string;
            items: string[];
          }

          export interface RecipeData {
            category: RecipeCategory;
            ingredientSections: RecipeSection[];
            method: string[];
            notes?: string[];
            prepMinutes?: number;
            cookMinutes?: number;
            temperatureC?: number;
            portions?: string;
            favorite?: boolean;
            status?: RecipeStatus;
            sourceNoteId?: string;
            /** Verbatim source block retained so an import can always be audited. */
            sourceText?: string;
            /** Source lines the conservative importer could not classify safely. */
            unassignedText?: string[];
          }

          export interface Note {''',
          )
          replace(
              "src/lib/storage/types.ts",
              '''  content: string;
            checklist?: NoteChecklistItem[];''',
              '''  content: string;
            /** Recipes live beside notes in the same synced notebook store, but render in their own view. */
            kind?: "note" | "recipe";
            recipe?: RecipeData;
            checklist?: NoteChecklistItem[];''',
          )
          replace(
              "src/lib/storage/types.ts",
              '''      panic?: PanicAttack[];
                tetany?: TetanyEpisode[];
                extraMeds?: ExtraMed[];''',
              '''      panic?: PanicAttack[];
                tetany?: TetanyEpisode[];
                eyes?: EyesEpisode[];
                extraMeds?: ExtraMed[];''',
          )

          # Migration / sync / utility awareness.
          replace(
              "src/lib/storage/migrations.ts",
              '''      "panic",
                "heat",''',
              '''      "panic",
                "eyes",
                "heat",''',
          )
          replace(
              "src/lib/merge.ts",
              '''  "panic",
            "heat",''',
              '''  "panic",
            "eyes",
            "heat",''',
          )
          replace(
              "src/lib/storage/utilities.ts",
              '''    l.panic?.length ||
                l.heat?.length ||''',
              '''    l.panic?.length ||
                l.eyes?.length ||
                l.heat?.length ||''',
          )

          # Pain -> Episodes: same pattern as tetany/panic, with its own embedded form.
          replace(
              "src/features/logging/PainWizard.tsx",
              '''  type TetanyEpisode,
            type PanicAttack,
            type PainfulWhen,''',
              '''  type TetanyEpisode,
            type PanicAttack,
            type EyesEpisode,
            type PainfulWhen,''',
          )
          replace(
              "src/features/logging/PainWizard.tsx",
              '''import { PanicForm, TetanyForm } from "./EpisodeForms";''',
              '''import { PanicForm, TetanyForm } from "./EpisodeForms";
          import { EyesForm } from "./EyesForm";''',
          )
          replace(
              "src/features/logging/PainWizard.tsx",
              '''  const [tetanyOn, setTetanyOn] = useState(false);
            const [panicOn, setPanicOn] = useState(false);
            const [tetanyDraft, setTetanyDraft] = useState<TetanyEpisode | undefined>();
            const [panicDraft, setPanicDraft] = useState<PanicAttack | undefined>();''',
              '''  const [tetanyOn, setTetanyOn] = useState(false);
            const [panicOn, setPanicOn] = useState(false);
            const [eyesOn, setEyesOn] = useState(false);
            const [tetanyDraft, setTetanyDraft] = useState<TetanyEpisode | undefined>();
            const [panicDraft, setPanicDraft] = useState<PanicAttack | undefined>();
            const [eyesDraft, setEyesDraft] = useState<EyesEpisode | undefined>();''',
          )
          replace(
              "src/features/logging/PainWizard.tsx",
              '''    setTetanyOn(false);
                setPanicOn(false);
                setTetanyDraft(undefined);
                setPanicDraft(undefined);''',
              '''    setTetanyOn(false);
                setPanicOn(false);
                setEyesOn(false);
                setTetanyDraft(undefined);
                setPanicDraft(undefined);
                setEyesDraft(undefined);''',
          )
          replace(
              "src/features/logging/PainWizard.tsx",
              '''      tetany: tetanyOn && tetanyDraft ? [...(l.tetany ?? []), tetanyDraft] : l.tetany,
                panic: panicOn && panicDraft ? [...(l.panic ?? []), panicDraft] : l.panic,
              }));''',
              '''      tetany: tetanyOn && tetanyDraft ? [...(l.tetany ?? []), tetanyDraft] : l.tetany,
                panic: panicOn && panicDraft ? [...(l.panic ?? []), panicDraft] : l.panic,
                eyes: eyesOn && eyesDraft ? [...(l.eyes ?? []), eyesDraft] : l.eyes,
              }));''',
          )
          replace(
              "src/features/logging/PainWizard.tsx",
              '''          </div>
                </div>
              )}

              {activePainStepId === "details" && (''',
              '''          </div>
                <div>
                  <Field label="Eyes?">
                    <div className="mt-1 flex gap-2">
                      <Chip active={!eyesOn} onClick={() => { setEyesOn(false); setEyesDraft(undefined); }}>
                        No
                      </Chip>
                      <Chip active={eyesOn} onClick={() => setEyesOn(true)}>
                        Yes — log it
                      </Chip>
                    </div>
                  </Field>
                  {eyesOn && (
                    <div className="mt-3 rounded-2xl border border-border p-3">
                      <LogSchemaContext.Provider value={null}>
                        <EyesForm date={date} update={update} onDone={() => setEyesOn(false)} embedded onDraftChange={setEyesDraft} />
                      </LogSchemaContext.Provider>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activePainStepId === "details" && (''',
          )

          # Overview: Eyes gets the same full Card footprint as tetany/panic.
          replace(
              "src/components/home/DayOverview.tsx",
              '''import { DayOverviewSexCard } from "@/components/home/DayOverviewSexCard";''',
              '''import { DayOverviewSexCard } from "@/components/home/DayOverviewSexCard";
          import { DayOverviewEyesCard } from "@/components/home/DayOverviewEyesCard";''',
          )
          replace(
              "src/components/home/DayOverview.tsx",
              '''        log.panic?.length ||
                log.period ||''',
              '''        log.panic?.length ||
                log.eyes?.length ||
                log.period ||''',
          )
          replace(
              "src/components/home/DayOverview.tsx",
              '''      {!cycleTrackingHidden &&
                !!(''',
              '''      <DayOverviewEyesCard
                entries={log?.eyes ?? []}
                date={date}
                update={update}
                onEdit={(entry) => onEdit?.("eyes", entry)}
              />

              {!cycleTrackingHidden &&
                !!(''',
          )

          # Overview edit sheet: Eyes follows the identical episode editing shell.
          replace(
              "src/features/home/EpisodePainEditSheet.tsx",
              '''import { PanicForm, TetanyForm } from "@/features/logging/EpisodeForms";''',
              '''import { PanicForm, TetanyForm } from "@/features/logging/EpisodeForms";
          import { EyesForm } from "@/features/logging/EyesForm";''',
          )
          replace(
              "src/features/home/EpisodePainEditSheet.tsx",
              '''  type BixboData,
            type PanicAttack,
            type TetanyEpisode,''',
              '''  type BixboData,
            type EyesEpisode,
            type PanicAttack,
            type TetanyEpisode,''',
          )
          replace(
              "src/features/home/EpisodePainEditSheet.tsx",
              '''export type EpisodeEditTarget =
            | { kind: "tetany"; entry: TetanyEpisode }
            | { kind: "panic"; entry: PanicAttack };''',
              '''export type EpisodeEditTarget =
            | { kind: "tetany"; entry: TetanyEpisode }
            | { kind: "panic"; entry: PanicAttack }
            | { kind: "eyes"; entry: EyesEpisode };''',
          )
          replace(
              "src/features/home/EpisodePainEditSheet.tsx",
              '''  const [draft, setDraft] = useState<TetanyEpisode | PanicAttack | null>(target?.entry ?? null);''',
              '''  const [draft, setDraft] = useState<TetanyEpisode | PanicAttack | EyesEpisode | null>(target?.entry ?? null);''',
          )
          replace(
              "src/features/home/EpisodePainEditSheet.tsx",
              '''      const next = draft as PanicAttack;
                return {
                  ...log,
                  panic: (log.panic ?? []).map((entry) => (entry.id === target.entry.id ? next : entry)),
                };''',
              '''      if (target.kind === "eyes") {
                const next = draft as EyesEpisode;
                return {
                  ...log,
                  eyes: (log.eyes ?? []).map((entry) => (entry.id === target.entry.id ? next : entry)),
                };
              }

              const next = draft as PanicAttack;
              return {
                ...log,
                panic: (log.panic ?? []).map((entry) => (entry.id === target.entry.id ? next : entry)),
              };''',
          )
          replace(
              "src/features/home/EpisodePainEditSheet.tsx",
              '''                <Ico e={target.kind === "tetany" ? "⭐" : "✨"} size={14} />
                        <span>{t(target.kind === "tetany" ? "Tetany" : "Panic attack")}</span>''',
              '''                <Ico e={target.kind === "tetany" ? "⭐" : target.kind === "panic" ? "✨" : "👁️"} size={14} />
                        <span>{t(target.kind === "tetany" ? "Tetany" : target.kind === "panic" ? "Panic attack" : "Eyes")}</span>''',
          )
          replace(
              "src/features/home/EpisodePainEditSheet.tsx",
              '''                  {target.kind === "tetany" ? (
                                <TetanyForm
                                  key={`tetany:${target.entry.id}`}
                                  date={date}
                                  data={data}
                                  update={update}
                                  onDone={close}
                                  initialEntry={target.entry}
                                  embedded
                                  onDraftChange={setDraft}
                                />
                              ) : (
                                <PanicForm
                                  key={`panic:${target.entry.id}`}
                                  date={date}
                                  data={data}
                                  update={update}
                                  onDone={close}
                                  initialEntry={target.entry}
                                  embedded
                                  onDraftChange={setDraft}
                                />
                              )}''',
              '''                  {target.kind === "tetany" ? (
                                <TetanyForm
                                  key={`tetany:${target.entry.id}`}
                                  date={date}
                                  data={data}
                                  update={update}
                                  onDone={close}
                                  initialEntry={target.entry}
                                  embedded
                                  onDraftChange={setDraft}
                                />
                              ) : target.kind === "panic" ? (
                                <PanicForm
                                  key={`panic:${target.entry.id}`}
                                  date={date}
                                  data={data}
                                  update={update}
                                  onDone={close}
                                  initialEntry={target.entry}
                                  embedded
                                  onDraftChange={setDraft}
                                />
                              ) : (
                                <EyesForm
                                  key={`eyes:${target.entry.id}`}
                                  date={date}
                                  update={update}
                                  onDone={close}
                                  initialEntry={target.entry}
                                  embedded
                                  onDraftChange={setDraft}
                                />
                              )}''',
          )

          # Home routes Eyes card editing through the same episode edit surface.
          replace(
              "src/features/home/HomePage.tsx",
              '''  type EventEntry,
            type PanicAttack,
            type TetanyEpisode,''',
              '''  type EventEntry,
            type EyesEpisode,
            type PanicAttack,
            type TetanyEpisode,''',
          )
          replace(
              "src/features/home/HomePage.tsx",
              '''    if (cat === "panic") {
                setEpisodeEdit({ kind: "panic", entry: entry as PanicAttack });
                return;
              }
              setEpisodeEdit(null);''',
              '''    if (cat === "panic") {
                setEpisodeEdit({ kind: "panic", entry: entry as PanicAttack });
                return;
              }
              if (cat === "eyes") {
                setEpisodeEdit({ kind: "eyes", entry: entry as EyesEpisode });
                return;
              }
              setEpisodeEdit(null);''',
          )

          # Notes gains a first-class Recipes tab; regular notes stay separate.
          replace(
              "src/routes/notes.tsx",
              '''import { NoteEditor } from "./notes-editor";''',
              '''import { NoteEditor } from "./notes-editor";
          import { RecipesView } from "@/features/notes/RecipesView";''',
          )
          replace(
              "src/routes/notes.tsx",
              '''type NotesView = "all" | "folders" | "archived";''',
              '''type NotesView = "all" | "recipes" | "folders" | "archived";''',
          )
          replace(
              "src/routes/notes.tsx",
              '''      .filter((note) => {
                if (screen === "archived") {''',
              '''      .filter((note) => {
                if (note.kind === "recipe") return false;
                if (screen === "archived") {''',
          )
          replace(
              "src/routes/notes.tsx",
              '''      right={
                <button''',
              '''      right={screen === "recipes" && !openFolder ? undefined : (
                <button''',
          )
          replace(
              "src/routes/notes.tsx",
              '''        </button>
              }
            >''',
              '''        </button>
              )}
            >''',
          )
          replace(
              "src/routes/notes.tsx",
              '''        <div className="relative">
                  <Search className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />''',
              '''        {screen !== "recipes" && (
                  <div className="relative">
                    <Search className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" />''',
          )
          replace(
              "src/routes/notes.tsx",
              '''          )}
                </div>

                {!openFolder && (''',
              '''          )}
                  </div>
                )}

                {!openFolder && (''',
          )
          replace(
              "src/routes/notes.tsx",
              '''          <div className="grid grid-cols-3 gap-1 rounded-2xl bg-tint p-1 ring-1 ring-border/60">''',
              '''          <div className="grid grid-cols-4 gap-1 rounded-2xl bg-tint p-1 ring-1 ring-border/60">''',
          )
          replace(
              "src/routes/notes.tsx",
              '''              { key: "all" as const, label: "Notes" },
                      { key: "folders" as const, label: "Folders" },''',
              '''              { key: "all" as const, label: "Notes" },
                      { key: "recipes" as const, label: "Recipes" },
                      { key: "folders" as const, label: "Folders" },''',
          )
          replace(
              "src/routes/notes.tsx",
              '''        {screen === "folders" && !openFolder ? (''',
              '''        {screen === "recipes" && !openFolder ? (
                  <RecipesView data={view} update={update} />
                ) : screen === "folders" && !openFolder ? (''',
          )
          replace(
              "src/routes/notes.tsx",
              '''const count = safeNotebook.filter((note) => note.folderId === folder.id && !note.archived).length;''',
              '''const count = safeNotebook.filter((note) => note.kind !== "recipe" && note.folderId === folder.id && !note.archived).length;''',
          )

          print("Applied Eyes + Recipes integration patches")
          PY
          python /tmp/apply.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check architecture
        run: bun run architecture

      - name: Audit UI icons
        run: bun run audit:ui-emoji

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "BIXBO automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-eyes-recipes.yml
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Eyes episodes and recipe cards"
          git push origin HEAD:feature/eyes-recipes
