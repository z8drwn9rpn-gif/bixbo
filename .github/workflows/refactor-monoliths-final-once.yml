name: Refactor monoliths final once
on:
  push:
    paths:
      - '.github/workflows/refactor-monoliths-final-once.yml'
permissions:
  contents: write
concurrency:
  group: bixbo-monolith-final
  cancel-in-progress: false
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Modularize target files
        run: |
          node <<'JS'
          const ts = require('typescript');
          const fs = require('fs');
          const path = require('path');

          const read = p => fs.readFileSync(p,'utf8');
          const write = (p,s) => { fs.mkdirSync(path.dirname(p),{recursive:true}); fs.writeFileSync(p,s); };
          const parse = (p,text=read(p)) => ts.createSourceFile(p,text,ts.ScriptTarget.Latest,true,p.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
          const modText = (sf,text) => sf.statements.filter(ts.isImportDeclaration).map(n=>text.slice(n.getFullStart(),n.end).trim()).join('\n')+'\n';
          const hasExport = n => (n.modifiers||[]).some(m=>m.kind===ts.SyntaxKind.ExportKeyword);
          const exportify = (n,sf,text) => {
            let s=text.slice(n.getStart(sf),n.end);
            if (!hasExport(n) && (ts.isFunctionDeclaration(n)||ts.isClassDeclaration(n)||ts.isInterfaceDeclaration(n)||ts.isTypeAliasDeclaration(n)||ts.isEnumDeclaration(n)||ts.isVariableStatement(n))) s='export '+s;
            return s;
          };
          function bindingNames(name,out=[]){
            if(ts.isIdentifier(name)) out.push(name.text);
            else if(ts.isObjectBindingPattern(name)||ts.isArrayBindingPattern(name)) for(const e of name.elements){ if(ts.isBindingElement(e)) bindingNames(e.name,out); }
            return out;
          }
          function stmtNames(n){
            if((ts.isFunctionDeclaration(n)||ts.isClassDeclaration(n)||ts.isInterfaceDeclaration(n)||ts.isTypeAliasDeclaration(n)||ts.isEnumDeclaration(n))&&n.name) return [n.name.text];
            if(ts.isVariableStatement(n)) return n.declarationList.declarations.flatMap(d=>bindingNames(d.name));
            return [];
          }
          const typeOnlyDecl = n => ts.isInterfaceDeclaration(n)||ts.isTypeAliasDeclaration(n);
          function refNames(node,known){
            const out=new Set();
            function visit(n){
              if(ts.isIdentifier(n) && known.has(n.text)){
                const p=n.parent;
                let skip=false;
                if((ts.isPropertyAccessExpression(p)&&p.name===n)||(ts.isPropertyAssignment(p)&&p.name===n&&!ts.isShorthandPropertyAssignment(p))||(ts.isMethodDeclaration(p)&&p.name===n)||(ts.isPropertyDeclaration(p)&&p.name===n)||(ts.isPropertySignature(p)&&p.name===n)||(ts.isJsxAttribute(p)&&p.name===n)||(ts.isBindingElement(p)&&p.name===n)||(ts.isVariableDeclaration(p)&&p.name===n)||((ts.isFunctionDeclaration(p)||ts.isClassDeclaration(p)||ts.isInterfaceDeclaration(p)||ts.isTypeAliasDeclaration(p)||ts.isEnumDeclaration(p))&&p.name===n)) skip=true;
                if(!skip) out.add(n.text);
              }
              ts.forEachChild(n,visit);
            }
            visit(node); return out;
          }
          function buildGroupedModules(sourcePath, outDir, groups, opts={}){
            const text=read(sourcePath), sf=parse(sourcePath,text), imports=modText(sf,text);
            const decls=[];
            for(const st of sf.statements){ const names=stmtNames(st); if(names.length) decls.push({st,names,start:sf.getLineAndCharacterOfPosition(st.getStart(sf)).line+1}); }
            const nameMap=new Map(); for(const d of decls) for(const n of d.names) nameMap.set(n,d);
            const known=new Set(nameMap.keys());
            const assignment=new Map();
            for(const [group,pick] of Object.entries(groups)) for(const d of decls) if(pick(d)) for(const n of d.names) assignment.set(n,group);
            for(const [group,pick] of Object.entries(groups)){
              const selected=decls.filter(pick);
              const refs=new Set(); for(const d of selected) for(const r of refNames(d.st,known)) if(assignment.get(r)&&assignment.get(r)!==group) refs.add(r);
              const valueRefs=[],typeRefs=[];
              for(const r of refs){ const target=nameMap.get(r); (typeOnlyDecl(target.st)?typeRefs:valueRefs).push(r); }
              let pre=opts.adjustImports?opts.adjustImports(imports):imports;
              if(valueRefs.length) pre+=`import { ${valueRefs.sort().join(', ')} } from "./${assignment.get(valueRefs[0])}";\n`; // replaced below per source group
              // rebuild dependency imports grouped by module
              pre=opts.adjustImports?opts.adjustImports(imports):imports;
              const byGroup=new Map();
              for(const r of refs){ const g=assignment.get(r); if(!byGroup.has(g)) byGroup.set(g,{v:[],t:[]}); byGroup.get(g)[typeOnlyDecl(nameMap.get(r).st)?'t':'v'].push(r); }
              for(const [g,x] of byGroup){ if(x.v.length) pre+=`import { ${x.v.sort().join(', ')} } from "./${g}";\n`; if(x.t.length) pre+=`import type { ${x.t.sort().join(', ')} } from "./${g}";\n`; }
              if(opts.extraPrelude&&opts.extraPrelude[group]) pre+=opts.extraPrelude[group]+'\n';
              const body=selected.map(d=>exportify(d.st,sf,text)).join('\n\n');
              write(`${outDir}/${group}.${opts.ext||'tsx'}`,pre+'\n'+body+'\n');
            }
            return {sf,text,decls,nameMap,imports};
          }

          // ---------- LogSheet: split top-level forms into focused modules ----------
          {
            const source='src/components/LogSheet.tsx';
            const names={
              LogSheetRoot:new Set(['LogSheet']),
              LogFormPrimitives:new Set(['UpdateFn','InlineAdminCustomFields','ScaleInfoChildProps','normalizeLogScaleRange','Field','RegistryFieldBlock','Chip','SaveBar','CustomChipList','toggleIn','stripEmoji','scaleColor','ScaleLegend','IntensityScale','DurationField']),
              PainWizard:new Set(['PainWizard']),
              EpisodeForms:new Set(['EpisodeWizardNav','PanicForm','TetanyForm']),
              CycleForms:new Set(['PeriodForm','SexForm','AddCustomInline','ThermoForm']),
              LifestyleForms:new Set(['FoodForm','BristolIcon','BowelForm','TempForm']),
              MedsWorkoutForms:new Set(['MedsForm','WorkoutForm']),
              CalendarForms:new Set(['EventForm','TaskForm','NoteForm','PostpartumSymptomsForm']),
            };
            const groups={}; for(const [g,set] of Object.entries(names)) groups[g]=d=>d.names.some(n=>set.has(n));
            buildGroupedModules(source,'src/features/logging',groups,{ext:'tsx'});
            write(source,'export { LogSheet } from "@/features/logging/LogSheetRoot";\n');
          }

          // helper: split one giant function into model hook + render modules; move top-level helpers to shared.
          function splitPage({source,featureDir,mainName,routeKeepNames,tailMode,rootSplit=false}){
            const text=read(source), sf=parse(source,text), imports=modText(sf,text);
            const stmts=[...sf.statements];
            const main=stmts.find(n=>ts.isFunctionDeclaration(n)&&n.name?.text===mainName);
            if(!main) throw new Error(`Missing ${mainName}`);
            const shared=stmts.filter(n=>!ts.isImportDeclaration(n) && !routeKeepNames.has(stmtNames(n)[0]) && n!==main);
            const sharedNames=shared.flatMap(stmtNames);
            const sharedTypes=shared.filter(typeOnlyDecl).flatMap(stmtNames);
            const sharedValues=shared.filter(n=>!typeOnlyDecl(n)).flatMap(stmtNames);
            write(`${featureDir}/shared.tsx`,imports+'\n'+shared.map(n=>exportify(n,sf,text)).join('\n\n')+'\n');
            const sharedImports=(sharedValues.length?`import { ${sharedValues.join(', ')} } from "./shared";\n`:'')+(sharedTypes.length?`import type { ${sharedTypes.join(', ')} } from "./shared";\n`:'');
            const body=[...main.body.statements];
            let cut;
            if(tailMode==='return') cut=body.findIndex(ts.isReturnStatement);
            else if(tailMode==='first-if') cut=body.findIndex(ts.isIfStatement);
            if(cut<0) throw new Error(`No tail cut for ${mainName}`);
            const pre=body.slice(0,cut), tail=body.slice(cut);
            const locals=[]; for(const st of pre){ if(ts.isVariableStatement(st)) for(const d of st.declarationList.declarations) bindingNames(d.name,locals); else if(ts.isFunctionDeclaration(st)&&st.name) locals.push(st.name.text); }
            const unique=[...new Set(locals)];
            const preText=pre.map(st=>text.slice(st.getStart(sf),st.end)).join('\n\n');
            const hookName=`use${mainName}Model`, modelType=`${mainName}Model`;
            write(`${featureDir}/${hookName}.tsx`,imports+sharedImports+`\nexport function ${hookName}() {\n${preText}\n\nreturn { ${unique.join(', ')} };\n}\n\nexport type ${modelType} = ReturnType<typeof ${hookName}>;\n`);
            const destruct=`const { ${unique.join(', ')} } = model;`;
            if(tailMode==='return'){
              const ret=tail.find(ts.isReturnStatement); let expr=ret.expression;
              while(ts.isParenthesizedExpression(expr)) expr=expr.expression;
              if(rootSplit && ts.isJsxElement(expr)){
                const children=[...expr.children]; const groups=[]; let cur=[],size=0;
                for(const ch of children){ const s=text.slice(ch.pos,ch.end); const substantive=s.trim().length>0; if(size>24000&&substantive&&cur.length){ groups.push(cur); cur=[]; size=0; } cur.push(ch); size+=Buffer.byteLength(s); }
                if(cur.length) groups.push(cur);
                const partImports=[];
                groups.forEach((arr,i)=>{
                  const part=`${mainName}ViewPart${i+1}`; partImports.push(`import { ${part} } from "./${part}";`);
                  const childText=arr.map(ch=>text.slice(ch.pos,ch.end)).join('');
                  write(`${featureDir}/${part}.tsx`,imports+sharedImports+`import type { ${modelType} } from "./${hookName}";\n\nexport function ${part}({ model }: { model: ${modelType} }) {\n  ${destruct}\n  return (<>${childText}</>);\n}\n`);
                });
                const opening=text.slice(expr.openingElement.getStart(sf),expr.openingElement.end); const closing=text.slice(expr.closingElement.getStart(sf),expr.closingElement.end);
                write(`${featureDir}/${mainName}View.tsx`,`import type { ${modelType} } from "./${hookName}";\n${partImports.join('\n')}\nexport function ${mainName}View({ model }: { model: ${modelType} }) {\n  ${destruct}\n  return (${opening}${groups.map((_,i)=>`<${mainName}ViewPart${i+1} model={model} />`).join('')}${closing});\n}\n`);
              } else {
                const retText=text.slice(ret.getStart(sf),ret.end);
                write(`${featureDir}/${mainName}View.tsx`,imports+sharedImports+`import type { ${modelType} } from "./${hookName}";\nexport function ${mainName}View({ model }: { model: ${modelType} }) { ${destruct}\n${retText}\n}\n`);
              }
              write(`${featureDir}/${mainName}.tsx`,`import { ${hookName} } from "./${hookName}";\nimport { ${mainName}View } from "./${mainName}View";\nexport function ${mainName}() { const model = ${hookName}(); return <${mainName}View model={model} />; }\n`);
            } else {
              const finalRet=tail.findLast(ts.isReturnStatement); if(!finalRet) throw new Error('profile final return missing');
              const special=tail.filter(st=>st!==finalRet).map(st=>text.slice(st.getStart(sf),st.end)).join('\n\n');
              const retText=text.slice(finalRet.getStart(sf),finalRet.end);
              write(`${featureDir}/${mainName}MainView.tsx`,imports+sharedImports+`import type { ${modelType} } from "./${hookName}";\nexport function ${mainName}MainView({ model }: { model: ${modelType} }) { ${destruct}\n${retText}\n}\n`);
              write(`${featureDir}/${mainName}SpecialViews.tsx`,imports+sharedImports+`import type { ${modelType} } from "./${hookName}";\nimport { ${mainName}MainView } from "./${mainName}MainView";\nexport function ${mainName}SpecialViews({ model }: { model: ${modelType} }) { ${destruct}\n${special}\nreturn <${mainName}MainView model={model} />;\n}\n`);
              write(`${featureDir}/${mainName}.tsx`,`import { ${hookName} } from "./${hookName}";\nimport { ${mainName}SpecialViews } from "./${mainName}SpecialViews";\nexport function ${mainName}() { const model = ${hookName}(); return <${mainName}SpecialViews model={model} />; }\n`);
            }
            return {sf,text,imports,stmts,main};
          }

          // ---------- Patterns ----------
          {
            const source='src/routes/patterns.tsx';
            const text=read(source),sf=parse(source,text); const route=sf.statements.find(n=>ts.isVariableStatement(n)&&stmtNames(n).includes('Route')); const page=sf.statements.find(n=>ts.isFunctionDeclaration(n)&&n.name?.text==='PatternsPage');
            splitPage({source,featureDir:'src/features/patterns',mainName:'PatternsContent',routeKeepNames:new Set(['Route','PatternsPage']),tailMode:'return',rootSplit:true});
            const imports=modText(sf,text);
            write(source,imports+'import { PatternsContent } from "@/features/patterns/PatternsContent";\nexport { PatternsContent };\n\n'+text.slice(route.getStart(sf),route.end)+'\n\n'+text.slice(page.getStart(sf),page.end)+'\n');
          }

          // ---------- Profile ----------
          {
            const source='src/routes/profile.tsx'; const text=read(source),sf=parse(source,text); const route=sf.statements.find(n=>ts.isVariableStatement(n)&&stmtNames(n).includes('Route'));
            splitPage({source,featureDir:'src/features/profile',mainName:'ProfilePage',routeKeepNames:new Set(['Route']),tailMode:'first-if'});
            const imports=modText(sf,text);
            write(source,imports+'import { ProfilePage } from "@/features/profile/ProfilePage";\n\n'+text.slice(route.getStart(sf),route.end)+'\n');
          }

          // ---------- Storage: types/defaults/migrations/runtime/utilities ----------
          {
            const source='src/lib/storage.ts'; const text=read(source),sf=parse(source,text);
            const groups={
              types:d=>d.start<883,
              defaults:d=>d.start>=883&&d.start<1008,
              migrations:d=>d.start>=1008&&d.start<1526,
              runtime:d=>d.start>=1526&&d.start<2149,
              utilities:d=>d.start>=2149,
            };
            const exportDecls=sf.statements.filter(ts.isExportDeclaration).map(n=>text.slice(n.getStart(sf),n.end).replace(/"\.\//g,'"../')).join('\n');
            buildGroupedModules(source,'src/lib/storage',groups,{ext:'ts',adjustImports:s=>s.replace(/"\.\//g,'"../'),extraPrelude:{types:exportDecls}});
            write(source,'export * from "./storage/types";\nexport * from "./storage/defaults";\nexport * from "./storage/migrations";\nexport * from "./storage/runtime";\nexport * from "./storage/utilities";\n');
          }

          // ---------- i18n: runtime + small locale chunks ----------
          {
            const source='src/lib/i18n.ts',text=read(source),sf=parse(source,text);
            const vars={};
            for(const st of sf.statements) if(ts.isVariableStatement(st)) for(const d of st.declarationList.declarations) if(ts.isIdentifier(d.name)) vars[d.name.text]=d.initializer;
            const en=vars.EN,sk=vars.SK; if(!ts.isObjectLiteralExpression(en)||!ts.isObjectLiteralExpression(sk)) throw new Error('i18n catalogs not found');
            write('src/lib/i18n/en.ts',`export const EN: Record<string, string> = ${text.slice(en.getStart(sf),en.end)};\n`);
            const chunks=[]; let cur=[],size=0;
            for(const p of sk.properties){ const s=text.slice(p.getStart(sf),p.end)+','; if(size>18000&&cur.length){chunks.push(cur);cur=[];size=0;} cur.push(s);size+=Buffer.byteLength(s); }
            if(cur.length) chunks.push(cur);
            const imports=[]; const spreads=[];
            chunks.forEach((arr,i)=>{ const n=i+1,key=`SK_PART_${n}`; write(`src/lib/i18n/sk-${n}.ts`,`export const ${key}: Record<string, string> = {\n${arr.join('\n')}\n};\n`); imports.push(`import { ${key} } from "./sk-${n}";`); spreads.push(`...${key}`); });
            write('src/lib/i18n/sk.ts',imports.join('\n')+`\nexport const SK: Record<string, string> = { ${spreads.join(', ')} };\n`);
            write(source,'import { EN } from "./i18n/en";\nimport { SK } from "./i18n/sk";\n\nexport type AppLanguage = "en" | "sk";\nconst TRANSLATIONS: Record<AppLanguage, Record<string, string>> = { en: EN, sk: SK };\nexport function normalizeLanguage(value: unknown): AppLanguage { return value === "sk" ? "sk" : "en"; }\nexport function translate(language: AppLanguage, key: string): string { const dictionary = TRANSLATIONS[language] ?? EN; return dictionary[key] ?? key; }\n');
          }

          // Remove temporary one-shot audit/refactor workflows.
          for(const p of ['.github/workflows/audit-monolith-structure-once.yml','.github/workflows/audit-large-components-once.yml','.github/workflows/refactor-i18n-locales-once.yml']) if(fs.existsSync(p)) fs.rmSync(p);
          JS
      - name: Verify typecheck tests build and file sizes
        run: |
          bun run typecheck
          bun test
          bun run build
          python3 <<'PY'
          from pathlib import Path
          roots=['src/components/LogSheet.tsx','src/routes/patterns.tsx','src/routes/profile.tsx','src/lib/storage.ts','src/lib/i18n.ts']
          print('ROOT SIZES')
          for p in roots: print(p,Path(p).stat().st_size)
          check_dirs=['src/features/logging','src/features/patterns','src/features/profile','src/lib/storage','src/lib/i18n']
          oversized=[]
          for d in check_dirs:
            for p in Path(d).glob('*.ts*'):
              n=p.stat().st_size
              print(p,n)
              if n>50000: oversized.append((str(p),n))
          if oversized:
            raise SystemExit('Still oversized modules: '+repr(oversized))
          PY
      - name: Commit verified modularization
        run: |
          rm .github/workflows/refactor-monoliths-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: modularize remaining monoliths"
          git fetch origin main
          git rebase origin/main
          git push origin main
