name: Apply admin core heatmap metrics
on:
  push:
    branches:
      - agent/admin-core-heatmap-metrics
    paths:
      - .github/scripts/apply_admin_core_heatmap.py
      - .github/workflows/apply-admin-core-heatmap.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-core-heatmap-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/apply_admin_core_heatmap.py
      - name: Remove temporary patch files
        run: rm .github/scripts/apply_admin_core_heatmap.py .github/workflows/apply-admin-core-heatmap.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'expose admin core fields as heatmap metrics'
          git push origin HEAD:agent/admin-core-heatmap-metrics
