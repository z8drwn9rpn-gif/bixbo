name: Fix Pain episode notes and save
on:
  push:
    branches: [agent/fix-pain-episode-notes-save]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-pain-episode-notes-save
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python .github/scripts/fix_pain_episode_notes_save.py
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit app changes
        run: |
          git config user.name "z8drwn9rpn-gif"
          git config user.email "z8drwn9rpn@privaterelay.appleid.com"
          git add src/features/logging/EpisodeForms.tsx src/features/logging/PainWizard.tsx src/lib/storage/types.ts src/components/home/DayOverview.tsx
          git diff --cached --quiet || git commit -m "fix: unify Pain episode notes and save flow"
          git push origin HEAD:agent/fix-pain-episode-notes-save
