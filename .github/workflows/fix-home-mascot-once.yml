name: Fix Home mascot once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-mascot-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put exact mascot inside Home title
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/components/AppShell.tsx')
          s = app.read_text()
          old_sig = 'export function AppShell({ children, title, right, big = false }: { children: ReactNode; title?: ReactNode; right?: ReactNode; big?: boolean; }) {'
          new_sig = 'export function AppShell({ children, title, right, big = false, showMascot = true }: { children: ReactNode; title?: ReactNode; right?: ReactNode; big?: boolean; showMascot?: boolean; }) {'
          if old_sig in s:
            s = s.replace(old_sig, new_sig, 1)

          old = '''                <span className={big ? "relative block h-[52px] w-[52px] shrink-0 overflow-visible" : "relative block h-10 w-10 shrink-0 overflow-visible"} aria-hidden="true">\n                  <img src={BIXBO_MASCOT_SRC} alt="" aria-hidden="true" draggable={false} className="block h-full w-full object-contain object-center opacity-100 visible" />\n                </span>'''
          new = '''                {showMascot && (\n                  <span className={big ? "relative block h-[52px] w-[52px] shrink-0 overflow-visible" : "relative block h-10 w-10 shrink-0 overflow-visible"} aria-hidden="true">\n                    <img src={BIXBO_MASCOT_SRC} alt="" aria-hidden="true" draggable={false} className="block h-full w-full object-contain object-center opacity-100 visible" />\n                  </span>\n                )}'''
          if old not in s:
            raise SystemExit('Current AppShell mascot block not found')
          app.write_text(s.replace(old, new, 1))

          home = Path('src/features/home/HomePage.tsx')
          s = home.read_text()
          marker = 'import { AppShell } from "@/components/AppShell";\n'
          if 'bixboMascot from "@/assets/bixbo-mascot-user.png"' not in s:
            s = s.replace(marker, marker + 'import bixboMascot from "@/assets/bixbo-mascot-user.png";\n', 1)

          old_title = '''  return <AppShell\n    big\n    title={<div className="flex flex-col leading-tight"><span>BIXBO</span><span className="text-xs font-normal text-muted-foreground">{t("Hi")}, {view.settings.userName?.trim() || t("there")} <Ico e="❤️" size={12} /></span></div>}'''
          new_title = '''  return <AppShell\n    big\n    showMascot={false}\n    title={\n      <div className="flex items-center gap-3 leading-tight">\n        <img\n          src={bixboMascot}\n          alt="BIXBO penguin"\n          draggable={false}\n          className="h-[52px] w-[52px] shrink-0 object-contain"\n          style={{ display: "block", opacity: 1, visibility: "visible", filter: "none", mixBlendMode: "normal" }}\n        />\n        <div className="flex flex-col">\n          <span>BIXBO</span>\n          <span className="text-xs font-normal text-muted-foreground">{t("Hi")}, {view.settings.userName?.trim() || t("there")} <Ico e="❤️" size={12} /></span>\n        </div>\n      </div>\n    }'''
          if old_title not in s:
            raise SystemExit('Home title block not found')
          home.write_text(s.replace(old_title, new_title, 1))
          PY

      - name: Verify build
        run: |
          npm install
          npm run build

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-home-mascot-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppShell.tsx src/features/home/HomePage.tsx .github/workflows/fix-home-mascot-once.yml
          git commit -m "fix: render exact mascot in Home header"
          git pull --rebase origin main
          git push origin HEAD:main
