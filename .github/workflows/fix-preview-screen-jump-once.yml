name: Fix preview screen jump once
on:
  push:
    branches: [agent/fix-preview-screen-jump]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-preview-screen-jump
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch log viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/logging/LogSheetRoot.tsx')
          s=p.read_text()
          old='''            ? `flex h-[100dvh] max-h-[100dvh] flex-col rounded-t-none bg-background p-0 ${\n                active === "pain" ? "pt-[env(safe-area-inset-top)]" : "pt-0"\n              }`'''
          new='''            ? `fixed !inset-0 !left-0 !right-0 !top-0 !bottom-0 flex !h-[100svh] !max-h-[100svh] !w-full !max-w-none min-h-0 flex-col overflow-hidden !rounded-none !border-0 bg-background p-0 !shadow-none !transition-none !animate-none ${\n                active === "pain" ? "pt-[env(safe-area-inset-top)]" : "pt-0"\n              }`'''
          if old not in s:
            raise SystemExit('active SheetContent class block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test || true
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "z8drwn9rpn-gif"
          git config user.email "z8drwn9rpn@privaterelay.appleid.com"
          git add src/features/logging/LogSheetRoot.tsx
          git diff --cached --quiet || git commit -m "fix: stabilize full-screen log viewport"
          git push origin HEAD:agent/fix-preview-screen-jump
