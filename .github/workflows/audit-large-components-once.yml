name: Audit large component internals once
on:
  push:
    paths:
      - '.github/workflows/audit-large-components-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Report function body statements
        run: |
          node <<'JS'
          const ts = require('typescript');
          const fs = require('fs');
          const targets = [
            ['src/routes/patterns.tsx','PatternsContent'],
            ['src/routes/profile.tsx','ProfilePage'],
            ['src/components/LogSheet.tsx','LogSheet'],
          ];
          for (const [file,name] of targets) {
            const text=fs.readFileSync(file,'utf8');
            const sf=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            let fn;
            sf.forEachChild(n=>{ if ((ts.isFunctionDeclaration(n)||ts.isFunctionExpression(n)) && n.name?.text===name) fn=n; });
            if (!fn) { console.log('NOT FOUND',file,name); continue; }
            console.log(`\n=== ${file} :: ${name} ===`);
            for (const st of fn.body.statements) {
              const s=sf.getLineAndCharacterOfPosition(st.getStart(sf));
              const e=sf.getLineAndCharacterOfPosition(st.end);
              let head=text.slice(st.getStart(sf), Math.min(st.end, st.getStart(sf)+180)).replace(/\s+/g,' ');
              console.log(`${String(s.line+1).padStart(5)}-${String(e.line+1).padStart(5)} ${String(st.end-st.getStart(sf)).padStart(7)} ${ts.SyntaxKind[st.kind].padEnd(24)} | ${head}`);
            }
          }
          JS
