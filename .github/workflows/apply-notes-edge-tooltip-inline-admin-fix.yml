name: Apply Notes Edge Tooltip Inline Admin fix

on:
  push:
    branches:
      - agent/fix-notes-edge-tooltip-inline-admin
    paths:
      - scripts/apply_notes_edge_tooltip_inline_admin_fix.py
      - .github/workflows/apply-notes-edge-tooltip-inline-admin-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-notes-edge-tooltip-inline-admin
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python3 scripts/apply_notes_edge_tooltip_inline_admin_fix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified patch
        run: |
          git config user.name "bixbo-admin-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/notes-editor.tsx src/routes/insights.tsx src/components/AdminEditOverlay.tsx src/lib/__tests__/notes-edge-tooltip-inline-admin-regression.test.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix Notes keyboard, Heatmap edge tooltip, and live Admin editor"
          git push origin HEAD:agent/fix-notes-edge-tooltip-inline-admin
