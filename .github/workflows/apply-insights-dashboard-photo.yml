name: Apply insights dashboard photo match

on:
  push:
    branches:
      - feat/insights-dashboard-photo-match

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/insights-dashboard-photo-match
          fetch-depth: 0
      - name: Apply dashboard wiring
        run: python scripts/apply_insights_dashboard_photo.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Match Insights analytics cards to approved mockups"
          git push origin HEAD:feat/insights-dashboard-photo-match
