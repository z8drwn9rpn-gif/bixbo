name: Apply mobile profile fix

on:
  push:
    branches:
      - agent/fix-mobile-nav-profile-name
    paths:
      - scripts/apply_mobile_profile_fix.py
      - .github/workflows/apply-mobile-profile-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-nav-profile-name
      - uses: oven-sh/setup-bun@v2
      - name: Apply profile patch
        run: python scripts/apply_mobile_profile_fix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified fix and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/profile.tsx src/components/BottomNav.tsx
          git rm scripts/apply_mobile_profile_fix.py .github/workflows/apply-mobile-profile-fix.yml
          git commit -m "Fix mobile nav and restore greeting preference"
          git push origin HEAD:agent/fix-mobile-nav-profile-name
