name: One-time admin-only HAK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger admin-only HAK patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: python3 scripts/patch-admin-only-hak.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
      - name: Commit
        run: |
          rm -f scripts/patch-admin-only-hak.py .github/workflows/one-time-admin-only-hak.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restrict HAK calendar to admin owner account"
          git push origin HEAD:main
