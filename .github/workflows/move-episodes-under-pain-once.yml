name: Move episodes under Pain once

on:
  push:
    branches:
      - agent/move-episodes-under-pain
    paths:
      - .github/workflows/move-episodes-under-pain-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-episodes-under-pain
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/move_episodes_under_pain_once.py
      - name: Validate
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit
        run: |
          rm .github/workflows/move-episodes-under-pain-once.yml
          rm scripts/move_episodes_under_pain_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/logging/LogSheetRootV2.tsx .github/workflows/move-episodes-under-pain-once.yml scripts/move_episodes_under_pain_once.py
          git commit -m "fix: move tetany and panic under pain log"
          git push origin HEAD:agent/move-episodes-under-pain
