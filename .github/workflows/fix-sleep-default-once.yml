name: Fix sleep default once
on:
  push:
    branches: [agent/fix-sleep-default]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sleep-default
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch sleep UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/logging/LifestyleForms.tsx')
          s=p.read_text()
          s=s.replace('const [tab, setTab] = useState<Tab>("temperature");','const [tab, setTab] = useState<Tab>("sleep");')
          lines=s.splitlines()
          lines=[line for line in lines if not line.strip().startswith('const qualityScores:') and not line.strip().startswith('const sleepScore =') and not line.strip().startswith('const sleepScoreLabel =')]
          s='\n'.join(lines)+'\n'
          marker='<div className="rounded-2xl bg-surface p-4 ring-1 ring-border"><div className="flex items-center gap-4"><div className="grid h-24 w-24 shrink-0 place-items-center rounded-full border-[7px] border-primary/70">'
          start=s.find(marker)
          if start != -1:
              end=s.find('<Field label="Bedtime / Wake up">', start)
              if end == -1: raise SystemExit('sleep score block end not found')
              s=s[:start]+s[end:]
          if 'useState<Tab>("sleep")' not in s:
            raise SystemExit('default sleep tab patch did not apply')
          if 'Sleep score' in s or 'sleepScoreLabel' in s or 'const sleepScore =' in s:
            raise SystemExit('sleep score UI/code still present')
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test || true
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "z8drwn9rpn-gif"
          git config user.email "z8drwn9rpn@privaterelay.appleid.com"
          git add src/features/logging/LifestyleForms.tsx
          git diff --cached --quiet || git commit -m "fix: open vitals on sleep and remove sleep score"
          git push origin HEAD:agent/fix-sleep-default
