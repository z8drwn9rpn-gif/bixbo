name: Apply admin custom page blocks
on:
  push:
    branches: [agent/admin-custom-page-blocks]
    paths:
      - .github/workflows/apply-admin-custom-page-blocks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-custom-page-blocks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_admin_custom_page_blocks.py
      - run: rm .github/scripts/apply_admin_custom_page_blocks.py .github/workflows/apply-admin-custom-page-blocks.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/appRegistry.ts src/lib/effectiveAdminConfig.ts src/routes/__root.tsx src/lib/__tests__/admin-page-blocks.test.ts .github
          git commit -m 'add global admin custom page blocks'
          git push origin HEAD:agent/admin-custom-page-blocks
