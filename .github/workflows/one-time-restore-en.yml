name: One-time EN i18n restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-restore-en.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore EN map
        run: python .github/scripts/restore_en_i18n.py
      - name: Commit cleanup
        run: |
          rm -f .github/scripts/restore_en_i18n.py
          rm -f .github/workflows/one-time-restore-en.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore EN i18n keys"
          git push
