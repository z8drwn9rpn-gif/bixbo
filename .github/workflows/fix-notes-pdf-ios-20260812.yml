name: Fix notes and PDF iOS 2026-08-12
on:
  push:
    paths:
      - scripts/fix_notes_pdf_ios_20260812.py
      - .github/workflows/fix-notes-pdf-ios-20260812.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python scripts/fix_notes_pdf_ios_20260812.py
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Add PDF dependencies
        run: bun add jspdf html2canvas
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/notes-editor.tsx src/routes/report.tsx package.json bun.lock
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix iOS notes typing and PDF download"
            git push origin HEAD:main
          fi
