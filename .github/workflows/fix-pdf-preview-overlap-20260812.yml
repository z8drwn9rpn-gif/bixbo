name: Fix PDF preview overlap 2026-08-12
on:
  push:
    paths:
      - scripts/fix_pdf_preview_overlap_20260812.py
      - .github/workflows/fix-pdf-preview-overlap-20260812.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python scripts/fix_pdf_preview_overlap_20260812.py
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/report.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix PDF preview toolbar overlap"
            git push origin HEAD:main
          fi
