name: Stability security maintainability
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stabilize:
    if: github.event.head_commit.message == 'Run stability security maintainability cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply stabilization
        run: python3 scripts/stability-security-maintainability.py
      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo 'Tracked .env file found'
            exit 1
          fi
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Production build
        run: bun run build
      - name: Commit verified stabilization
        run: |
          git restore .github/workflows/ci.yml || true
          git restore .github/workflows/apply-nav-vitals-tooltip-assets.yml || true
          git restore .github/workflows/apply-notes-edge-tooltip-inline-admin-fix.yml || true
          git restore .github/workflows/fix-notes-textarea-remount-20260812.yml || true
          git restore .github/workflows/fix-pdf-preview-overlap-20260812.yml || true
          git restore .github/workflows/fix-pdf-pwa-safe-area-20260812.yml || true
          rm -f scripts/stability-security-maintainability.py
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stabilize meds data and Home maintainability"
          git push origin HEAD:main
