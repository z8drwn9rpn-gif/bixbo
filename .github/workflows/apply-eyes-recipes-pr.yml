name: Apply Eyes and Recipes on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/eyes-recipes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyes-recipes
          fetch-depth: 0

      - name: Apply integration
        shell: bash
        run: |
          if grep -q 'export interface EyesEpisode' src/lib/storage/types.ts && grep -q 'RecipesView' src/routes/notes.tsx; then
            echo 'Integration already applied.'
          else
            python scripts/apply-eyes-recipes.py
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run architecture
      - run: bun run audit:ui-emoji
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'BIXBO automation'
          git config user.email 'actions@users.noreply.github.com'
          if [ -f .github/workflows/apply-eyes-recipes.yml ]; then git rm .github/workflows/apply-eyes-recipes.yml; fi
          if [ -f .github/workflows/apply-eyes-recipes-pr.yml ]; then git rm .github/workflows/apply-eyes-recipes-pr.yml; fi
          if [ -f scripts/apply-eyes-recipes.py ]; then git rm scripts/apply-eyes-recipes.py; fi
          git add src
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'Add Eyes episodes and recipe cards'
          git push origin HEAD:feature/eyes-recipes
