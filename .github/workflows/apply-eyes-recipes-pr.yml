name: Apply Eyes and Recipes on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/eyes-recipes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyes-recipes
          fetch-depth: 0
      - name: Apply integration
        run: python scripts/apply-eyes-recipes.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run architecture
      - run: bun run audit:ui-emoji
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Commit validated changes
        run: |
          git config user.name "BIXBO automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-eyes-recipes.yml .github/workflows/apply-eyes-recipes-pr.yml scripts/apply-eyes-recipes.py
          git add src
          git commit -m "Add Eyes episodes and recipe cards"
          git push origin HEAD:feature/eyes-recipes
