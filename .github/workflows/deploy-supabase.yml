name: BIXBO Supabase production deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bixbo-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: wgdydwttzsveevkljkmr

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing SUPABASE_PROJECT_ID"; exit 1; }

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Deploy authenticated Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy push-subscription --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy account-privacy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy cron Edge Function
        # pg_cron cannot mint a Supabase user JWT. The handler validates
        # x-cron-secret itself, so this function intentionally keeps JWT
        # verification disabled at the platform edge.
        run: supabase functions deploy send-due-push --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Verify migration history
        run: supabase migration list

      - name: Verify deployed functions are visible
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
