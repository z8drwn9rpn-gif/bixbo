name: Apply admin entry upsert
on:
  push:
    branches: [agent/admin-fields-entry-upsert]
    paths:
      - '.github/scripts/apply_admin_entry_upsert.py'
      - '.github/workflows/apply-admin-entry-upsert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-fields-entry-upsert
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_admin_entry_upsert.py
      - run: rm .github/scripts/apply_admin_entry_upsert.py .github/workflows/apply-admin-entry-upsert.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'link supplementary fields to edited core entries'
          git push
