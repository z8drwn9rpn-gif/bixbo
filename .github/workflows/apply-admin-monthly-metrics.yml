name: Apply admin monthly custom metrics
on:
  push:
    branches:
      - agent/admin-monthly-custom-metrics
    paths:
      - .github/scripts/apply_admin_monthly_metrics.py
      - .github/workflows/apply-admin-monthly-metrics.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-monthly-custom-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/apply_admin_monthly_metrics.py
      - name: Remove temporary patch files
        run: rm .github/scripts/apply_admin_monthly_metrics.py .github/workflows/apply-admin-monthly-metrics.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'add admin monthly custom metrics'
          git push origin HEAD:agent/admin-monthly-custom-metrics
