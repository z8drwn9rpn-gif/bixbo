name: Fix boot and remove quick save
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger boot fix and quick-save cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply fix
        run: python3 scripts/fix-boot-remove-quick-save.py
      - name: Verify
        run: |
          test ! -f .env
          test -f .env.example
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified fix
        run: |
          rm -f scripts/fix-boot-remove-quick-save.py .github/workflows/fix-boot-remove-quick-save.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix app boot and remove redundant quick saves"
          git push origin HEAD:main
