name: Full UX stability pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger full UX stability pass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/full-ux-stability-pass-20260813.py
      - name: Keep existing Insights schedule helper import
        run: sed -i '/} from "@\/lib\/storage";/i\  medScheduleItems,' src/routes/insights.tsx
      - name: Full verification
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified changes
        run: |
          rm -f scripts/full-ux-stability-pass-20260813.py .github/workflows/full-ux-stability-pass-20260813.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete UX and stability priority pass"
          git push origin HEAD:main
