name: Apply admin Couple Notes fix
on:
  push:
    branches:
      - agent/fix-admin-couple-notes
    paths:
      - scripts/fix_admin_couple_notes.py
      - .github/workflows/fix-admin-couple-notes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-admin-couple-notes
      - name: Apply patch
        run: python3 scripts/fix_admin_couple_notes.py
      - name: Remove temporary patch files
        run: rm -f scripts/fix_admin_couple_notes.py .github/workflows/fix-admin-couple-notes.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Admin routing, Notes keyboard and deploy freshness"
          git push origin HEAD:agent/fix-admin-couple-notes
