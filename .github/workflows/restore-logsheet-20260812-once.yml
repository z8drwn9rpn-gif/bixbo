name: Restore exact Aug 12 LogSheet
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'chore: restore exact Aug 12 LogSheet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Restore exact LogSheet from Aug 12
        run: git show faf313dfca5382eddae5de559d87cd9e4f2a35c9:src/components/LogSheet.tsx > src/components/LogSheet.tsx
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
      - name: Commit exact rollback
        run: |
          rm -f .github/workflows/restore-logsheet-20260812-once.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/LogSheet.tsx .github/workflows/restore-logsheet-20260812-once.yml
          git diff --cached --check
          git commit -m "restore: exact Aug 12 LogSheet"
          git push origin HEAD:main
