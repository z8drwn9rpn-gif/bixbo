name: Apply targeted audit hardening

on:
  push:
    branches: [code-audit-hardening-no-notes]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'Apply targeted audit source hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code-audit-hardening-no-notes
      - name: Apply safe source transforms
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          p = Path("src/components/icons/BixboIcons.tsx")
          s = p.read_text()
          s = replace_once(s, "function renderPoop(p: IconProps, dots: boolean) {", "function PoopGlyph({ dots, ...p }: IconProps & { dots: boolean }) {", "PoopGlyph function")
          s = replace_once(s, "export function PoopIcon(p: IconProps) {\n  return renderPoop(p, true);\n}", "export function PoopIcon(p: IconProps) {\n  return <PoopGlyph {...p} dots />;\n}", "PoopIcon wrapper")
          s = replace_once(s, "export function PoopIconPlain(p: IconProps) {\n  return renderPoop(p, false);\n}", "export function PoopIconPlain(p: IconProps) {\n  return <PoopGlyph {...p} dots={false} />;\n}", "PoopIconPlain wrapper")
          p.write_text(s)

          p = Path("src/components/icons/BottomNavReferenceIcons.tsx")
          s = p.read_text()
          s = replace_once(s, "function gid(prefix: string) {", "function useGid(prefix: string) {", "gid declaration")
          s = s.replace("gid(\"", "useGid(\"")
          p.write_text(s)

          p = Path("src/integrations/supabase/types.ts")
          s = p.read_text()
          marker = "      user_data: {\n"
          if "      user_backups: {\n" not in s:
              block = (
                  "      user_backups: {\n"
                  "        Row: {\n"
                  "          created_at: string\n"
                  "          data: Json\n"
                  "          id: string\n"
                  "          schema_version: number\n"
                  "          user_id: string\n"
                  "        }\n"
                  "        Insert: {\n"
                  "          created_at?: string\n"
                  "          data: Json\n"
                  "          id?: string\n"
                  "          schema_version?: number\n"
                  "          user_id: string\n"
                  "        }\n"
                  "        Update: {\n"
                  "          created_at?: string\n"
                  "          data?: Json\n"
                  "          id?: string\n"
                  "          schema_version?: number\n"
                  "          user_id?: string\n"
                  "        }\n"
                  "        Relationships: []\n"
                  "      }\n"
              )
              if s.count(marker) != 1:
                  raise SystemExit("user_data table marker missing or duplicated")
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          p = Path("src/lib/cloudSync.ts")
          s = p.read_text()
          count = s.count("(supabase as any)")
          if count != 3:
              raise SystemExit(f"expected 3 cloudSync any casts, found {count}")
          s = s.replace("(supabase as any)", "supabase")
          p.write_text(s)

          p = Path("eslint.config.js")
          s = p.read_text()
          s = replace_once(s, '"@typescript-eslint/no-explicit-any": "warn",', '"@typescript-eslint/no-explicit-any": "error",', "no-explicit-any rule")
          s = replace_once(s, '"react-hooks/rules-of-hooks": "warn",', '"react-hooks/rules-of-hooks": "error",', "rules-of-hooks rule")
          p.write_text(s)
          PY
      - name: Commit source hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/icons/BixboIcons.tsx src/components/icons/BottomNavReferenceIcons.tsx src/integrations/supabase/types.ts src/lib/cloudSync.ts eslint.config.js
          git commit -m "Apply targeted audit source hardening"
          git push origin HEAD:code-audit-hardening-no-notes
