name: BIXBO checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply one-time publish repair
        if: ${{ hashFiles('scripts/fix-publish-painwizard-marker.py') != '' }}
        run: python3 scripts/fix-publish-painwizard-marker.py
      - name: Repository security hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment file(s) are forbidden:"
            echo "$tracked_env"
            exit 1
          fi
          if git grep -nE 'VITE_[A-Z0-9_]*(SECRET|PRIVATE_KEY|SERVICE_ROLE)' -- ':!*.example' ':!.github/workflows/ci.yml'; then
            echo "Potential server secret exposed through a client VITE_ variable."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Persist verified one-time repair
        if: ${{ hashFiles('scripts/fix-publish-painwizard-marker.py') != '' }}
        run: |
          git checkout HEAD^ -- .github/workflows/ci.yml
          rm -f scripts/fix-publish-painwizard-marker.py
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/LogSheet.tsx .github/workflows/ci.yml scripts/fix-publish-painwizard-marker.py
          git diff --cached --check
          git commit -m "fix: unblock publish without changing restored logs"
          git push origin HEAD:main
