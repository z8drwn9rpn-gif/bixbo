name: BIXBO checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bixbo-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Repository security hygiene
        id: security
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment file(s) are forbidden:"
            echo "$tracked_env"
            exit 1
          fi
          # Server-side code may reference secret environment variable NAMES; that is expected.
          # What must never exist is a client-exposed VITE secret/private key variable.
          if git grep -nE 'VITE_[A-Z0-9_]*(SECRET|PRIVATE_KEY|SERVICE_ROLE)' -- ':!*.example' ':!.github/workflows/ci.yml'; then
            echo "Potential server secret exposed through a client VITE_ variable."
            exit 1
          fi
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Architecture guard
        id: architecture
        run: bun run architecture
      - name: Lovable independence guard
        id: independence
        run: bun run audit:independence
      - name: English-source UI guard
        id: i18n
        run: bun run audit:i18n
      - name: Full-project UI emoji audit
        id: emoji
        run: bun run audit:ui-emoji
      - name: Typecheck
        id: typecheck
        run: bun run typecheck
      - name: Lint
        id: lint
        run: bun run lint
      - name: Unit and regression tests
        id: tests
        run: bun run test
      - name: Build
        id: build
        run: bun run build
      - name: Client bundle budget
        id: bundle
        run: bun run bundle:check
      - name: Smoke built app
        id: ssr_smoke
        run: timeout 75s bun run smoke:ssr
      - name: Install Chromium and WebKit
        id: browsers
        run: bunx playwright install --with-deps chromium webkit

      # Keep each browser isolated behind a fresh Wrangler process, but do not
      # stop at the first browser failure. The final gate fails after all three
      # outcomes are known so one regression cannot hide another platform.
      - name: Browser E2E — Chromium desktop
        id: e2e_desktop
        continue-on-error: true
        run: bunx playwright test --project=desktop
      - name: Upload Chromium desktop evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bixbo-e2e-desktop-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Browser E2E — Chromium mobile
        id: e2e_mobile
        continue-on-error: true
        run: bunx playwright test --project=mobile
      - name: Upload Chromium mobile evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bixbo-e2e-mobile-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Browser E2E — WebKit
        id: e2e_webkit
        continue-on-error: true
        run: bunx playwright test --project=webkit-mobile
      - name: Upload WebKit evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bixbo-e2e-webkit-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce browser release gate
        id: browser_gate
        if: always()
        shell: bash
        env:
          DESKTOP_OUTCOME: ${{ steps.e2e_desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.e2e_mobile.outcome }}
          WEBKIT_OUTCOME: ${{ steps.e2e_webkit.outcome }}
        run: |
          set -euo pipefail
          echo "Desktop E2E: $DESKTOP_OUTCOME"
          echo "Mobile E2E: $MOBILE_OUTCOME"
          echo "WebKit E2E: $WEBKIT_OUTCOME"
          if [ "$DESKTOP_OUTCOME" != "success" ] || [ "$MOBILE_OUTCOME" != "success" ] || [ "$WEBKIT_OUTCOME" != "success" ]; then
            echo "One or more browser release gates failed. Review the uploaded screenshot/trace evidence."
            exit 1
          fi

      - name: Record quality gate status
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ARCHITECTURE_OUTCOME: ${{ steps.architecture.outcome }}
          INDEPENDENCE_OUTCOME: ${{ steps.independence.outcome }}
          I18N_OUTCOME: ${{ steps.i18n.outcome }}
          EMOJI_OUTCOME: ${{ steps.emoji.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          SSR_OUTCOME: ${{ steps.ssr_smoke.outcome }}
          DESKTOP_OUTCOME: ${{ steps.e2e_desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.e2e_mobile.outcome }}
          WEBKIT_OUTCOME: ${{ steps.e2e_webkit.outcome }}
          BROWSER_GATE_OUTCOME: ${{ steps.browser_gate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bixbo-quality-status.md <<EOF
          Automated BIXBO quality gate status.

          **Commit:** \`${GITHUB_SHA}\`
          **Job:** ${JOB_STATUS}
          **Run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          | Gate | Outcome |
          |---|---|
          | Security hygiene | ${SECURITY_OUTCOME:-not-run} |
          | Install | ${INSTALL_OUTCOME:-not-run} |
          | Architecture | ${ARCHITECTURE_OUTCOME:-not-run} |
          | Independence | ${INDEPENDENCE_OUTCOME:-not-run} |
          | i18n | ${I18N_OUTCOME:-not-run} |
          | UI emoji audit | ${EMOJI_OUTCOME:-not-run} |
          | Typecheck | ${TYPECHECK_OUTCOME:-not-run} |
          | Lint | ${LINT_OUTCOME:-not-run} |
          | Unit/regression | ${TESTS_OUTCOME:-not-run} |
          | Build | ${BUILD_OUTCOME:-not-run} |
          | Bundle budget | ${BUNDLE_OUTCOME:-not-run} |
          | SSR smoke | ${SSR_OUTCOME:-not-run} |
          | Chromium desktop | ${DESKTOP_OUTCOME:-not-run} |
          | Chromium mobile | ${MOBILE_OUTCOME:-not-run} |
          | WebKit mobile | ${WEBKIT_OUTCOME:-not-run} |
          | Browser release gate | ${BROWSER_GATE_OUTCOME:-not-run} |
          EOF

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/241" --raw-field body="$(cat /tmp/bixbo-quality-status.md)" >/dev/null
