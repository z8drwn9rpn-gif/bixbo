name: BIXBO checks

on:
  push:
    branches: [main, fix/yearly-pdf-monthly-aggregation]
  pull_request:

permissions:
  contents: write

concurrency:
  group: bixbo-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply yearly PDF monthly patch
        if: github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/fix/yearly-pdf-monthly-aggregation' || github.head_ref == 'fix/yearly-pdf-monthly-aggregation')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-yearly-pdf-monthly.mjs')
          text = path.read_text()
          old = "expect(page).toContain('preset === \"365\" ? `${longDate(start, locale)} – ${longDate(end, locale)} · 12-month report`');"
          new = "expect(page).toContain('12-month report');"
          if old not in text:
              raise SystemExit('yearly test target not found')
          path.write_text(text.replace(old, new))
          PY
          node scripts/apply-yearly-pdf-monthly.mjs
          rm -f scripts/apply-yearly-pdf-monthly.mjs .github/workflows/apply-yearly-pdf-monthly.yml
          git checkout 29d443648d2cfee30d61b31f0c3cbd643571f31d -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make yearly health report month-based"
          git push
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Repository security hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment file(s) are forbidden:"
            echo "$tracked_env"
            exit 1
          fi
          # Server-side code may reference secret environment variable NAMES; that is expected.
          # What must never exist is a client-exposed VITE secret/private key variable.
          if git grep -nE 'VITE_[A-Z0-9_]*(SECRET|PRIVATE_KEY|SERVICE_ROLE)' -- ':!*.example' ':!.github/workflows/ci.yml'; then
            echo "Potential server secret exposed through a client VITE_ variable."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Architecture guard
        run: bun run architecture
      - name: Lovable independence guard
        run: bun run audit:independence
      - name: English-source UI guard
        run: bun run audit:i18n
      - name: Full-project UI emoji audit
        run: bun run audit:ui-emoji
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit and regression tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Client bundle budget
        run: bun run bundle:check
      - name: Smoke built app
        run: timeout 75s bun run smoke:ssr
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      # Run each Playwright project in its own process. Each invocation therefore gets
      # a fresh Wrangler webServer instead of keeping one dev server alive across the
      # full desktop + mobile suite. This prevents a dead server from cascading into
      # dozens of misleading ERR_CONNECTION_REFUSED failures in the next project.
      - name: Browser E2E — Chromium desktop
        run: bunx playwright test --project=desktop
      - name: Browser E2E — Chromium mobile
        run: bunx playwright test --project=mobile
      - name: Browser E2E — WebKit
        run: bunx playwright test --project=webkit-mobile