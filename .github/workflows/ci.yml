name: BIXBO checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply one-time log field reorder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/LogSheet.tsx')
          s = p.read_text()
          rs = '      <Field label="Reaction?" schemaFieldId="reaction">'
          fs = '      <Field label="How do I feel after food?" schemaFieldId="feelings">'
          als = '      <Field label="Allergens in this meal" schemaFieldId="allergens">'
          ins = '      <RegistryFieldBlock fieldId="intake">'
          r0 = s.find(rs); r1 = s.find(fs, r0)
          a0 = s.find(als); a1 = s.find(ins, a0)
          if min(r0, r1, a0, a1) < 0:
              raise SystemExit('Food anchors not found')
          reaction = s[r0:r1]
          s = s[:r0] + s[r1:]
          a0 = s.find(als); a1 = s.find(ins, a0)
          s = s[:a1] + reaction + s[a1:]
          cycle = s.find('Cycle prediction is based on your last period and cycle length')
          delete = s.find('Delete Blueberry entry', cycle)
          sex = s.find('/* ------------------- ŠukŠuk (Sex) ------------------- */', delete)
          if not (cycle >= 0 and delete > cycle and sex > delete):
              raise SystemExit('Blueberry Cycle/Delete order check failed')
          p.write_text(s)
      - name: Repository security hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment file(s) are forbidden:"
            echo "$tracked_env"
            exit 1
          fi
          if git grep -nE 'VITE_[A-Z0-9_]*(SECRET|PRIVATE_KEY|SERVICE_ROLE)' -- ':!*.example' ':!.github/workflows/ci.yml'; then
            echo "Potential server secret exposed through a client VITE_ variable."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Persist verified one-time reorder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- .github/workflows/ci.yml
          git add src/components/LogSheet.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: reorder Blueberry and Food fields"
          git push origin HEAD:main
