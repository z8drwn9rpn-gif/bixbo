name: BIXBO checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bixbo-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Repository security hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment file(s) are forbidden:"
            echo "$tracked_env"
            exit 1
          fi
          # Server-side code may reference secret environment variable NAMES; that is expected.
          # What must never exist is a client-exposed VITE secret/private key variable.
          if git grep -nE 'VITE_[A-Z0-9_]*(SECRET|PRIVATE_KEY|SERVICE_ROLE)' -- ':!*.example' ':!.github/workflows/ci.yml'; then
            echo "Potential server secret exposed through a client VITE_ variable."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Architecture guard
        run: bun run architecture
      - name: Lovable independence guard
        run: bun run audit:independence
      - name: English-source UI guard
        run: bun run audit:i18n
      - name: Full-project UI emoji audit
        run: bun run audit:ui-emoji
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit and regression tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Client bundle budget
        run: bun run bundle:check
      - name: Smoke built app
        run: timeout 75s bun run smoke:ssr
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit

      # Keep each browser isolated behind a fresh Wrangler process, but do not
      # stop at the first browser failure. The final gate fails after all three
      # outcomes are known so one regression cannot hide another platform.
      - name: Browser E2E — Chromium desktop
        id: e2e_desktop
        continue-on-error: true
        run: bunx playwright test --project=desktop
      - name: Upload Chromium desktop evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bixbo-e2e-desktop-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Browser E2E — Chromium mobile
        id: e2e_mobile
        continue-on-error: true
        run: bunx playwright test --project=mobile
      - name: Upload Chromium mobile evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bixbo-e2e-mobile-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Browser E2E — WebKit
        id: e2e_webkit
        continue-on-error: true
        run: bunx playwright test --project=webkit-mobile
      - name: Upload WebKit evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bixbo-e2e-webkit-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce browser release gate
        if: always()
        shell: bash
        env:
          DESKTOP_OUTCOME: ${{ steps.e2e_desktop.outcome }}
          MOBILE_OUTCOME: ${{ steps.e2e_mobile.outcome }}
          WEBKIT_OUTCOME: ${{ steps.e2e_webkit.outcome }}
        run: |
          set -euo pipefail
          echo "Desktop E2E: $DESKTOP_OUTCOME"
          echo "Mobile E2E: $MOBILE_OUTCOME"
          echo "WebKit E2E: $WEBKIT_OUTCOME"
          if [ "$DESKTOP_OUTCOME" != "success" ] || [ "$MOBILE_OUTCOME" != "success" ] || [ "$WEBKIT_OUTCOME" != "success" ]; then
            echo "One or more browser release gates failed. Review the uploaded screenshot/trace evidence."
            exit 1
          fi
