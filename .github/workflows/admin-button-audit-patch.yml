name: Apply admin button audit patch
on:
  push:
    branches:
      - agent/admin-button-audit-fixes
    paths:
      - scripts/admin_button_audit_patch.py
      - scripts/admin_button_audit_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-button-audit-fixes
      - name: Normalize multiline import for deterministic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/UniversalAdminPageEditor.tsx')
          s = p.read_text()
          old = '''import {
            ADMIN_MODE_CHANGED,
            isGlobalAdminModeActive,
          } from "@/components/GlobalAdminModeController";'''
          compact = 'import { ADMIN_MODE_CHANGED, isGlobalAdminModeActive } from "@/components/GlobalAdminModeController";'
          if old not in s:
              raise SystemExit('Universal admin mode import shape changed')
          p.write_text(s.replace(old, compact, 1))
          PY
      - name: Apply patch
        run: python3 scripts/admin_button_audit_patch.py
      - name: Remove temporary patch files
        run: rm -f scripts/admin_button_audit_patch.py scripts/admin_button_audit_trigger.txt .github/workflows/admin-button-audit-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix admin button wiring and reorder controls"
          git push origin HEAD:agent/admin-button-audit-fixes
