name: Restore radial Log once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-radial-log.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Restore only the previous radial Log menu
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          log_path = Path("src/features/logging/LogSheetRoot.tsx")
          test_path = Path("src/lib/__tests__/ui-layout-architecture-regression.test.ts")

          current = log_path.read_text()
          old = subprocess.check_output(
              ["git", "show", "ea21288c2a83db08874859aa84e2a72ae74f8dc4:src/features/logging/LogSheetRoot.tsx"],
              text=True,
          )

          branch_start = '        {!active ? (\n'
          active_branch = '        ) : (\n          <div className="flex h-full min-h-0 flex-col">'

          current_start = current.index(branch_start)
          current_end = current.index(active_branch, current_start)
          old_start = old.index(branch_start)
          old_end = old.index(active_branch, old_start)

          radial_branch = old[old_start:old_end]
          radial_container = '<div className="pointer-events-none absolute inset-0 z-10 overflow-hidden">'
          radial_branch = radial_branch.replace(
              radial_container,
              '<div data-bixbo-log-menu className="pointer-events-none absolute inset-0 z-10 overflow-hidden">',
              1,
          )

          patched = current[:current_start] + radial_branch + current[current_end:]
          log_path.write_text(patched)

          test = test_path.read_text()
          old_guard = '    expect(log).not.toContain("radiusX");'
          new_guard = '    expect(log).toContain("radiusX");'
          if old_guard not in test:
              raise RuntimeError("Expected Log architecture guard was not found")
          test_path.write_text(test.replace(old_guard, new_guard, 1))

          if 'data-bixbo-log-menu' not in patched or 'const radiusX = 112;' not in patched:
              raise RuntimeError("Radial Log restoration verification failed")

      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-radial-log.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/logging/LogSheetRoot.tsx src/lib/__tests__/ui-layout-architecture-regression.test.ts .github/workflows/restore-radial-log.yml
          git commit -m "Restore previous radial Log menu"
          git push origin HEAD:main
