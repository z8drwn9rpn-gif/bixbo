name: Remove workout trigger symptoms once
on:
  push:
    branches: [agent/remove-workout-trigger-symptoms]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-workout-trigger-symptoms
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch workout form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/features/logging/MedsWorkoutForms.tsx')
          s=p.read_text()
          s=s.replace('  const [trigger, setTrigger] = useState<WorkoutEntry["triggeredSymptom"]>(initialEntry?.triggeredSymptom);\n','')
          old='''  const log = data.dayLogs[date];\n  const symptomOptions = [\n    ...(log?.tetany ?? []).map((t) => ({\n      type: "tetany" as const,\n      id: t.id,\n      label: `${t.time} tetany ${t.intensity}/5`,\n    })),\n    ...(log?.pain ?? []).map((p) => ({ type: "pain" as const, id: p.id, label: `${p.time} pain ${p.score}/10` })),\n  ];\n\n'''
          s=s.replace(old,'')
          s=s.replace('      triggeredSymptom: trigger,','      triggeredSymptom: initialEntry?.triggeredSymptom,')
          block='''      <Field label="Triggered a symptom? (optional)" schemaFieldId="triggeredSymptom">\n        {symptomOptions.length === 0 ? (\n          <p className="text-[11px] text-muted-foreground">{t("No tetany or pain entries logged for this day yet.")}</p>\n        ) : (\n          <div className="mt-1 flex flex-wrap gap-2">\n            <Chip active={!trigger} onClick={() => setTrigger(undefined)}>\n              No\n            </Chip>\n            {symptomOptions.map((o) => (\n              <Chip\n                key={o.id}\n                active={trigger?.id === o.id}\n                onClick={() =>\n                  setTrigger(trigger?.id === o.id ? undefined : { type: o.type, id: o.id, label: o.label })\n                }\n              >\n                {o.label}\n              </Chip>\n            ))}\n          </div>\n        )}\n      </Field>\n\n'''
          s=s.replace(block,'')
          if 'Triggered a symptom? (optional)' in s or 'symptomOptions' in s or 'setTrigger' in s:
            raise SystemExit('trigger symptom UI/code still present')
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test || true
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "z8drwn9rpn-gif"
          git config user.email "z8drwn9rpn@privaterelay.appleid.com"
          git add src/features/logging/MedsWorkoutForms.tsx
          git diff --cached --quiet || git commit -m "fix: remove workout trigger symptoms field"
          git push origin HEAD:agent/remove-workout-trigger-symptoms
