name: Fix urinary-only after log rollback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Trigger urinary-only rollback repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch urinary-only flow
        run: python3 scripts/fix_urinary_only_after_log_rollback.py
      - name: Validate
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: Commit fix
        run: |
          rm -f scripts/fix_urinary_only_after_log_rollback.py .github/workflows/fix-urinary-only-after-log-rollback.yml .bixbo-trigger-urinary-only-repair
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: allow urinary-only logging without bowel entry"
          git push origin HEAD:main
