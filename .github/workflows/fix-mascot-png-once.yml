name: Fix mascot PNG once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mascot-png-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode mascot into real PNG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          path = Path('public/bixbo-mascot.png')
          raw = path.read_text(encoding='utf-8', errors='strict')
          compact = re.sub(r'\s+', '', raw)
          compact += '=' * ((4 - len(compact) % 4) % 4)
          decoded = base64.b64decode(compact, validate=False)
          if not decoded.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Decoded mascot does not have PNG signature')
          path.write_bytes(decoded)
          print('PNG signature OK, bytes:', len(decoded))
          PY
          file public/bixbo-mascot.png

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-mascot-png-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bixbo-mascot.png .github/workflows/fix-mascot-png-once.yml
          git commit -m "fix: restore mascot as real PNG"
          git push origin HEAD:main
