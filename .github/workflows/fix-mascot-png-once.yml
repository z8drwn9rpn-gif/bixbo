name: Fix mascot PNG once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mascot-png-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode mascot into real PNG
        shell: bash
        run: |
          cp public/bixbo-mascot.png /tmp/mascot.b64
          base64 --decode /tmp/mascot.b64 > public/bixbo-mascot.png
          file public/bixbo-mascot.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/bixbo-mascot.png').read_bytes()
          assert p.startswith(b'\x89PNG\r\n\x1a\n'), 'Mascot is not a valid PNG after decode'
          print('PNG signature OK, bytes:', len(p))
          PY

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-mascot-png-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bixbo-mascot.png .github/workflows/fix-mascot-png-once.yml
          git commit -m "fix: restore mascot as real PNG"
          git push origin HEAD:main
