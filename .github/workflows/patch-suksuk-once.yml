name: Patch SukSuk once

on:
  push:
    paths:
      - '.github/workflows/patch-suksuk-once.yml'
      - 'scripts/patch_suksuk_overview.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply SukSuk patch
        run: python scripts/patch_suksuk_overview.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/logging/CycleForms.tsx src/components/home/DayOverview.tsx
          git commit -m 'Fix SukSuk overview and blank new-entry state'
          git push
