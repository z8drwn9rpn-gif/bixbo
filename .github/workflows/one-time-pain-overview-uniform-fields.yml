name: One-time Pain overview uniform fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Pain overview uniform fields patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply focused UI patch
        run: python3 scripts/patch-pain-overview-uniform-fields.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun test src/lib/__tests__/pain-symptom-update-regression.test.ts
      - name: Commit
        run: |
          rm -f scripts/patch-pain-overview-uniform-fields.py .github/workflows/one-time-pain-overview-uniform-fields.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align Pain overview fields with Nausea styling"
          git push origin HEAD:main
