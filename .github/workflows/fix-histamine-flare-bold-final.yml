name: Fix Histamine flare bold final

on:
  push:
    branches:
      - fix/histamine-flare-bold-final

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[histamine-bold-final-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/histamine-flare-bold-final
          fetch-depth: 0

      - name: Patch Histamine flare spans so global typography cannot reset weight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/components/home/DayOverview.tsx")
          text = p.read_text()
          old = '''                  {f.histamineFlare ? (\n                    <p\n                      className="mt-px text-xs leading-relaxed text-destructive"\n                      style={{ color: "var(--destructive)", fontWeight: 700 }}\n                    >\n                      <span className="inline-flex items-center gap-1 align-middle">\n                        <Ico e="🔥" size={13} />\n                        <span>{t("Histamine flare")}:</span>\n                      </span>{" "}\n                      <span>{f.histamineSymptoms?.length ? f.histamineSymptoms.join(", ") : t("Yes")}</span>\n                    </p>\n                  ) : null}'''
          new = '''                  {f.histamineFlare ? (\n                    <p\n                      className="mt-px text-xs leading-relaxed text-destructive"\n                      style={{ color: "var(--destructive)", fontWeight: 700 }}\n                    >\n                      <span\n                        className="inline-flex items-center gap-1 align-middle"\n                        style={{ color: "var(--destructive)", fontWeight: 700 }}\n                      >\n                        <Ico e="🔥" size={13} />\n                        {t("Histamine flare")}:\n                      </span>{" "}\n                      <span style={{ color: "var(--destructive)", fontWeight: 700 }}>\n                        {f.histamineSymptoms?.length ? f.histamineSymptoms.join(", ") : t("Yes")}\n                      </span>\n                    </p>\n                  ) : null}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Histamine flare block, found {count}")
          p.write_text(text.replace(old, new, 1))
          Path(".github/workflows/fix-histamine-flare-bold-final.yml").unlink()
          PY

          git config user.name "bixbo-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx .github/workflows/fix-histamine-flare-bold-final.yml
          git commit -m "Force Histamine flare text bold on every span [histamine-bold-final-applied]"
          git push origin HEAD:fix/histamine-flare-bold-final
