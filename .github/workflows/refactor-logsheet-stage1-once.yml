name: Refactor LogSheet stage 1 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refactor-logsheet-stage1-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract LogSheet translation and category modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/LogSheet.tsx')
          src = path.read_text()
          out_dir = Path('src/features/logging')
          out_dir.mkdir(parents=True, exist_ok=True)

          tr_start = src.index('\nfunction TrText(')
          tr_end = src.index('\ntype UpdateFn', tr_start)
          tr_body = src[tr_start + 1:tr_end].rstrip()
          tr_body = tr_body.replace('function TrText(', 'export function TrText(', 1)
          (out_dir / 'TrText.tsx').write_text(
              'import { useI18n } from "@/hooks/useI18n";\n\n' + tr_body + '\n'
          )
          src = src[:tr_start] + '\n' + src[tr_end:]

          cat_start = src.index('\ntype Category =')
          cat_end = src.index('\nexport function LogSheet', cat_start)
          cat_body = src[cat_start + 1:cat_end].rstrip()
          cat_body = cat_body.replace('type Category =', 'export type Category =', 1)
          cat_body = cat_body.replace('const CATEGORIES:', 'export const CATEGORIES:', 1)
          (out_dir / 'logCategories.ts').write_text(cat_body + '\n')
          src = src[:cat_start] + '\n' + src[cat_end:]

          anchor = 'import { useI18n } from "@/hooks/useI18n";\n'
          if anchor not in src:
              raise SystemExit('useI18n import anchor missing')
          src = src.replace(
              anchor,
              anchor
              + 'import { TrText } from "@/features/logging/TrText";\n'
              + 'import { CATEGORIES, type Category } from "@/features/logging/logCategories";\n',
              1,
          )

          path.write_text(src)
          PY

      - name: Verify typecheck before commit
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Commit refactor
        run: |
          rm -f .github/workflows/refactor-logsheet-stage1-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LogSheet.tsx src/features/logging/TrText.tsx src/features/logging/logCategories.ts .github/workflows/refactor-logsheet-stage1-once.yml
          git commit -m "refactor: extract LogSheet translation and categories"
          git push origin HEAD:main
