name: Audit LogSheet i18n
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/audit-logsheet-i18n.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Find visible LogSheet and scale strings missing from Slovak dictionary
        run: |
          cat > audit-logsheet.cjs <<'JS'
          const ts=require('typescript'); const fs=require('fs');
          const i18n=fs.readFileSync('src/lib/i18n.ts','utf8');
          const skStart=i18n.indexOf('const SK'); const skText=skStart>=0?i18n.slice(skStart):i18n;
          const keys=new Set(); for(const m of skText.matchAll(/^\s*["']([^"']+)["']\s*:/gm)) keys.add(m[1]);
          const candidates=new Set(); function add(s){s=s.trim().replace(/\s+/g,' '); if(/[A-Za-z]/.test(s)&&s.length>1)candidates.add(s)}
          function scan(path){
            const sf=ts.createSourceFile(path,fs.readFileSync(path,'utf8'),ts.ScriptTarget.Latest,true,path.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            const attrNames=new Set(['label','placeholder','title','aria-label','legendTitle','hint']);
            const arrayNames=/(_DEFAULT|_TYPES|_TRIGGERS|_SYMPTOMS|_HELPED|_LOCATIONS|_QUALITY|_MOODS|_LEVELS|_OPTIONS|_FEELINGS)$/;
            function walk(n){
              if(ts.isJsxText(n)) add(n.getText(sf));
              if(ts.isJsxAttribute(n)&&attrNames.has(n.name.getText(sf))&&n.initializer&&ts.isStringLiteral(n.initializer)) add(n.initializer.text);
              if(ts.isPropertyAssignment(n)&&ts.isIdentifier(n.name)&&['label','hint'].includes(n.name.text)&&ts.isStringLiteralLike(n.initializer)) add(n.initializer.text);
              if(ts.isVariableDeclaration(n)&&ts.isIdentifier(n.name)&&arrayNames.test(n.name.text)&&n.initializer&&ts.isArrayLiteralExpression(n.initializer)) for(const e of n.initializer.elements) if(ts.isStringLiteralLike(e)) add(e.text);
              if(ts.isPropertyAssignment(n)&&ts.isStringLiteralLike(n.initializer)){
                let p=n.parent; while(p&&!ts.isVariableDeclaration(p)) p=p.parent;
                if(p&&ts.isVariableDeclaration(p)&&ts.isIdentifier(p.name)&&/(DESC|DESCRIPTION|PAIN_DESCRIPTIONS)/.test(p.name.text)) add(n.initializer.text);
              }
              ts.forEachChild(n,walk);
            } walk(sf);
          }
          scan('src/components/LogSheet.tsx'); scan('src/lib/scaleDescriptions.ts'); scan('src/lib/storage.ts');
          const missing=[...candidates].filter(x=>!keys.has(x)).sort((a,b)=>a.localeCompare(b));
          console.log('VISIBLE_CANDIDATES',candidates.size); console.log('MISSING_SK',missing.length);
          for(const x of missing) console.log('MISSING:',JSON.stringify(x));
          JS
          node audit-logsheet.cjs
# final audit
