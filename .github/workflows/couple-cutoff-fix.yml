# corrected comparison window retry
name: Couple cutoff fix
on:
  push:
    paths:
      - '.github/workflows/couple-cutoff-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply Couple cutoff fix
        run: python3 .github/scripts/couple_cutoff_fix.py
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/couple.tsx src/lib/i18n.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix Couple comparison start date window"
          git push
