name: Unify log design once
on:
  push:
    branches: [agent/unify-log-design-pain-style]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-log-design-pain-style
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch unified log design
        run: python .github/scripts/unify_log_design.py
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test || true
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "z8drwn9rpn-gif"
          git config user.email "z8drwn9rpn@privaterelay.appleid.com"
          git add src/features/logging/LogSheetRoot.tsx src/styles.css
          git diff --cached --quiet || git commit -m "style: unify logs with Pain design system"
          git push origin HEAD:agent/unify-log-design-pain-style
