name: Apply stable admin source links
on:
  push:
    branches: [agent/stable-admin-field-source-links]
    paths:
      - '.github/scripts/apply_stable_admin_source_links.py'
      - '.github/workflows/apply-stable-admin-source-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stable-admin-field-source-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_stable_admin_source_links.py
      - run: rm .github/scripts/apply_stable_admin_source_links.py .github/workflows/apply-stable-admin-source-links.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'link admin fields to stable core entry ids'
          git push origin HEAD:agent/stable-admin-field-source-links
