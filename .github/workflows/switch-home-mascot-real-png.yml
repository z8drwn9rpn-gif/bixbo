name: Switch Home mascot to real PNG

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/switch-home-mascot-real-png.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point Home to real PNG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/features/home/HomePage.tsx')
          s = p.read_text()
          s, n = re.subn(
              r'const HOME_MASCOT_DATA_URI = "data:image/png;base64,[^"]+";',
              'const HOME_MASCOT_DATA_URI = "/bixbo-mascot-user.png?v=20260813-real";',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'expected one Home mascot constant, replaced {n}')
          p.write_text(s)
          PY

      - name: Verify build
        run: |
          npm install
          npm run build

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/switch-home-mascot-real-png.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.tsx .github/workflows/switch-home-mascot-real-png.yml
          git commit -m "fix: use real BIXBO mascot PNG on Home"
          git pull --rebase origin main
          git push origin HEAD:main
