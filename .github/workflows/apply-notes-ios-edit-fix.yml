name: Apply Notes iOS edit fix
on:
  push:
    branches: [agent/fix-notes-ios-editing]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-notes-ios-editing
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply exact patch
        run: python scripts/apply_notes_ios_edit_fix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified patch
        run: |
          rm scripts/apply_notes_ios_edit_fix.py
          rm .github/workflows/apply-notes-ios-edit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Notes typing on iOS" || exit 0
          git push
