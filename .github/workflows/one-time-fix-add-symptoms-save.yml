name: One-time Add symptoms save-label fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time Add symptoms save-label fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          log = Path('src/components/LogSheet.tsx')
          s = log.read_text()
          old = '<span>{t("Save update")}</span>'
          new = '<span>{t("Save symptoms")}</span>'
          if old not in s:
              raise SystemExit('Save update label not found')
          s = s.replace(old, new, 1)
          # Clear source id when leaving quick mode; additive state cleanup only.
          old_cancel = 'setQuickSymptomUpdate(false);\n              setCopiedFromTime(undefined);\n              setStep(0);'
          new_cancel = 'setQuickSymptomUpdate(false);\n              setCopiedFromTime(undefined);\n              setCopiedFromId(undefined);\n              setStep(0);'
          if old_cancel in s:
              s = s.replace(old_cancel, new_cancel, 1)
          log.write_text(s)

          test = Path('src/lib/__tests__/pain-symptom-update-regression.test.ts')
          t = test.read_text()
          old_test = "expect(sheet).toContain('Save symptoms ✓');"
          new_test = "expect(sheet).toContain('t(\"Save symptoms\")');"
          if old_test not in t:
              raise SystemExit('Old regression expectation not found')
          test.write_text(t.replace(old_test, new_test, 1))

          Path('.github/workflows/one-time-fix-add-symptoms-save.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Add symptoms quick-save behavior"
          git push origin HEAD:main
