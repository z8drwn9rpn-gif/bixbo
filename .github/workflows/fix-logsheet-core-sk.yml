name: Fix LogSheet core Slovak
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-logsheet-core-sk.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply core translations
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('src/lib/i18n.ts')
          s=p.read_text()
          marker='  "Pain still feels the same?": "Bolesť je stále rovnaká?",'
          if marker not in s:
              raise RuntimeError('marker missing')
          entries={
            'Next':'Ďalej','Level':'Úroveň','Last log:':'Posledný záznam:','· pain':'· bolesť',
            '/10. Reuse it and add only the new symptoms.':'/10. Použi ho znova a pridaj iba nové príznaky.',
            'Same pain — add symptoms':'Rovnaká bolesť — pridať príznaky','Quick symptom update':'Rýchla aktualizácia príznakov',
            'New entry ·':'Nový záznam ·','/10 copied from':'/10 skopírované z','the latest log':'najnovšieho záznamu',
            'This saves a new entry at':'Uloží sa nový záznam o','; the older log stays unchanged. Add or adjust the symptoms below.':'; starší záznam zostane nezmenený. Nižšie pridaj alebo uprav príznaky.',
            'Where does it hurt?':'Kde to bolí?','How does it hurt?':'Aká je bolesť?','Other symptoms':'Ďalšie príznaky',
            'Associated symptoms':'Sprievodné príznaky','Triggers':'Spúšťače','Pain scale (Mankosky)':'Stupnica bolesti (Mankosky)',
            'Pain free':'Bez bolesti','Very minor annoyance':'Veľmi malá nepríjemnosť','Minor annoyance':'Menšia nepríjemnosť',
            'Annoying, distracting':'Nepríjemná, rušivá','Bearable if involved in work':'Znesiteľná pri sústredení na činnosť',
            "Can't be ignored for long":'Nedá sa dlho ignorovať',"Can't be ignored > 30 min":'Nedá sa ignorovať dlhšie ako 30 min',
            'Physical activity limited':'Obmedzená fyzická aktivita','Unable to speak, crying out':'Neschopnosť hovoriť, výkriky',
            'Unconscious — passes out':'Bezvedomie — odpadnutie','Pain (0–10)':'Bolesť (0–10)',
            'Mild — barely noticeable, no need for meds':'Mierna — sotva badateľná, bez potreby liekov',
            'Light — slight pressure, easy to ignore':'Ľahká — mierny tlak, ľahko sa ignoruje',
            'Noticeable — distracting but functional':'Citeľná — ruší, ale dá sa fungovať',
            'Moderate low — annoying, hard to focus':'Stredne mierna — nepríjemná, ťažšie sa sústredí',
            'Moderate — clearly hurts, may take a pill':'Stredná — zreteľne bolí, možno si vezmem liek',
            'Moderate high — throbbing, want to lie down':'Stredne silná — pulzuje, chcem si ľahnúť',
            'Strong — sensitive to light/sound, hard to work':'Silná — citlivosť na svetlo/zvuk, ťažko sa pracuje',
            'Very strong — nauseous, need dark quiet room':'Veľmi silná — nevoľnosť, potrebujem tmavú tichú miestnosť',
            'Severe — cannot function, crying / vomiting':'Silná — nedá sa fungovať, plač / vracanie',
            'Worst ever — unbearable, emergency-level':'Najhoršia — neznesiteľná, urgentná úroveň',
            'Tetany intensity (1–5)':'Intenzita tetánie (1–5)','Tetany intensity scale':'Stupnica intenzity tetánie',
            'Mild — occasional twitches or tingling, barely disruptive':'Mierna — občasné zášklby alebo mravčenie, takmer neobmedzuje',
            'Noticeable — clear tingling or small cramps, still functional':'Citeľná — jasné mravčenie alebo malé kŕče, stále funkčná',
            'Moderate — cramps hurt, hard to relax the muscles':'Stredná — kŕče bolia, svaly sa ťažko uvoľňujú',
            'Strong — painful spasms, hands/feet lock up, hard to move':'Silná — bolestivé spazmy, ruky/nohy sa sťahujú, ťažko sa hýbe',
            'Severe — full-body cramps, unable to function, may need help':'Silná — kŕče celého tela, neschopnosť fungovať, môže byť potrebná pomoc',
            'Panic intensity (1–10)':'Intenzita paniky (1–10)','Panic intensity scale':'Stupnica intenzity paniky',
            'Slight unease, easy to ignore':'Mierny nepokoj, ľahko sa ignoruje','Mild anxiety, aware of heartbeat':'Mierna úzkosť, vnímam tlkot srdca',
            'Noticeable worry, faster breathing':'Citeľné obavy, rýchlejšie dýchanie','Uncomfortable, restless, want to leave':'Nepríjemné, nepokoj, potreba odísť',
            'Strong fear, racing heart, dizziness':'Silný strach, búšenie srdca, závrat','Hard to think clearly, trembling':'Ťažko sa jasne premýšľa, tras',
            'Overwhelming fear, chest pressure':'Drvivý strach, tlak na hrudi','Loss of control feeling, tingling / numbness':'Pocit straty kontroly, mravčenie / necitlivosť',
            'Terror — fear of dying or collapsing':'Hrôza — strach zo smrti alebo kolapsu','Total panic — unable to function':'Úplná panika — neschopnosť fungovať',
            'Stress (0–10)':'Stres (0–10)','Stress scale':'Stupnica stresu','None — completely calm and relaxed':'Žiadny — úplne pokojná a uvoľnená',
            'Very low — barely any tension':'Veľmi nízky — takmer žiadne napätie','Low — slight background pressure':'Nízky — mierny tlak v pozadí',
            'Mild — a little on edge':'Mierny — trochu v napätí','Moderate low — noticeable but manageable':'Stredne nízky — citeľný, ale zvládnuteľný',
            'Moderate — clearly stressed, still coping':'Stredný — jasný stres, stále zvládnuteľný','Moderate high — tense, harder to focus':'Stredne vysoký — napätie, horšie sústredenie',
            'High — irritable, body feels tight':'Vysoký — podráždenosť, telo je napäté','Very high — overwhelmed, hard to relax':'Veľmi vysoký — zahltenie, ťažko sa uvoľňuje',
            'Severe — near breaking point':'Silný — blízko bodu zlomu','Extreme — cannot cope, shutdown / panic':'Extrémny — nedá sa zvládnuť, vypnutie / panika',
            'Hot flashes (1–5)':'Návaly tepla (1–5)','Mild warmth — barely noticeable, no sweat':'Mierne teplo — sotva badateľné, bez potenia',
            'Warm flush — face/neck feels hot, no visible sweat':'Teplý nával — tvár/krk sú horúce, bez viditeľného potu',
            'Sweating — visible perspiration, need air/fan':'Potenie — viditeľný pot, potreba vzduchu/ventilátora',
            'Strong wave — soaking sweat, heart racing':'Silná vlna — premočenie potom, búšenie srdca',
            'Drenching — clothes/bedding wet, need to change':'Premočujúci — mokré oblečenie/posteľná bielizeň, treba sa prezliecť',
            'Headache (1–10)':'Bolesť hlavy (1–10)'
          }
          block=''.join(f'  {json.dumps(k,ensure_ascii=False)}: {json.dumps(v,ensure_ascii=False)},\n' for k,v in entries.items() if f'  {json.dumps(k,ensure_ascii=False)}:' not in s)
          s=s.replace(marker,block+marker,1)
          p.write_text(s)

          p=Path('src/components/LogSheet.tsx')
          s=p.read_text()
          reps={
            '<span className="text-sm font-semibold leading-none">{step < 4 ? "Next" : "Save"}</span>':'<span className="text-sm font-semibold leading-none">{t(step < 4 ? "Next" : "Save")}</span>',
            '            Quick symptom update\n':'            {t("Quick symptom update")}\n',
            '<span className="text-xs text-muted-foreground">New entry · {time}</span>':'<span className="text-xs text-muted-foreground">{t("New entry ·")} {time}</span>',
            '                    Last log: {latestPain.time} · pain {latestPain.score}/10. Reuse it and add only the new symptoms.\n':'                    {t("Last log:")} {latestPain.time} {t("· pain")} {latestPain.score}{t("/10. Reuse it and add only the new symptoms.")}\n',
            '                Same pain — add symptoms\n':'                {t("Same pain — add symptoms")}\n',
            '          <p className="text-center font-medium">{getScaleDesc(data, "pain")[Math.round(score)]}</p>':'          <p className="text-center font-medium">{t(getScaleDesc(data, "pain")[Math.round(score)])}</p>',
            'title={`${n} — ${getScaleDesc(data, "pain")[Math.round(n)]}`}':'title={`${n} — ${t(getScaleDesc(data, "pain")[Math.round(n)])}`}',
            'title={description ? `${n} — ${description}` : String(n)}':'title={description ? `${n} — ${t(description)}` : String(n)}',
            'aria-label={description ? `${n} — ${description}` : `Intensity ${n}`}':'aria-label={description ? `${n} — ${t(description)}` : `${t("Intensity")} ${n}`}',
            '            Level {Number.isInteger(value) ? value : value.toFixed(1)}:\n':'            {t("Level")} {Number.isInteger(value) ? value : value.toFixed(1)}:\n',
            '                Pain {score}/10 copied from {copiedFromTime ?? "the latest log"}\n':'                {t("Pain")} {score}{t("/10 copied from")} {copiedFromTime ?? t("the latest log")}\n',
            '                This saves a new entry at {time}; the older log stays unchanged. Add or adjust the symptoms below.\n':'                {t("This saves a new entry at")} {time}{t("; the older log stays unchanged. Add or adjust the symptoms below.")}\n'
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s)
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-logsheet-core-sk.yml
          git add src/components/LogSheet.tsx src/lib/i18n.ts
          git commit -m "Translate LogSheet core and all symptom scales"
          git push
