name: Improve vitals once
on:
  push:
    branches:
      - agent/improve-temp-sleep-weight
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-temp-sleep-weight
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch
        run: python .github/scripts/improve_vitals.py
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/improve-vitals-once.yml
          rm .github/scripts/improve_vitals.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve temperature sleep and weight logs"
          git push origin HEAD:agent/improve-temp-sleep-weight