name: Improve vitals once
on:
  push:
    branches: [agent/improve-temp-sleep-weight]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-temp-sleep-weight
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch vitals UI and storage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/storage/types.ts')
          s=p.read_text()
          s=s.replace('export interface VitalMeasurement {\n  id: string;\n  time: string;\n  value: number;\n}', '''export interface VitalMeasurement {\n  id: string;\n  time: string;\n  value: number;\n  /** Optional context used by the richer Temperature / Weight log UI. */\n  method?: "basal" | "oral" | "other";\n  note?: string;\n  bodyFatPercent?: number;\n}''')
          s=s.replace('  sleepHours?: number;\n  sleepQuality?: string | string[];', '''  sleepHours?: number;\n  sleepQuality?: string | string[];\n  sleepBedtime?: string;\n  sleepWakeTime?: string;\n  sleepAwakenings?: number;\n  sleepEnergy?: number;\n  sleepNote?: string;''')
          p.write_text(s)

          p=Path('src/features/logging/LifestyleForms.tsx')
          s=p.read_text()
          start=s.index('export function TempForm({')
          new=r'''export function TempForm({
  date,
  data,
  update,
  onDone,
}: {
  date: string;
  data: BixboData;
  update: UpdateFn;
  onDone: () => void;
}) {
  type VitalRow = {
    id: string;
    time: string;
    value: number;
    method?: "basal" | "oral" | "other";
    note?: string;
    bodyFatPercent?: number;
  };
  type Tab = "temperature" | "sleep" | "weight";
  const cur = data.dayLogs[date] ?? {};
  const [tab, setTab] = useState<Tab>("temperature");

  const [temperature, setTemperature] = useState("");
  const [temperatureTime, setTemperatureTime] = useState(nowHHMM());
  const [temperatureUnit, setTemperatureUnit] = useState<"C" | "F">("C");
  const [temperatureMethod, setTemperatureMethod] = useState<"basal" | "oral" | "other">("basal");
  const [temperatureNote, setTemperatureNote] = useState("");

  const [weight, setWeight] = useState("");
  const [weightTime, setWeightTime] = useState(nowHHMM());
  const [bodyFat, setBodyFat] = useState("");
  const [weightNote, setWeightNote] = useState("");
  const [weightRange, setWeightRange] = useState<7 | 30 | 90>(7);

  const [bedtime, setBedtime] = useState(cur.sleepBedtime ?? "");
  const [wakeTime, setWakeTime] = useState(cur.sleepWakeTime ?? "");
  const [sleepHours, setSleepHours] = useState(cur.sleepHours != null ? String(cur.sleepHours) : "");
  const currentQuality = Array.isArray(cur.sleepQuality) ? cur.sleepQuality[0] : cur.sleepQuality;
  const [quality, setQuality] = useState(currentQuality ?? "");
  const [awakenings, setAwakenings] = useState(cur.sleepAwakenings ?? 0);
  const [sleepEnergy, setSleepEnergy] = useState(cur.sleepEnergy ?? 3);
  const [sleepNote, setSleepNote] = useState(cur.sleepNote ?? "");

  const sortVitals = (entries: VitalRow[]) => entries.slice().sort((a,b) => a.time.localeCompare(b.time) || a.id.localeCompare(b.id));
  const latestVitalValue = (entries: VitalRow[]) => entries.length ? sortVitals(entries)[entries.length - 1]?.value : undefined;
  const existingVitals = (entries: VitalRow[] | undefined, legacyValue: number | undefined, legacyId: string): VitalRow[] => {
    if (entries?.length) return sortVitals(entries);
    if (legacyValue != null && Number.isFinite(legacyValue)) return [{ id: legacyId, time: "00:00", value: legacyValue }];
    return [];
  };
  const temperatureEntries = useMemo(() => existingVitals(cur.temperatureEntries, cur.temperature, `${date}-legacy-temperature`), [cur.temperatureEntries, cur.temperature, date]);
  const weightEntries = useMemo(() => existingVitals(cur.weightEntries, cur.weight, `${date}-legacy-weight`), [cur.weightEntries, cur.weight, date]);

  const daySeries = (kind: "temperature" | "weight", days: number) => Object.entries(data.dayLogs)
    .filter(([k]) => k <= date)
    .sort(([a],[b]) => a.localeCompare(b))
    .slice(-days)
    .map(([k,log]) => {
      const entries = kind === "temperature" ? log.temperatureEntries : log.weightEntries;
      const legacy = kind === "temperature" ? log.temperature : log.weight;
      const rows = existingVitals(entries, legacy, `${k}-legacy-${kind}`);
      return rows.length ? { date:k, value: rows[rows.length - 1].value } : null;
    }).filter((x): x is {date:string; value:number} => !!x);

  const temperatureTrend = daySeries("temperature", 14);
  const weightTrend = daySeries("weight", weightRange);
  const previousWeight = daySeries("weight", 90).filter(x => x.date < date).at(-1)?.value;
  const currentWeight = weightEntries.at(-1)?.value ?? cur.weight;
  const weightDelta = currentWeight != null && previousWeight != null ? currentWeight - previousWeight : undefined;

  const minutesBetween = (start: string, end: string) => {
    if (!start || !end) return undefined;
    const [sh,sm]=start.split(":").map(Number); const [eh,em]=end.split(":").map(Number);
    let m=(eh*60+em)-(sh*60+sm); if (m<0) m+=1440; return m;
  };
  const calculatedSleepMinutes = minutesBetween(bedtime,wakeTime);
  const effectiveSleepHours = calculatedSleepMinutes != null ? calculatedSleepMinutes / 60 : Number(sleepHours.replace(",",".")) || 0;
  const qualityScores: Record<string,number> = { "Very poor":20, "Poor":40, "Okay":60, "Good":80, "Excellent":100 };
  const sleepScore = Math.max(0, Math.min(100, Math.round((qualityScores[quality] ?? 60)*0.55 + Math.min(100,(effectiveSleepHours/8)*100)*0.35 + Math.max(0,100-awakenings*12)*0.10)));
  const sleepScoreLabel = sleepScore >= 85 ? "Excellent" : sleepScore >= 70 ? "Good" : sleepScore >= 55 ? "Okay" : sleepScore >= 40 ? "Poor" : "Very poor";

  const parseValue = (v:string) => v.trim()==="" ? undefined : Number(v.replace(",","."));
  const toCelsius = (v:number) => temperatureUnit === "F" ? (v - 32) * 5 / 9 : v;

  const save = () => {
    const tv=parseValue(temperature), wv=parseValue(weight), bf=parseValue(bodyFat);
    updateDayLog(update,date,(log)=>{
      const temps=existingVitals(log.temperatureEntries,log.temperature,`${date}-legacy-temperature`);
      const weights=existingVitals(log.weightEntries,log.weight,`${date}-legacy-weight`);
      const nextTemps = tv != null && Number.isFinite(tv) ? sortVitals([...temps,{id:crypto.randomUUID(),time:temperatureTime||nowHHMM(),value:toCelsius(tv),method:temperatureMethod,note:temperatureNote.trim()||undefined}]) : temps;
      const nextWeights = wv != null && Number.isFinite(wv) ? sortVitals([...weights,{id:crypto.randomUUID(),time:weightTime||nowHHMM(),value:wv,bodyFatPercent:bf != null && Number.isFinite(bf) ? bf : undefined,note:weightNote.trim()||undefined}]) : weights;
      return {
        ...log,
        temperatureEntries: nextTemps.length ? nextTemps : undefined,
        weightEntries: nextWeights.length ? nextWeights : undefined,
        temperature: latestVitalValue(nextTemps),
        weight: latestVitalValue(nextWeights),
        sleepHours: effectiveSleepHours > 0 ? Number(effectiveSleepHours.toFixed(2)) : undefined,
        sleepQuality: quality || undefined,
        sleepBedtime: bedtime || undefined,
        sleepWakeTime: wakeTime || undefined,
        sleepAwakenings: awakenings || undefined,
        sleepEnergy: sleepEnergy || undefined,
        sleepNote: sleepNote.trim() || undefined,
      };
    });
    onDone();
  };

  const deleteTemperature=(id:string)=>updateDayLog(update,date,(log)=>{const next=existingVitals(log.temperatureEntries,log.temperature,`${date}-legacy-temperature`).filter(x=>x.id!==id); return {...log,temperatureEntries:next.length?next:undefined,temperature:latestVitalValue(next)}});
  const deleteWeight=(id:string)=>updateDayLog(update,date,(log)=>{const next=existingVitals(log.weightEntries,log.weight,`${date}-legacy-weight`).filter(x=>x.id!==id); return {...log,weightEntries:next.length?next:undefined,weight:latestVitalValue(next)}});

  const MiniTrend = ({points,unit}:{points:{date:string;value:number}[];unit:string}) => {
    if (!points.length) return <p className="py-5 text-center text-xs text-muted-foreground">No trend data yet.</p>;
    const vals=points.map(p=>p.value), min=Math.min(...vals), max=Math.max(...vals), span=Math.max(.1,max-min);
    const coords=points.map((p,i)=>`${points.length===1?50:(i/(points.length-1))*100},${36-((p.value-min)/span)*28}`).join(" ");
    return <div className="mt-3"><svg viewBox="0 0 100 40" className="h-28 w-full overflow-visible"><polyline points={coords} fill="none" stroke="currentColor" strokeWidth="1.8" className="text-primary" />{points.map((p,i)=>{const x=points.length===1?50:(i/(points.length-1))*100; const y=36-((p.value-min)/span)*28; return <circle key={p.date} cx={x} cy={y} r="1.8" fill="currentColor" className="text-primary" />})}</svg><div className="flex justify-between text-[10px] text-muted-foreground"><span>{points[0]?.date.slice(5)}</span><span>{min.toFixed(1)}–{max.toFixed(1)} {unit}</span><span>{points.at(-1)?.date.slice(5)}</span></div></div>;
  };

  return <div className="flex flex-col gap-4">
    <SaveBar onCancel={onDone} onSave={save} />
    <div className="grid grid-cols-3 rounded-2xl bg-tint p-1">
      {(["temperature","sleep","weight"] as Tab[]).map(x=><button key={x} type="button" onClick={()=>setTab(x)} className={`rounded-xl px-2 py-2 text-xs font-semibold capitalize ${tab===x?"bg-surface shadow-sm ring-1 ring-border":"text-muted-foreground"}`}>{x}</button>)}
    </div>

    {tab === "temperature" && <>
      <div className="rounded-2xl bg-tint p-3 text-xs text-muted-foreground"><span className="mr-2">💡</span>Body temperature can shift during your cycle. Track it consistently for better insights.</div>
      <Field label="Time"><Input type="time" value={temperatureTime} onChange={e=>setTemperatureTime(e.target.value)} /></Field>
      <Field label="Temperature">
        <div className="grid grid-cols-[1fr_auto] gap-2"><div className="relative"><Input inputMode="decimal" value={temperature} onChange={e=>setTemperature(e.target.value.replace(/[^0-9.,]/g,""))} placeholder={temperatureUnit==="C"?"36.68":"98.02"}/><span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-muted-foreground">°{temperatureUnit}</span></div><div className="flex rounded-full bg-tint p-1"><button type="button" onClick={()=>setTemperatureUnit("C")} className={`rounded-full px-3 py-1.5 text-xs ${temperatureUnit==="C"?"bg-primary text-primary-foreground":""}`}>°C</button><button type="button" onClick={()=>setTemperatureUnit("F")} className={`rounded-full px-3 py-1.5 text-xs ${temperatureUnit==="F"?"bg-primary text-primary-foreground":""}`}>°F</button></div></div>
      </Field>
      <Field label="Method"><div className="mt-2 grid grid-cols-3 gap-2">{([['basal','Basal (morning)'],['oral','Oral'],['other','Other']] as const).map(([v,l])=><Chip key={v} active={temperatureMethod===v} onClick={()=>setTemperatureMethod(v)}>{l}</Chip>)}</div></Field>
      <Field label="Notes (optional)"><Textarea rows={3} maxLength={200} value={temperatureNote} onChange={e=>setTemperatureNote(e.target.value)} placeholder="How did you feel when you measured?"/><p className="mt-1 text-right text-[10px] text-muted-foreground">{temperatureNote.length}/200</p></Field>
      <div className="rounded-2xl bg-surface p-3 ring-1 ring-border"><p className="text-xs font-semibold">Your recent trend</p><MiniTrend points={temperatureTrend} unit="°C" /></div>
      {temperatureEntries.length>0 && <div className="space-y-2">{temperatureEntries.map(e=><div key={e.id} className="flex items-center gap-3 rounded-2xl bg-surface px-3 py-2 ring-1 ring-border"><Ico e="🌡️" size={19}/><div className="flex-1"><p className="text-sm font-semibold">{e.value.toFixed(2)} °C</p><p className="text-xs text-muted-foreground">{e.time}{e.method?` · ${e.method}`:""}</p></div><button type="button" onClick={()=>deleteTemperature(e.id)} className="rounded-full p-2 text-muted-foreground"><X className="h-4 w-4"/></button></div>)}</div>}
      <div className="rounded-2xl bg-tint p-3 text-xs"><p className="font-semibold">💡 Tips</p><ul className="mt-2 list-disc space-y-1 pl-5 text-muted-foreground"><li>Measure at about the same time each morning.</li><li>For basal tracking, measure before getting out of bed.</li><li>Small day-to-day changes are normal.</li></ul></div>
    </>}

    {tab === "sleep" && <>
      <div className="rounded-2xl bg-surface p-4 ring-1 ring-border"><div className="flex items-center gap-4"><div className="grid h-24 w-24 shrink-0 place-items-center rounded-full border-[7px] border-primary/70"><div className="text-center"><p className="text-3xl font-serif">{sleepScore}</p><p className="text-[10px] text-muted-foreground">{sleepScoreLabel}</p></div></div><div><p className="text-sm font-semibold">Sleep score</p><p className="mt-1 text-xs text-muted-foreground">Based on duration, quality and night awakenings.</p></div></div><div className="mt-4 grid grid-cols-2 gap-2"><div className="rounded-xl bg-tint p-3"><p className="text-[10px] text-muted-foreground">Total sleep</p><p className="text-lg font-semibold">{effectiveSleepHours?`${Math.floor(effectiveSleepHours)}h ${Math.round((effectiveSleepHours%1)*60)}m`:'—'}</p></div><div className="rounded-xl bg-tint p-3"><p className="text-[10px] text-muted-foreground">Time in bed</p><p className="text-lg font-semibold">{calculatedSleepMinutes!=null?`${Math.floor(calculatedSleepMinutes/60)}h ${calculatedSleepMinutes%60}m`:'—'}</p></div></div></div>
      <Field label="Bedtime / Wake up"><div className="grid grid-cols-2 gap-2"><div><p className="mb-1 text-[10px] text-muted-foreground">Bedtime</p><Input type="time" value={bedtime} onChange={e=>setBedtime(e.target.value)}/></div><div><p className="mb-1 text-[10px] text-muted-foreground">Wake up</p><Input type="time" value={wakeTime} onChange={e=>setWakeTime(e.target.value)}/></div></div>{!bedtime&&!wakeTime&&<div className="mt-2"><p className="mb-1 text-[10px] text-muted-foreground">Or enter total sleep manually</p><Input inputMode="decimal" value={sleepHours} onChange={e=>setSleepHours(e.target.value.replace(/[^0-9.,]/g,""))} placeholder="8"/></div>}</Field>
      <Field label="Sleep quality"><div className="mt-2 grid grid-cols-5 gap-1">{["Very poor","Poor","Okay","Good","Excellent"].map((q,i)=><button key={q} type="button" onClick={()=>setQuality(q)} className={`rounded-2xl px-1 py-3 text-center text-[10px] ring-1 ${quality===q?"bg-primary/15 ring-primary":"bg-surface ring-border"}`}><div className="mb-1 text-xl">{["☹","🙁","😐","🙂","☺"][i]}</div>{q}</button>)}</div></Field>
      <Field label="Night awakenings"><div className="mt-1 flex items-center justify-between rounded-2xl bg-surface p-2 ring-1 ring-border"><button type="button" onClick={()=>setAwakenings(v=>Math.max(0,v-1))} className="grid h-10 w-10 place-items-center rounded-full bg-tint text-xl">−</button><span className="text-lg font-semibold">{awakenings}</span><button type="button" onClick={()=>setAwakenings(v=>Math.min(20,v+1))} className="grid h-10 w-10 place-items-center rounded-full bg-tint text-xl">+</button></div></Field>
      <Field label="Energy on waking"><div className="mt-2 grid grid-cols-5 gap-2">{[1,2,3,4,5].map(n=><button key={n} type="button" onClick={()=>setSleepEnergy(n)} className={`h-10 rounded-xl ring-1 ${sleepEnergy===n?"bg-primary/15 ring-primary":"bg-surface ring-border"}`}>{n}</button>)}</div><p className="mt-1 text-center text-[10px] text-muted-foreground">{["","Very low","Low","Moderate","Good","High"][sleepEnergy]}</p></Field>
      <Field label="Notes (optional)"><Textarea rows={3} maxLength={200} value={sleepNote} onChange={e=>setSleepNote(e.target.value)} placeholder="How was your sleep?"/><p className="mt-1 text-right text-[10px] text-muted-foreground">{sleepNote.length}/200</p></Field>
    </>}

    {tab === "weight" && <>
      <div className="rounded-2xl bg-surface p-4 ring-1 ring-border"><p className="text-xs font-semibold">Current weight</p><div className="mt-2 flex items-end justify-between"><p className="font-serif text-4xl">{currentWeight!=null?currentWeight.toFixed(1):'—'} <span className="text-lg">kg</span></p>{weightDelta!=null&&<p className={`text-xs font-semibold ${weightDelta<=0?"text-primary":"text-muted-foreground"}`}>{weightDelta>0?'↑':'↓'} {Math.abs(weightDelta).toFixed(1)} kg<br/><span className="font-normal">vs previous</span></p>}</div></div>
      <Field label="New weight"><div className="grid grid-cols-[1fr_120px] gap-2"><Input inputMode="decimal" value={weight} onChange={e=>setWeight(e.target.value.replace(/[^0-9.,]/g,""))} placeholder="62.4 kg"/><Input type="time" value={weightTime} onChange={e=>setWeightTime(e.target.value)}/></div></Field>
      <div className="rounded-2xl bg-surface p-3 ring-1 ring-border"><div className="flex items-center justify-between"><p className="text-xs font-semibold">Trend</p><div className="flex rounded-full bg-tint p-1">{([7,30,90] as const).map(n=><button key={n} type="button" onClick={()=>setWeightRange(n)} className={`rounded-full px-2 py-1 text-[10px] ${weightRange===n?"bg-primary text-primary-foreground":""}`}>{n} days</button>)}</div></div><MiniTrend points={weightTrend} unit="kg" />{weightTrend.length>0&&<div className="mt-3 grid grid-cols-3 gap-2 text-center"><div><p className="text-[10px] text-muted-foreground">Average</p><p className="text-xs font-semibold">{(weightTrend.reduce((a,b)=>a+b.value,0)/weightTrend.length).toFixed(1)} kg</p></div><div><p className="text-[10px] text-muted-foreground">Highest</p><p className="text-xs font-semibold">{Math.max(...weightTrend.map(x=>x.value)).toFixed(1)} kg</p></div><div><p className="text-[10px] text-muted-foreground">Lowest</p><p className="text-xs font-semibold">{Math.min(...weightTrend.map(x=>x.value)).toFixed(1)} kg</p></div></div>}</div>
      <Field label="Body fat % (optional)"><Input inputMode="decimal" value={bodyFat} onChange={e=>setBodyFat(e.target.value.replace(/[^0-9.,]/g,""))} placeholder="e.g. 24.5"/></Field>
      <Field label="Notes (optional)"><Textarea rows={3} maxLength={200} value={weightNote} onChange={e=>setWeightNote(e.target.value)} placeholder="How are you feeling?"/><p className="mt-1 text-right text-[10px] text-muted-foreground">{weightNote.length}/200</p></Field>
      {weightEntries.length>0&&<div className="space-y-2">{weightEntries.map(e=><div key={e.id} className="flex items-center gap-3 rounded-2xl bg-surface px-3 py-2 ring-1 ring-border"><Ico e="⚖️" size={19}/><div className="flex-1"><p className="text-sm font-semibold">{e.value.toFixed(1)} kg</p><p className="text-xs text-muted-foreground">{e.time}{e.bodyFatPercent!=null?` · ${e.bodyFatPercent}% body fat`:""}</p></div><button type="button" onClick={()=>deleteWeight(e.id)} className="rounded-full p-2 text-muted-foreground"><X className="h-4 w-4"/></button></div>)}</div>}
      <div className="rounded-2xl bg-tint p-3 text-xs"><p className="font-semibold">💡 Good to know</p><p className="mt-1 text-muted-foreground">Weight naturally fluctuates because of hormones, water retention, salt and food. Focus on trends, not daily changes.</p></div>
    </>}
  </div>;
}
'''
          s=s[:start]+new+'\n'
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/improve-vitals-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve temperature sleep and weight logs"
          git push origin HEAD:agent/improve-temp-sleep-weight