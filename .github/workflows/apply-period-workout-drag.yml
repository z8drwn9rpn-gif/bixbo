name: Apply period workout drag
on:
  push:
    branches: [agent/period-workout-field-drag]
    paths:
      - '.github/scripts/apply_period_workout_drag.py'
      - '.github/workflows/apply-period-workout-drag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python .github/scripts/apply_period_workout_drag.py
      - run: rm .github/scripts/apply_period_workout_drag.py .github/workflows/apply-period-workout-drag.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'make Period and Workout fields truly reorderable'
          git push
