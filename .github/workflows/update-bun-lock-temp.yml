name: Temporary Bun lock update

on:
  push:
    branches:
      - remove-unused-lovable-packages

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-unused-lovable-packages
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Refresh bun.lock
        run: bun install
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh bun.lock after removing unused Lovable packages"
          git push origin HEAD:remove-unused-lovable-packages
