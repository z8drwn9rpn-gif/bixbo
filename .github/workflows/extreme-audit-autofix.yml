name: BIXBO extreme audit autofix

on:
  push:
    paths:
      - .github/workflows/extreme-audit-autofix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply audited fixes
        run: python3 scripts/extreme-audit-autofix.py
      - name: Architecture guard
        run: bun run architecture
      - name: UI emoji audit
        run: bun run audit:ui-emoji
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit and regression tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Bundle budget
        run: bun run bundle:check
      - name: SSR smoke
        run: bun run smoke:ssr
      - name: Commit audited fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e
          git commit -m "Harden BIXBO full-app runtime and UI regressions"
          git push origin HEAD:main
