name: Temporary live VAPID inspection

on:
  push:
    branches: [inspect-live-vapid-20260817]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public VAPID key from live client bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          import urllib.parse
          import urllib.request

          base = "https://bixbo.z8drwn9rpn.workers.dev/"
          headers = {"User-Agent": "BIXBO-GitHub-release-inspection/1.0"}

          def fetch(url: str) -> str:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode("utf-8", errors="ignore")

          html = fetch(base)
          initial = re.findall(r'(?:src|href)=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', html)
          queue = [urllib.parse.urljoin(base, item) for item in initial]
          seen = set()
          candidates = {}

          while queue and len(seen) < 300:
              url = queue.pop(0)
              if url in seen or not url.startswith(base):
                  continue
              seen.add(url)
              try:
                  text = fetch(url)
              except Exception as exc:
                  print(f"WARN fetch failed: {url}: {exc}")
                  continue

              for key in re.findall(r'(?<![A-Za-z0-9_-])(B[A-Za-z0-9_-]{86})(?![A-Za-z0-9_-])', text):
                  try:
                      raw = base64.urlsafe_b64decode(key + "=" * (-len(key) % 4))
                  except Exception:
                      continue
                  if len(raw) == 65 and raw[0] == 4:
                      candidates.setdefault(key, set()).add(url)

              for ref in re.findall(r'["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', text):
                  child = urllib.parse.urljoin(url, ref)
                  if child.startswith(base) and child not in seen and child not in queue:
                      queue.append(child)

          print(f"Scanned {len(seen)} public JavaScript assets.")
          if not candidates:
              raise SystemExit("No P-256 VAPID-shaped public key found in live client assets.")

          for index, (key, urls) in enumerate(sorted(candidates.items()), start=1):
              print(f"VAPID_CANDIDATE_{index}={key}")
              for url in sorted(urls):
                  print(f"  asset={url}")

          if len(candidates) != 1:
              raise SystemExit(f"Expected one live P-256 public-key candidate, found {len(candidates)}; refusing to guess.")
          PY
