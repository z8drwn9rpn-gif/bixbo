name: Fix mascot render once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mascot-render-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace img mascot rendering with background-image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/components/AppShell.tsx')
          src = app.read_text()
          old = '''                <span className={big ? "relative block h-[52px] w-[52px] shrink-0 overflow-visible" : "relative block h-10 w-10 shrink-0 overflow-visible"} aria-hidden="true">\n                  <img src={BIXBO_MASCOT_SRC} alt="" aria-hidden="true" draggable={false} className="block h-full w-full object-contain object-center opacity-100 visible" style={{ display: "block", opacity: 1, visibility: "visible", filter: "none", mixBlendMode: "normal" }} />\n                </span>'''
          new = '''                <span\n                  className={big ? "relative block h-[52px] w-[52px] shrink-0" : "relative block h-10 w-10 shrink-0"}\n                  aria-hidden="true"\n                  style={{\n                    backgroundImage: `url(${BIXBO_MASCOT_SRC})`,\n                    backgroundRepeat: "no-repeat",\n                    backgroundPosition: "center",\n                    backgroundSize: "contain",\n                    opacity: 1,\n                    visibility: "visible",\n                  }}\n                />'''
          if old not in src:
              raise SystemExit('AppShell mascot block not found')
          app.write_text(src.replace(old, new, 1))

          side = Path('src/components/SideNav.tsx')
          src = side.read_text()
          start = src.index('        <img\n          src={mascotSrc}')
          end = src.index('        />', start) + len('        />')
          replacement = '''        <span\n          aria-label="BIXBO"\n          role="img"\n          className="block h-11 w-[46px] shrink-0 select-none"\n          style={{\n            backgroundImage: `url(${mascotSrc})`,\n            backgroundRepeat: "no-repeat",\n            backgroundPosition: "center",\n            backgroundSize: "contain",\n            opacity: 1,\n            visibility: "visible",\n          }}\n        />'''
          side.write_text(src[:start] + replacement + src[end:])
          PY

      - name: Verify build
        shell: bash
        run: |
          npm install
          npm run build

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-mascot-render-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AppShell.tsx src/components/SideNav.tsx .github/workflows/fix-mascot-render-once.yml
          git commit -m "fix: render exact BIXBO mascot without img element"
          git pull --rebase origin main
          git push origin HEAD:main
