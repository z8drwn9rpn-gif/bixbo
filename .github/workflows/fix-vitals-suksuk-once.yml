name: BIXBO one-time vitals and Suksuk repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-vitals-suksuk-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted repair
        run: python3 .github/scripts/fix_vitals_suksuk.py

      - name: Verify source repair
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Saved temperature measurements' src/features/logging/LogSheetRoot.tsx
          grep -Fq 'Saved weight measurements' src/features/logging/LogSheetRoot.tsx
          grep -Fq 'bg-primary text-primary-foreground shadow-sm ring-2 ring-foreground/60' src/features/logging/CycleForms.tsx
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Commit repair and clean one-time files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-vitals-suksuk-once.yml .github/scripts/fix_vitals_suksuk.py
          git add src/features/logging/LogSheetRoot.tsx src/features/logging/CycleForms.tsx
          git config user.name "BIXBO automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore multi-entry vitals and Suksuk selection state"
          git push origin HEAD:main
