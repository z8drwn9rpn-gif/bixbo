name: BIXBO one-time vitals and Suksuk repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-vitals-suksuk-once.yml"
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event_name == 'push' || github.event.issue.number == 229
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply targeted repair
        id: apply
        run: python3 .github/scripts/fix_vitals_suksuk.py

      - name: Verify source repair
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Saved temperature measurements' src/features/logging/LogSheetRoot.tsx
          grep -Fq 'Saved weight measurements' src/features/logging/LogSheetRoot.tsx
          grep -Fq 'bg-primary text-primary-foreground shadow-sm ring-2 ring-foreground/60' src/features/logging/CycleForms.tsx
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Report repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/229" \
            --raw-field body="One-time Body & Recovery + SukSuk repair. Apply: ${APPLY_OUTCOME:-not-run}. Verify: ${VERIFY_OUTCOME:-not-run}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Commit repair and clean one-time files
        if: steps.apply.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-vitals-suksuk-once.yml .github/scripts/fix_vitals_suksuk.py
          git add src/features/logging/LogSheetRoot.tsx src/features/logging/CycleForms.tsx
          git config user.name "BIXBO automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore multi-entry vitals and Suksuk selection state"
          git push origin HEAD:main
