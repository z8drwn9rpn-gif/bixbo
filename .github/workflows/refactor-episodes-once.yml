name: Refactor Episodes log once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refactor-episodes-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python3 scripts/refactor_episodes_once.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Commit result
        if: success()
        run: |
          rm -f scripts/refactor_episodes_once.py
          rm -f .github/workflows/refactor-episodes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LogSheet.tsx scripts/refactor_episodes_once.py .github/workflows/refactor-episodes-once.yml
          git commit -m "feat: merge tetany and panic into Episodes wizard"
          git push origin HEAD:main
