name: Finish Eyes and Recipes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finish-and-check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/eyes-recipes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyes-recipes
          fetch-depth: 0

      - name: Wire features into existing app
        run: python scripts/finish-eyes-recipes.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run architecture
      - run: bun run audit:ui-emoji
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name 'BIXBO automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src
          git rm .github/workflows/finish-eyes-recipes.yml scripts/finish-eyes-recipes.py scripts/apply-eyes-recipes-idempotent.py || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Wire Eyes episodes and Recipes into BIXBO'
          git push origin HEAD:feature/eyes-recipes
