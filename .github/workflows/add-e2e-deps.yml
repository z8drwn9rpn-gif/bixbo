name: Add E2E dependencies

on:
  push:
    branches: [code-audit-hardening-no-notes]

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, 'Lock browser E2E dependencies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: code-audit-hardening-no-notes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Add pinned project dependencies
        run: bun add --dev @playwright/test wrangler
      - name: Add E2E script
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts.e2e = 'playwright test';
          p.scripts.check = 'bun run architecture && bun run typecheck && bun run lint && bun test && bun run build && bun run smoke:ssr && bun run e2e';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Lock browser E2E dependencies"
          git push origin HEAD:code-audit-hardening-no-notes
