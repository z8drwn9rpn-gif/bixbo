name: One-time fix meds PDF note
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger meds PDF note fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/patch-meds-pdf-and-note.py
      - name: Full project verification
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit fix
        run: |
          rm -f scripts/patch-meds-pdf-and-note.py .github/workflows/one-time-fix-meds-pdf-note.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix granular meds reporting and duplicate note"
          git push origin HEAD:main
