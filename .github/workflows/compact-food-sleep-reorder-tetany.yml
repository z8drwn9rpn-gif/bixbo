name: Tetany and overview UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run Tetany and overview UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/compact-food-sleep-reorder-tetany.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified changes
        run: |
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/LogSheet.tsx src/components/home/DayOverview.tsx
          git diff --cached --check
          git commit -m "Align Tetany entry order and compact overview cards"
          git push origin HEAD:main
