name: Fix admin entry upsert typecheck
on:
  push:
    branches: [agent/admin-fields-entry-upsert]
    paths:
      - '.github/scripts/fix_admin_entry_upsert_ts.py'
      - '.github/workflows/fix-admin-entry-upsert-ts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-fields-entry-upsert
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_admin_entry_upsert_ts.py
      - run: rm .github/scripts/fix_admin_entry_upsert_ts.py .github/workflows/fix-admin-entry-upsert-ts.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix admin entry upsert target compatibility'
          git push
