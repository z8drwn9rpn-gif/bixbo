name: Apply exact nav and profile order

on:
  push:
    branches:
      - agent/exact-user-nav-assets
    paths:
      - scripts/apply_exact_nav_profile_order.py
      - .github/workflows/apply-exact-nav-profile-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-user-nav-assets
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/apply_exact_nav_profile_order.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified fix and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BottomNav.tsx src/components/SideNav.tsx src/routes/profile.tsx
          git rm scripts/apply_exact_nav_profile_order.py .github/workflows/apply-exact-nav-profile-order.yml
          git commit -m "Use exact Home and Couple nav artwork and restore profile order"
          git push origin HEAD:agent/exact-user-nav-assets
