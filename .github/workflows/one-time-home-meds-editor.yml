name: One-time Home meds editor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Home meds granular editor patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/patch-home-meds-editor.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
      - name: Commit
        run: |
          rm -f scripts/patch-home-meds-editor.py .github/workflows/one-time-home-meds-editor.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Open granular scheduled meds from Home overview"
          git push origin HEAD:main
# Trigger Home meds granular editor patch
