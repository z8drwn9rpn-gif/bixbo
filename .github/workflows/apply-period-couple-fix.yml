name: Apply Period and Couple fix
on:
  push:
    branches: [agent/fix-period-couple-current-main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-period-couple-current-main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply exact patch
        run: python scripts/apply_period_couple_fix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified patch
        run: |
          rm -f scripts/apply_period_couple_fix.py .github/workflows/apply-period-couple-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Period calendar visibility and Couple symmetry"
          git push origin HEAD:agent/fix-period-couple-current-main
