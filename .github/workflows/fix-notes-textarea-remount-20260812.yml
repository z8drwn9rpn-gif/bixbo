name: Fix Notes textarea remount 2026-08-12
on:
  push:
    paths:
      - scripts/fix_notes_textarea_remount_20260812.py
      - .github/workflows/fix-notes-textarea-remount-20260812.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Notes fix
        run: python scripts/fix_notes_textarea_remount_20260812.py
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Notes regression test
        run: bun test src/lib/__tests__/notes-ios-editing-regression.test.ts
      - name: Build
        run: bun run build
      - name: Commit Notes fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/notes-editor.tsx src/lib/__tests__/notes-ios-editing-regression.test.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix Notes body typing on iOS PWA"
            git push origin HEAD:main
          fi
