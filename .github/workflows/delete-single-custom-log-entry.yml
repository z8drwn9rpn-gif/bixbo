name: Delete single custom log entry
on:
  push:
    branches: [agent/delete-single-custom-log-entry]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/delete-single-custom-log-entry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/delete_single_custom_log_entry.py
      - run: rm .github/scripts/delete_single_custom_log_entry.py .github/workflows/delete-single-custom-log-entry.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/LogSheet.tsx .github
          git commit -m 'delete individual saved custom log entries safely'
          git push origin HEAD:agent/delete-single-custom-log-entry