name: Apply recipe meta nowrap

on:
  push:
    branches: [fix/recipe-meta-labels-single-line]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/recipe-meta-labels-single-line
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch recipe metadata layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/features/notes/RecipesView.tsx')
          text = path.read_text()

          old_grid = 'grid grid-cols-4 border-y border-[#CFC5AD] py-3 text-[#45483A]'
          new_grid = 'grid grid-cols-[0.82fr_0.82fr_1.08fr_1.28fr] border-y border-[#CFC5AD] py-3 text-[#45483A]'
          grid_count = text.count(old_grid)
          if grid_count != 2:
              raise SystemExit(f'Expected 2 metadata grids, found {grid_count}')
          text = text.replace(old_grid, new_grid)

          old_label = 'flex items-center gap-1 text-[9px] font-bold uppercase tracking-[0.12em] text-[#7B8063]'
          new_label = 'flex items-center gap-0.5 whitespace-nowrap text-[8px] font-bold uppercase tracking-[0.06em] text-[#7B8063]'
          label_count = text.count(old_label)
          if label_count != 8:
              raise SystemExit(f'Expected 8 metadata labels, found {label_count}')
          text = text.replace(old_label, new_label)

          path.write_text(text)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Commit validated source change
        run: |
          set -euo pipefail
          git config user.name "BIXBO automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-recipe-meta-nowrap.yml
          git add src/features/notes/RecipesView.tsx
          git commit -m "Keep recipe metadata labels on one line"
          git push origin HEAD:fix/recipe-meta-labels-single-line
