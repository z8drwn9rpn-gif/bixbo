name: Mount universal admin editor
on:
  push:
    branches:
      - agent/universal-admin-page-editor
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-admin-page-editor
      - name: Mount editor
        run: python scripts/mount_universal_admin_editor.py
      - name: Commit mount
        run: |
          git rm .github/workflows/mount-universal-admin-editor.yml scripts/mount_universal_admin_editor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/__root.tsx
          git commit -m "mount universal admin page editor"
          git push origin HEAD:agent/universal-admin-page-editor
