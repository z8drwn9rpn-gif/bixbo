name: Force transparent mascot once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-transparent-mascot-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mascot has alpha
        run: |
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('public/bixbo-mascot-user.png')
          assert im.mode in ('RGBA','LA') or ('transparency' in im.info), (im.mode, im.info)
          print(im.size, im.mode)
          PY
      - name: Build
        run: |
          npm install
          npm run build
      - name: Cleanup
        run: |
          rm -f .github/workflows/force-transparent-mascot-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/force-transparent-mascot-once.yml
          git commit -m "chore: remove transparent mascot verification workflow" || true
          git push
