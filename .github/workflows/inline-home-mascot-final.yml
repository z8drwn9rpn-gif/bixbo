name: Inline Home mascot final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inline-home-mascot-final.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inline exact Home mascot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          home = Path('src/features/home/HomePage.tsx')
          png = Path('src/assets/bixbo-mascot-user.png')
          s = home.read_text()
          data = base64.b64encode(png.read_bytes()).decode('ascii')
          uri = 'data:image/png;base64,' + data

          s = s.replace('import bixboMascot from "@/assets/bixbo-mascot-user.png";\n', '')
          marker = 'import { HomeSummaryOverlay } from "@/components/home/HomeSummaryOverlay";\n'
          const_line = '\nconst HOME_MASCOT_DATA_URI = "' + uri + '";\n'
          if 'const HOME_MASCOT_DATA_URI =' not in s:
              s = s.replace(marker, marker + const_line, 1)
          else:
              s = re.sub(r'const HOME_MASCOT_DATA_URI = "[^"]*";', 'const HOME_MASCOT_DATA_URI = "' + uri + '";', s, count=1)

          s = s.replace('src={bixboMascot}', 'src={HOME_MASCOT_DATA_URI}')
          if 'src={HOME_MASCOT_DATA_URI}' not in s:
              raise SystemExit('Home mascot src replacement failed')
          home.write_text(s)
          PY

      - name: Verify build
        run: |
          npm install
          npm run build

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/inline-home-mascot-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/home/HomePage.tsx .github/workflows/inline-home-mascot-final.yml
          git commit -m "fix: inline exact Home mascot image"
          git pull --rebase origin main
          git push origin HEAD:main
