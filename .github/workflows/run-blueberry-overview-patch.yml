name: Run Blueberry overview patch

on:
  push:
    paths:
      - .github/blueberry-overview-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/patch-blueberry-overview.py
      - run: |
          rm -f scripts/patch-blueberry-overview.py .github/workflows/run-blueberry-overview-patch.yml .github/blueberry-overview-patch-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show full Blueberry entry in overview"
          git push
