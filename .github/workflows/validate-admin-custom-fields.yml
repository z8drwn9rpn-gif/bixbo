name: Validate admin custom fields

on:
  push:
    branches:
      - agent/validate-admin-custom-fields

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-admin-custom-fields
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/validate_admin_custom_fields.py
      - run: rm .github/scripts/validate_admin_custom_fields.py .github/workflows/validate-admin-custom-fields.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CoreFeatureCustomFieldBuilder.tsx src/components/CoreFeatureCustomFieldsForm.tsx .github
          git commit -m 'validate admin custom field configuration'
          git push origin HEAD:agent/validate-admin-custom-fields
