          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCgpwID0gUGF0aCgi c3JjL2ZlYXR1cmVzL2xvZ2dpbmcvUGFpbldpemFyZC50c3giKQpzID0gcC5yZWFkX3RleHQoKQoKbl9zdGFydCA9IHMu aW5kZXgoJyAgICAgICAgICA8RmllbGQgbGFiZWw9Ik5hdXNlYT8iPicpCm ' | tr -d ' ' | base64 -d | python3
