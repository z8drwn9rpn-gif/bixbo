name: Move food reaction under allergens once
on:
  push:
    branches: [agent/move-food-reaction]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[food-reaction-order]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-food-reaction
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Move Reaction under Allergens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/logging/LifestyleForms.tsx')
          s = p.read_text()
          reaction = '''      <Field label="Reaction?" schemaFieldId="reaction">
        <div className="mt-1 flex gap-2">
          <Chip active={!allergicReaction} onClick={() => setAllergicReaction(false)}>
            No / not sure
          </Chip>
          <Chip active={allergicReaction} onClick={() => setAllergicReaction(true)}>
            Yes — log it
          </Chip>
        </div>
        {allergicReaction && (
          <div className="mt-2 flex gap-2">
            {(["mild", "moderate", "severe"] as const).map((s2) => (
              <Chip key={s2} active={reactionSeverity === s2} onClick={() => setReactionSeverity(s2)}>
                {s2[0].toUpperCase() + s2.slice(1)}
              </Chip>
            ))}
          </div>
        )}
      </Field>
'''
          if s.count(reaction) != 1:
              raise SystemExit(f'Expected exactly one Reaction block, found {s.count(reaction)}')
          s = s.replace(reaction, '', 1)
          marker = '      <Field label="Allergens in this meal" schemaFieldId="allergens">\n'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Allergens field not found')
          intake = '      <RegistryFieldBlock fieldId="intake">\n'
          end = s.find(intake, start)
          if end < 0:
              raise SystemExit('Intake block after allergens not found')
          s = s[:end] + reaction + s[end:]
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/move-food-reaction-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: move food reaction under allergens [food-reaction-order]"
          git push origin HEAD:agent/move-food-reaction
