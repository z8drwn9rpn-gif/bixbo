name: Move food reaction field
on:
  push:
    branches:
      - agent/move-food-reaction
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-food-reaction
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/features/logging/LifestyleForms.tsx")
          s = p.read_text()
          a = s.index('      <Field label="Reaction?" schemaFieldId="reaction">')
          b = s.index('      <Field label="How do I feel after food?"', a)
          reaction = s[a:b]
          s = s[:a] + s[b:]
          allergens = s.index('      <Field label="Allergens in this meal" schemaFieldId="allergens">')
          intake = s.index('      <RegistryFieldBlock fieldId="intake">', allergens)
          s = s[:intake] + reaction + s[intake:]
          p.write_text(s)
          PY
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/move-food-reaction-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: move food reaction under allergens"
          git push origin HEAD:agent/move-food-reaction
