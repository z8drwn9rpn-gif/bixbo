name: UX organization preview
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger UX organization preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply UX patch
        run: python3 scripts/ux-organization-preview-20260813.py
      - name: Full verification
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit UX preview
        run: |
          rm -f scripts/ux-organization-preview-20260813.py .github/workflows/ux-organization-preview-20260813.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve Insights UX organization"
          git push origin HEAD:main
