name: BIXBO one-time log date/action spacing repair

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.number == 229
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply log header spacing repair
        id: apply
        run: python3 .github/scripts/fix_log_date_savebar_gap.py

      - name: Verify source repair
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-bixbo-log-save-bar' src/features/logging/LogFormPrimitives.tsx
          grep -Fq 'var(--bixbo-log-date-offset, 0px)' src/features/logging/LogFormPrimitives.tsx
          grep -Fq 'formSurface.style.setProperty("--bixbo-log-date-offset", "36px")' src/components/LogSheet.tsx
          ! grep -Fq 'formSurface.style.paddingTop = showDateControl ? "36px" : ""' src/components/LogSheet.tsx
          grep -Fq 'style={{ top: "var(--bixbo-log-date-offset, 0px)" }} className="sticky' src/features/logging/PainWizard.tsx
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Report repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/229" \
            --raw-field body="One-time log date/action spacing repair. Apply: ${APPLY_OUTCOME:-not-run}. Verify: ${VERIFY_OUTCOME:-not-run}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Commit repair and clean one-time files
        if: steps.apply.outcome == 'success' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-log-date-savebar-gap-once.yml .github/scripts/fix_log_date_savebar_gap.py
          git add src/components/LogSheet.tsx src/features/logging/LogFormPrimitives.tsx src/features/logging/PainWizard.tsx src/lib/__tests__/ui-layout-architecture-regression.test.ts
          git config user.name "BIXBO automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove gap between log date and action bar"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
