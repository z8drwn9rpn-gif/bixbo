name: Temporary route tree regeneration

on:
  push:
    branches:
      - oauth-consent-neutral-path

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oauth-consent-neutral-path
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Regenerate TanStack route tree
        run: bun run build
      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "Regenerate TanStack route tree"
          git push origin HEAD:oauth-consent-neutral-path
