name: Apply auth and patterns fix

on:
  push:
    branches:
      - fix/auth-session-pattern-semantics
    paths:
      - scripts/apply-auth-pattern-fix.mjs
      - .github/workflows/apply-auth-pattern-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-session-pattern-semantics
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Repair temporary script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply-auth-pattern-fix.mjs")
          s = p.read_text()
          needle = """.toBe(`${'${PRODUCTION_APP_ORIGIN}'}/auth`);"""
          replacement = '.toBe(PRODUCTION_APP_ORIGIN + "/auth");'
          if needle not in s:
              raise SystemExit("temporary script syntax marker not found")
          p.write_text(s.replace(needle, replacement))
          PY
      - name: Apply patch
        run: |
          if ! node scripts/apply-auth-pattern-fix.mjs > /tmp/apply-fix.log 2>&1; then
            cat /tmp/apply-fix.log
            cp /tmp/apply-fix.log apply-auth-pattern-fix-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apply-auth-pattern-fix-error.txt
            git commit -m "Capture auth patterns autofix failure"
            git push origin HEAD:fix/auth-session-pattern-semantics
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and tests
        run: |
          bun run typecheck
          bun run test
      - name: Commit generated fix and remove temporary autofix files
        run: |
          rm -f scripts/apply-auth-pattern-fix.mjs .github/workflows/apply-auth-pattern-fix.yml apply-auth-pattern-fix-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Fix Google auth session stability and Patterns change semantics"
          git push origin HEAD:fix/auth-session-pattern-semantics
