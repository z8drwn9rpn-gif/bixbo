name: Apply auth and patterns fix

on:
  push:
    branches:
      - fix/auth-session-pattern-semantics
    paths:
      - scripts/apply-auth-pattern-fix-v2.mjs
      - .github/workflows/apply-auth-pattern-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-session-pattern-semantics
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply repair
        run: node scripts/apply-auth-pattern-fix-v2.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and tests
        run: |
          bun run typecheck
          bun run test
      - name: Commit repaired sources
        run: |
          rm -f scripts/apply-auth-pattern-fix.mjs scripts/apply-auth-pattern-fix-v2.mjs
          rm -f .github/workflows/apply-auth-pattern-fix.yml apply-auth-pattern-fix-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Google auth session stability and Patterns change semantics"
          git push origin HEAD:fix/auth-session-pattern-semantics
