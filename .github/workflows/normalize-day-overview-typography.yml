name: Normalize Day Overview typography
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run Day Overview typography normalization patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/normalize-day-overview-typography.py
      - name: Quality check
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified fix
        run: |
          rm -f scripts/normalize-day-overview-typography.py .github/workflows/normalize-day-overview-typography.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Match Day Overview typography to Pain card"
          git push origin HEAD:main
