name: One-time scheduled medication notes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger scheduled medication notes patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply focused patch
        run: python3 scripts/patch-med-scheduled-notes.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
      - name: Commit
        run: |
          rm -f scripts/patch-med-scheduled-notes.py .github/workflows/one-time-med-scheduled-notes.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add notes to scheduled medication doses"
          git push origin HEAD:main
