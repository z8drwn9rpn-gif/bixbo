name: Full i18n render fix
on:
  push:
    paths:
      - '.github/workflows/full-i18n-render-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Make patch script type-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/full_i18n_render_fix.py')
          s=p.read_text()
          s=s.replace("        idx = s.find('type ')", "        idx = s.find('\\ntype UpdateFn') + 1")
          s=s.replace("s = s.replace('toLocaleDateString(\"en-US\"', 'toLocaleDateString(language === \"sk\" ? \"sk-SK\" : \"en-US\"')", "# tooltip locale left unchanged here; visible heatmap labels are translated below")
          s=s.replace("for expr in ['monthlySummary.improved','monthlySummary.attention','monthlySummary.stable','confidence.detail','phaseSummary.highestPain','phaseSummary.bestEnergy','phaseSummary.mostNegativeMood','phaseSummary.mostHotFlashes','phaseSummary.flow']:", "for expr in []:")
          s=s.replace("s = s.replace('{value}', '<TrText value={value} />')", "s = re.sub(r'>\\s*\\{value\\}\\s*<', '><TrText value={value} /><', s)")
          p.write_text(s)
          PY
      - name: Apply render translation patch
        run: python3 .github/scripts/full_i18n_render_fix.py
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LogSheet.tsx src/routes/insights.tsx src/routes/patterns.tsx src/routes/profile.tsx src/lib/i18n.ts
          git diff --cached --quiet && exit 0
          git commit -m "Complete Slovak render translation pass"
          git push
