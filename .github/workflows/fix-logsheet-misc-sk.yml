name: Fix LogSheet remaining Slovak
on:
  push:
    paths:
      - .github/workflows/fix-logsheet-misc-sk.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Add remaining LogSheet translations
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('src/lib/i18n.ts'); s=p.read_text()
          marker='  "Pain still feels the same?": "Bolesť je stále rovnaká?",'
          entries={
            'Additional note (optional)':'Doplňujúca poznámka (voliteľné)','Alcohol (drinks)':'Alkohol (nápoje)','Allergens in this meal':'Alergény v tomto jedle','Birth control since (optional)':'Antikoncepcia od (voliteľné)','Caffeine (mg)':'Kofeín (mg)','Day note (optional)':'Poznámka k dňu (voliteľné)','Delete Blueberry entry':'Vymazať Blueberry záznam','How do you feel?':'Ako sa cítiš?','How I feel after':'Ako sa cítim potom','New temperature measurement':'Nové meranie teploty','New weight measurement':'Nové meranie hmotnosti','Reaction?':'Reakcia?','Rescue med (what you took)':'Záchranný liek (čo si užila)','Saved temperature measurements':'Uložené merania teploty','Taking birth control since':'Antikoncepcia užívaná od','Tetany present?':'Prítomná tetánia?','Time of entry':'Čas záznamu',"Trigger (or 'no obvious trigger')":'Spúšťač (alebo „bez zjavného spúšťača“)','Urinary':'Močové','What did you eat?':'Čo si jedla?','Cycle prediction is based on your last period and cycle length (edit in Settings later).':'Predikcia cyklu vychádza z poslednej menštruácie a dĺžky cyklu (neskôr upravíš v Nastaveniach).','— cycle predictions are paused.':'— predikcie cyklu sú pozastavené.','· scheduled':'· naplánované','· Trimester':'· trimester',
            '😀 Great':'😀 Výborne','😊 Great':'😊 Výborne','😊 Happy':'😊 Šťastná','😌 Calm':'😌 Pokojná','😌 Refreshed':'😌 Oddýchnutá','😌 Relaxed':'😌 Uvoľnená','😎 Just chillin':'😎 Pohoda','😐 Indifferent':'😐 Ľahostajná','😐 Meh':'😐 Nijako','😐 Neutral':'😐 Neutrálne','😐 Ok':'😐 OK','😑 Apathetic':'😑 Apatická','😒 Irritated':'😒 Podráždená','😔 Depressed':'😔 Depresívna','😕 Meh':'😕 Nijako','😕 Off':'😕 Nie vo svojej koži','😖 Bloated':'😖 Nafúknutá','😖 Stressed':'😖 V strese','😞 Down':'😞 Sklíčená','😠 Angry':'😠 Nahnevaná','😢 Sad':'😢 Smutná','😤 Annoyed':'😤 Naštvaná','😤 Frustrated':'😤 Frustrovaná','😩 Awful':'😩 Hrozne','😪 Fatigued':'😪 Vyčerpaná','😰 Anxious':'😰 Úzkostná','😴 Sleepy':'😴 Ospalá','😵‍💫 Dizzy':'😵‍💫 Závrat','😵‍💫 Foggy head':'😵‍💫 Zahmlená hlava','😾 Cranky':'😾 Mrzutá','🙂 Fine':'🙂 Fajn','🙂 Good':'🙂 Dobre','🙏 Grateful':'🙏 Vďačná','🤩 Amazing':'🤩 Úžasne','🤩 Excited':'🤩 Nadšená','🤩 Perfect':'🤩 Perfektne','🥰 In love':'🥰 Zamilovaná','🥰 Loved':'🥰 Milovaná','🥱 Bored':'🥱 Znudená','🥱 Restless':'🥱 Nepokojná','🥱 Tired':'🥱 Unavená','🥲 Lonely':'🥲 Osamelá','🥴 Groggy':'🥴 Omámená','🥵 Flushed':'🥵 Začervenaná','🥵 Hot':'🥵 Horúco','🥶 Cold':'🥶 Zima','🥺 Clingy':'🥺 Potrebujem blízkosť','🫠 Drained':'🫠 Vyčerpaná','🫥 Self-deprecating':'🫥 Sebakritická','💪 Energized':'💪 Plná energie','💪 Productive':'💪 Produktívna','💦 Sweaty':'💦 Spotená','🤕 In pain':'🤕 Mám bolesti','🤕 Sore':'🤕 Boľavá','🤕 Stomach pain':'🤕 Bolesť brucha','🤢 Nauseous':'🤢 Nevoľnosť','🌩️ PMDD':'🌩️ PMDD','🏃 Busy':'🏃 Zaneprázdnená',
            '😻 Best sleep ever':'😻 Najlepší spánok','😴 Restful':'😴 Oddychový','😴 Terrible':'😴 Hrozný','🙁 Poor':'🙁 Slabý','🌙 Broken sleep':'🌙 Prerušovaný spánok','😪 Woke up a lot':'😪 Často som sa budila','😰 Nightmares':'😰 Nočné mory','💭 Vivid dreams':'💭 Živé sny','📱 Fell asleep late':'📱 Zaspala som neskoro','☀️ Woke up early':'☀️ Zobudila som sa skoro','💤 Slept in':'💤 Dlhšie som spala','🐢 Hard to get up':'🐢 Ťažko sa vstávalo','🚽 Up to the toilet':'🚽 Vstávanie na toaletu','🦵 Cramps at night':'🦵 Nočné kŕče','🤕 Woke with headache':'🤕 Zobudila som sa s bolesťou hlavy','🥶 Cold night':'🥶 Chladná noc','🌡️ Sweaty night':'🌡️ Spotená noc','⏰ Too short':'⏰ Príliš krátky','🛌 Too long':'🛌 Príliš dlhý','🧘 Deep & calm':'🧘 Hlboký a pokojný','⚡ Energy up':'⚡ Viac energie','🌀 All over the place':'🌀 Rozhádzaný',
            'Clear / egg-white':'Číry / ako vaječný bielok','White / creamy':'Biely / krémový','Brown / spotting':'Hnedý / špinenie','Yellow':'Žltý','Normal':'Normálne','Painful':'Bolestivé','Relief':'Úľava','Warmth':'Teplo','Weakness':'Slabosť','Cold sweat':'Studený pot','Heavy sweating':'Silné potenie','Hard to concentrate':'Ťažké sústredenie','Stuffy nose':'Upchatý nos','Hives / rash':'Žihľavka / vyrážka','Itching':'Svrbenie','Rapid heart rate':'Rýchly tep','Gassy':'Plynatosť','GI issues':'Tráviace ťažkosti','Hunger soon after eating':'Hlad krátko po jedle','Fatigue after food':'Únava po jedle',
            'Place (optional)':'Miesto (voliteľné)','Additional note':'Doplňujúca poznámka','Symptoms after food':'Príznaky po jedle','How do I feel after food?':'Ako sa cítim po jedle?','High histamine food?':'Jedlo s vysokým obsahom histamínu?','Histamine flare?':'Histamínová reakcia?','Histamine flare symptoms':'Príznaky histamínovej reakcie','Discharge (optional)':'Výtok (voliteľné)','Discharge note (optional)':'Poznámka k výtoku (voliteľné)'
          }
          if marker not in s: raise RuntimeError('marker missing')
          block=''.join(f'  {json.dumps(k,ensure_ascii=False)}: {json.dumps(v,ensure_ascii=False)},\n' for k,v in entries.items() if f'  {json.dumps(k,ensure_ascii=False)}:' not in s)
          p.write_text(s.replace(marker,block+marker,1))
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-logsheet-misc-sk.yml
          git add src/lib/i18n.ts
          git commit -m "Translate remaining LogSheet mood sleep and form text"
          git push
