name: Cleanup Eyes Overview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup-and-check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/eyes-recipes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eyes-recipes
          fetch-depth: 0
      - run: python scripts/cleanup-eyes-overview.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run architecture
      - run: bun run audit:ui-emoji
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'BIXBO automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src
          git rm .github/workflows/cleanup-eyes-overview.yml scripts/cleanup-eyes-overview.py
          git commit -m 'Remove duplicate Eyes overview card'
          git push origin HEAD:feature/eyes-recipes
