name: Apply iOS calendar modal fix

on:
  push:
    branches:
      - fix/ios-log-jump-calendar-modal
    paths:
      - scripts/apply-ios-calendar-modal-fix.mjs
      - .github/workflows/apply-ios-calendar-modal-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-log-jump-calendar-modal
          fetch-depth: 0
      - name: Apply modal patch
        run: node scripts/apply-ios-calendar-modal-fix.mjs
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify
        run: |
          bun run typecheck
          bun run test
      - name: Commit generated change and remove temporary files
        run: |
          rm -f scripts/apply-ios-calendar-modal-fix.mjs .github/workflows/apply-ios-calendar-modal-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact calendar timeline modal"
          git push origin HEAD:fix/ios-log-jump-calendar-modal
