name: Verify final audited production build

on:
  push:
    branches: [verify-production-audit-final]

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest audited build on Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          base="https://bixbo.z8drwn9rpn.workers.dev"
          expected="ae746fff02bb3da35dff6cce8fd09ed999b6ea9c"
          for attempt in $(seq 1 60); do
            nonce="$(date +%s)-${attempt}"
            info="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$base/build-info.json?__audit_final=$nonce" || true)"
            manifest="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$base/manifest.json?__audit_final=$nonce" || true)"
            sw_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "$base/bixbo-push-sw.js?__audit_final=$nonce" || true)"

            if printf '%s' "$info" | grep -q "$expected" \
              && printf '%s' "$info" | grep -q '"app": "BIXBO"' \
              && printf '%s' "$manifest" | grep -q '"name"' \
              && [ "$sw_status" = "200" ]; then
              echo "Latest audited BIXBO commit is live on production: $expected"
              exit 0
            fi

            echo "Production has not exposed expected build metadata yet (${attempt}/60)."
            sleep 10
          done

          echo "Expected audited commit did not become live in the retry window."
          exit 1
