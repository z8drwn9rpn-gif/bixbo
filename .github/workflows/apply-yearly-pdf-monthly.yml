name: Apply yearly PDF monthly aggregation

on:
  push:
    branches:
      - fix/yearly-pdf-monthly-aggregation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply yearly PDF monthly patch
        run: node scripts/apply-yearly-pdf-monthly.mjs
      - name: Remove temporary patch files
        run: rm scripts/apply-yearly-pdf-monthly.mjs .github/workflows/apply-yearly-pdf-monthly.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make yearly health report month-based"
          git push
