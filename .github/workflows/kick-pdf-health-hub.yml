name: PDF Health Hub integration
on: [push]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Run PDF Health Hub integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Patch Profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/profile.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  onNotifications,\n  onAdmin,','  onNotifications,\n  onReports,\n  onAdmin,',1)
          s=s.replace('  onNotifications: () => void;\n  onAdmin?: () => void;','  onNotifications: () => void;\n  onReports: () => void;\n  onAdmin?: () => void;',1)
          anchor='''          <HubRow
            icon={<NoteIcon size={22} />}
            title="Export"
            subtitle="Export health data as JSON or CSV"
            onClick={() => onOpen("export")}
          />'''
          if 'title="PDF Reports"' not in s:
              assert anchor in s
              s=s.replace(anchor,'''          <HubRow
            icon={<NoteIcon size={22} />}
            title="PDF Reports"
            subtitle="Create a BIXBO-style printable health report"
            onClick={onReports}
          />
          <div className="ml-[4.5rem] border-t border-border/60" />
''' + anchor,1)
          invoke='''        onNotifications={() => navigate({ to: "/notifications" as never })}
        onAdmin={deviceAdminEnabled ? () => navigate({ to: "/admin" as never }) : undefined}'''
          if 'onReports={() => navigate({ to: "/report" as never })}' not in s:
              assert invoke in s
              s=s.replace(invoke,'''        onNotifications={() => navigate({ to: "/notifications" as never })}
        onReports={() => navigate({ to: "/report" as never })}
        onAdmin={deviceAdminEnabled ? () => navigate({ to: "/admin" as never }) : undefined}''',1)
          p.write_text(s,encoding='utf-8')
          PY
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/profile.tsx src/routeTree.gen.ts
          git commit -m 'Expose PDF reports in Health hub'
          git pull --rebase origin main
          git push
