name: Center pain scale and popup guide
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger centered pain scale popup UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply patch
        run: python3 scripts/center-pain-scale-popup.py
      - name: Verify
        run: |
          git diff --check
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit verified fix
        run: |
          rm -f scripts/center-pain-scale-popup.py .github/workflows/center-pain-scale-popup.yml
          git config user.name "BIXBO Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Center main pain scale and show guide in popup"
          git push origin HEAD:main
