name: Apply admin correlation thresholds
on:
  push:
    branches:
      - agent/admin-correlation-thresholds
    paths:
      - .github/scripts/apply_admin_correlation_thresholds.py
      - .github/workflows/apply-admin-correlation-thresholds.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-correlation-thresholds
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_admin_correlation_thresholds.py
      - run: rm .github/scripts/apply_admin_correlation_thresholds.py .github/workflows/apply-admin-correlation-thresholds.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'add numeric correlation thresholds'
          git push origin HEAD:agent/admin-correlation-thresholds
