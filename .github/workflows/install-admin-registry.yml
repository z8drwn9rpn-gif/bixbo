name: Install BIXBO admin registry
on:
  push:
    paths:
      - '.github/workflows/install-admin-registry.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/install-admin-registry.py
      - name: Generate routes and build
        run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Verify registry integration
        run: |
          test -f src/lib/appRegistry.ts
          test -f src/routes/admin.tsx
          grep -q 'adminConfig' src/lib/storage.ts
          grep -q 'isRegistrySurfaceEnabled' src/components/QuickTags.tsx
          grep -q 'isRegistrySurfaceEnabled' src/components/MonthCalendar.tsx
          grep -q 'availableHeatmapOptions' src/routes/insights.tsx
          grep -q 'onAdmin' src/routes/profile.tsx
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'Add configurable BIXBO Admin Registry'
          git push
