name: Rebuild mascot from base64 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-mascot-from-b64-once.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact transparent PNG
        shell: bash
        run: |
          cat > /tmp/mascot.b64 <<'B64'
          
          B64
          tr -d '[:space:]' < /tmp/mascot.b64 | base64 -d > public/bixbo-mascot-user.png
          cp public/bixbo-mascot-user.png src/assets/bixbo-mascot-user.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          for p in ['public/bixbo-mascot-user.png','src/assets/bixbo-mascot-user.png']:
              im=Image.open(p).convert('RGBA'); im.load()
              assert im.size == (96,96), (p,im.size)
              assert im.getpixel((0,0))[3] == 0, (p,im.getpixel((0,0)))
              print(p, im.size, im.mode, im.getbbox())
          PY

      - name: Refresh URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/features/home/HomePage.tsx')
          s=p.read_text()
          s=s.replace('/bixbo-mascot-user.png?v=20260813-full','/bixbo-mascot-user.png?v=20260813-transparent-fixed')
          s=s.replace('/bixbo-mascot-user.png?v=20260813-transparent-final','/bixbo-mascot-user.png?v=20260813-transparent-fixed')
          p.write_text(s)
          PY

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit
        run: |
          rm -f .github/workflows/rebuild-mascot-from-b64-once.yml
          rm -f .github/workflows/make-mascot-transparent-once.yml
          rm -f .github/workflows/force-transparent-mascot-once.yml
          rm -f .github/workflows/finalize-transparent-mascot-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bixbo-mascot-user.png src/assets/bixbo-mascot-user.png src/features/home/HomePage.tsx .github/workflows/rebuild-mascot-from-b64-once.yml .github/workflows/make-mascot-transparent-once.yml .github/workflows/force-transparent-mascot-once.yml .github/workflows/finalize-transparent-mascot-once.yml
          git commit -m "fix: use valid transparent BIXBO mascot PNG"
          git pull --rebase origin main
          git push origin HEAD:main
