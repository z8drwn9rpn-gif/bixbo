name: Restore old log once
on:
  push:
    branches: [agent/restore-old-log-full]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[old-log-restored]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-old-log-full
          fetch-depth: 0
      - name: Restore log files from pre-redesign main
        shell: bash
        run: |
          git checkout f462b9afdc70160bb7fde3e7643e431ebfe58df4 -- \
            src/components/LogSheet.tsx \
            src/features/logging/logCategories.ts \
            src/features/logging/LifestyleForms.tsx \
            src/features/logging/PainWizard.tsx \
            src/components/home/DayOverview.tsx \
            src/features/logging/CycleForms.tsx \
            src/lib/storage/types.ts
          git rm -f \
            src/features/logging/LogSheetRootV2.tsx \
            src/features/logging/EnhancedForms.tsx \
            src/features/logging/EnhancedForms2.tsx
      - name: Commit restoration
        shell: bash
        run: |
          rm .github/workflows/restore-old-log-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "revert: restore old BIXBO log [old-log-restored]"
          git push origin HEAD:agent/restore-old-log-full
