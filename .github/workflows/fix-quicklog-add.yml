name: Fix Quick Log Add

on:
  push:
    paths:
      - ".github/workflows/fix-quicklog-add.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch Quick Log Add visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/QuickTags.tsx')
          s = p.read_text()

          old = '''  customLogId?: string;\n  apply?: (l: DayLog) => DayLog;'''
          new = '''  customLogId?: string;\n  /** Button explicitly created by the user through Quick Log → Add. */\n  userCustom?: boolean;\n  apply?: (l: DayLog) => DayLog;'''
          if old not in s:
              raise SystemExit('Tag type anchor not found')
          s = s.replace(old, new, 1)

          old = '''    cat: c.cat,\n    apply,'''
          new = '''    cat: c.cat,\n    userCustom: true,\n    apply,'''
          if old not in s:
              raise SystemExit('customToTag anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const registryAllowsQuickTag = (tag: Tag) => {\n    if (tag.cat === "custom") return true;'''
          new = '''  const registryAllowsQuickTag = (tag: Tag) => {\n    // Explicit Quick Log → Add buttons must remain visible even when the\n    // underlying built-in category is disabled on the default Quick Log surface.\n    // Creating the custom button is itself an explicit per-device opt-in.\n    if (tag.userCustom || tag.cat === "custom") return true;'''
          if old not in s:
              raise SystemExit('registryAllowsQuickTag anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Quality
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
      - name: Commit
        run: |
          git config user.name "bixbo-bot"
          git config user.email "bixbo-bot@users.noreply.github.com"
          git add src/components/QuickTags.tsx
          git commit -m "Keep added Quick Log buttons visible"
          git stash -u
          git pull --rebase origin main
          git stash drop || true
          git push origin HEAD:main
