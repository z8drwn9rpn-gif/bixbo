name: Center Log second row once
on:
  push:
    branches: [main]
jobs:
  center:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Center four-item second row
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/logging/LogSheetRoot.tsx')
          s = p.read_text()
          s2 = s.replace('className="grid grid-cols-5 gap-x-1 gap-y-3"', 'className={`grid gap-x-1 gap-y-3 ${orderedCats.length === 9 ? "grid-cols-10" : "grid-cols-5"}`}', 1)
          s2 = s2.replace('{orderedCats.map((c) => (', '{orderedCats.map((c, index) => (', 1)
          marker = 'focus-visible:ring-2 focus-visible:ring-ring ${editingOrder ?'
          replacement = 'focus-visible:ring-2 focus-visible:ring-ring ${orderedCats.length === 9 ? "col-span-2" : ""} ${orderedCats.length === 9 && index === 5 ? "col-start-2" : ""} ${editingOrder ?'
          s2 = s2.replace(marker, replacement, 1)
          if s2 == s:
              raise SystemExit('No Log layout changes were applied')
          if 'grid-cols-10' not in s2 or 'col-start-2' not in s2:
              raise SystemExit('Centered Log layout markers missing')
          p.write_text(s2)
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/center-log-second-row-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/logging/LogSheetRoot.tsx .github/workflows/center-log-second-row-once.yml
          git commit -m "Center second row in Log menu"
          git push