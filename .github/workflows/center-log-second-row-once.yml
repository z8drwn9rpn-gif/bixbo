name: Center Log second row once
on:
  push:
    branches: [main]
jobs:
  center:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Center four-item second row
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/logging/LogSheetRoot.tsx')
          s = p.read_text()
          old = '''              <div className="grid grid-cols-5 gap-x-1 gap-y-3">
                {orderedCats.map((c) => (
                  <button'''
          new = '''              <div className={`grid gap-x-1 gap-y-3 ${orderedCats.length === 9 ? "grid-cols-10" : "grid-cols-5"}`}>
                {orderedCats.map((c, index) => (
                  <button'''
          if old not in s:
              raise SystemExit('Log grid start not found')
          s = s.replace(old, new, 1)
          old_class = '''                    className={`flex min-h-[82px] min-w-0 touch-none select-none flex-col items-center justify-start gap-1.5 rounded-2xl px-0.5 py-1 text-foreground outline-none transition-[background-color,transform,opacity] focus-visible:ring-2 focus-visible:ring-ring ${editingOrder ? "cursor-grab active:cursor-grabbing" : "active:scale-[0.97]"} ${draggingCat === c.id ? "z-30 scale-[1.03] bg-tint shadow-md" : "hover:bg-tint/60"}`}'''
          new_class = '''                    className={`flex min-h-[82px] min-w-0 touch-none select-none flex-col items-center justify-start gap-1.5 rounded-2xl px-0.5 py-1 text-foreground outline-none transition-[background-color,transform,opacity] focus-visible:ring-2 focus-visible:ring-ring ${orderedCats.length === 9 ? "col-span-2" : ""} ${orderedCats.length === 9 && index === 5 ? "col-start-2" : ""} ${editingOrder ? "cursor-grab active:cursor-grabbing" : "active:scale-[0.97]"} ${draggingCat === c.id ? "z-30 scale-[1.03] bg-tint shadow-md" : "hover:bg-tint/60"}`}'''
          if old_class not in s:
              raise SystemExit('Log button class not found')
          s = s.replace(old_class, new_class, 1)
          p.write_text(s)
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/center-log-second-row-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/logging/LogSheetRoot.tsx .github/workflows/center-log-second-row-once.yml
          git commit -m "Center second row in Log menu"
          git push