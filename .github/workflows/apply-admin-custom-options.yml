name: Apply admin custom option patch
on:
  push:
    branches:
      - agent/full-admin-customization-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-admin-customization-v2
      - name: Apply patch
        run: python scripts/apply_admin_custom_options.py
      - name: Commit patch
        run: |
          git rm .github/workflows/apply-admin-custom-options.yml scripts/apply_admin_custom_options.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/appRegistry.ts src/components/AdminEditOverlay.tsx
          git commit -m "add custom options to core log fields"
          git push origin HEAD:agent/full-admin-customization-v2
