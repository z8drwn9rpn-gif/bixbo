name: Apply admin custom option patch
on:
  push:
    branches:
      - agent/full-admin-customization-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-admin-customization-v2
      - name: Patch registry and inline admin
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('src/lib/appRegistry.ts')
          text = registry.read_text()
          old = '''export function registryFieldOptions(data: Pick<BixboData, "settings">, featureId: RegistryFeatureId, fieldId: string, base: string[]): string[] {
            const overrides = activeAdminConfig(data)?.features?.[featureId]?.fields?.[fieldId]?.options ?? {};
            return base
              .filter((value) => overrides[value]?.enabled !== false)
              .sort((a, b) => (overrides[a]?.order ?? base.indexOf(a)) - (overrides[b]?.order ?? base.indexOf(b)));
          }'''.replace('          ', '')
          new = '''export function registryFieldOptions(data: Pick<BixboData, "settings">, featureId: RegistryFeatureId, fieldId: string, base: string[]): string[] {
            const overrides = activeAdminConfig(data)?.features?.[featureId]?.fields?.[fieldId]?.options ?? {};
            const values = [...base];
            for (const value of Object.keys(overrides)) {
              if (!values.includes(value)) values.push(value);
            }
            return values
              .filter((value) => overrides[value]?.enabled !== false)
              .sort((a, b) => (overrides[a]?.order ?? values.indexOf(a)) - (overrides[b]?.order ?? values.indexOf(b)));
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('registryFieldOptions source block not found')
          registry.write_text(text.replace(old, new))

          overlay = Path('src/components/AdminEditOverlay.tsx')
          text = overlay.read_text()
          anchor = '''  const resetFeature = (id: RegistryFeatureId) => {
            const config = getDeviceAdminConfig();
            const featuresCopy = { ...(config.features ?? {}) };
            delete featuresCopy[id];
            persist({ ...config, features: featuresCopy });
          };
          '''.replace('          ', '')
          addition = anchor + '''
          const addFieldOption = (featureId: RegistryFeatureId, fieldId: string) => {
            const label = window.prompt(t("New option name"))?.trim();
            if (!label) return;
            const config = getDeviceAdminConfig();
            const feature = config.features?.[featureId] ?? {};
            const field = feature.fields?.[fieldId] ?? {};
            const options = field.options ?? {};
            const stableValue = `custom:${Date.now().toString(36)}:${Math.random().toString(36).slice(2, 8)}`;
            patchField(featureId, fieldId, { options: { [stableValue]: { label, enabled: true, order: Object.keys(options).length + 1000 } } });
          };

          const deleteCustomFieldOption = (featureId: RegistryFeatureId, fieldId: string, value: string) => {
            if (!value.startsWith("custom:")) return;
            const config = getDeviceAdminConfig();
            const feature = config.features?.[featureId] ?? {};
            const field = feature.fields?.[fieldId] ?? {};
            const options = { ...(field.options ?? {}) };
            delete options[value];
            persist({
              ...config,
              enabled: true,
              features: {
                ...(config.features ?? {}),
                [featureId]: {
                  ...feature,
                  fields: { ...(feature.fields ?? {}), [fieldId]: { ...field, options } },
                },
              },
            });
          };
          '''.replace('          ', '')
          if anchor not in text:
              raise SystemExit('resetFeature anchor not found')
          text = text.replace(anchor, addition)

          old_options = '''                                {baseField.options?.length ? (
                                  <div className="mt-2 space-y-1">
                                    {baseField.options.map((option, optionIndex) => {
                                      const override = localField?.options?.[option];
                                      const shown = isRegistryOptionEnabled(adminView, featureId, baseField.id, option);
                                      const label = registryOptionLabel(adminView, featureId, baseField.id, option);
                                      return (
                                        <div key={option} className="flex items-center gap-1.5">
                                          <input value={label} onChange={(event) => patchField(featureId, baseField.id, { options: { [option]: { ...override, label: event.target.value, order: override?.order ?? optionIndex } } })} className="h-7 min-w-0 flex-1 rounded-lg bg-background px-2 text-[10px] ring-1 ring-border" />
                                          <button type="button" onClick={() => patchField(featureId, baseField.id, { options: { [option]: { ...override, enabled: !shown, order: override?.order ?? optionIndex } } })} className="rounded-full bg-background px-2 py-1 text-[8px] ring-1 ring-border">{shown ? t("On") : t("Hidden")}</button>
                                        </div>
                                      );
                                    })}
                                  </div>
                                ) : null}'''
          new_options = '''                                {baseField.kind === "chips" ? (
                                  <div className="mt-2 space-y-1">
                                    {[...new Set([...(baseField.options ?? []), ...Object.keys(localField?.options ?? {})])].map((option, optionIndex) => {
                                      const override = localField?.options?.[option];
                                      const shown = isRegistryOptionEnabled(adminView, featureId, baseField.id, option);
                                      const label = registryOptionLabel(adminView, featureId, baseField.id, option);
                                      const custom = option.startsWith("custom:");
                                      return (
                                        <div key={option} className="flex items-center gap-1.5">
                                          <input value={label} onChange={(event) => patchField(featureId, baseField.id, { options: { [option]: { ...override, label: event.target.value, order: override?.order ?? optionIndex } } })} className="h-7 min-w-0 flex-1 rounded-lg bg-background px-2 text-[10px] ring-1 ring-border" />
                                          {custom ? (
                                            <button type="button" onClick={() => deleteCustomFieldOption(featureId, baseField.id, option)} className="rounded-full bg-background px-2 py-1 text-[8px] font-semibold text-destructive ring-1 ring-border">{t("Delete")}</button>
                                          ) : (
                                            <button type="button" onClick={() => patchField(featureId, baseField.id, { options: { [option]: { ...override, enabled: !shown, order: override?.order ?? optionIndex } } })} className="rounded-full bg-background px-2 py-1 text-[8px] ring-1 ring-border">{shown ? t("On") : t("Hidden")}</button>
                                          )}
                                        </div>
                                      );
                                    })}
                                    <button type="button" onClick={() => addFieldOption(featureId, baseField.id)} className="mt-1 w-full rounded-lg border border-dashed border-primary/40 bg-background px-2 py-1.5 text-[9px] font-bold text-primary">+ {t("Add custom")}</button>
                                  </div>
                                ) : null}'''
          if old_options not in text:
              raise SystemExit('field options block not found')
          overlay.write_text(text.replace(old_options, new_options))
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git rm .github/workflows/apply-admin-custom-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/appRegistry.ts src/components/AdminEditOverlay.tsx
          git commit -m "add custom options to core log fields"
          git push origin HEAD:agent/full-admin-customization-v2
