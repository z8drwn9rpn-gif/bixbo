name: Render i18n fix
on:
  push:
    paths:
      - '.github/workflows/render-i18n-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply render i18n fix
        run: python3 .github/scripts/render_i18n_fix.py
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/patterns.tsx src/routes/couple.tsx src/lib/i18n.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix remaining direct-render i18n gaps"
          git push
