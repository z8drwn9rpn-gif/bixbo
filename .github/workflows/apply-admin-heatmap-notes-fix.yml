name: Apply Admin Heatmap Notes fix
on:
  push:
    branches: [agent/fix-admin-heatmap-notes]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-admin-heatmap-notes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply exact patch
        run: python scripts/apply_admin_heatmap_notes_fix.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified patch
        run: |
          rm -f scripts/apply_admin_heatmap_notes_fix.py .github/workflows/apply-admin-heatmap-notes-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/notes-editor.tsx src/components/GlobalAdminModeController.tsx src/routes/insights.tsx src/lib/__tests__/admin-heatmap-notes-live-regression.test.ts
          git add -u scripts/apply_admin_heatmap_notes_fix.py .github/workflows/apply-admin-heatmap-notes-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Admin page editing, Heatmap tooltip and Notes input"
          git push origin HEAD:agent/fix-admin-heatmap-notes
