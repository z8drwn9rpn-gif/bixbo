name: One-shot GitHub Cloudflare cutover

on:
  push:
    branches: [agent/one-shot-cloudflare-cutover-20260817]
    paths:
      - .github/workflows/one-shot-cloudflare-cutover-20260817.yml

permissions:
  contents: read

concurrency:
  group: bixbo-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_SHA: 1d1c4ae3b24abcf05a841e843266f69bc6fd4a07
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      VITE_LEGAL_CONTROLLER_NAME: ${{ vars.VITE_LEGAL_CONTROLLER_NAME }}
      VITE_LEGAL_CONTROLLER_ADDRESS: ${{ vars.VITE_LEGAL_CONTROLLER_ADDRESS }}
      VITE_LEGAL_PRIVACY_EMAIL: ${{ vars.VITE_LEGAL_PRIVACY_EMAIL }}
      BASE_URL: https://bixbo.z8drwn9rpn.workers.dev

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify target is still current main
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CURRENT_SHA" != "$TARGET_SHA" ]; then
            echo "main moved from $TARGET_SHA to $CURRENT_SHA; refusing to deploy a stale commit."
            exit 1
          fi

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            VITE_VAPID_PUBLIC_KEY
            VITE_LEGAL_CONTROLLER_NAME
            VITE_LEGAL_CONTROLLER_ADDRESS
            VITE_LEGAL_PRIVACY_EMAIL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions configuration: $name"
              exit 1
            fi
          done
          if [ "$VITE_LEGAL_CONTROLLER_NAME" = "BIXBO operator" ]; then
            echo "Fallback legal controller identity is forbidden in production."
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          import re

          key = os.environ["VITE_VAPID_PUBLIC_KEY"].strip()
          if not re.fullmatch(r"B[A-Za-z0-9_-]{86}", key):
              raise SystemExit("VITE_VAPID_PUBLIC_KEY has an invalid encoding.")
          raw = base64.urlsafe_b64decode(key + "=" * (-len(key) % 4))
          if len(raw) != 65 or raw[0] != 4:
              raise SystemExit("VITE_VAPID_PUBLIC_KEY is not an uncompressed P-256 public key.")
          email = os.environ["VITE_LEGAL_PRIVACY_EMAIL"].strip()
          if "@" not in email or email.startswith("@") or email.endswith("@"):
              raise SystemExit("VITE_LEGAL_PRIVACY_EMAIL does not look valid.")
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release safety guards
        shell: bash
        run: |
          set -euo pipefail
          bun run audit:independence
          bun run typecheck
          bun run test

      - name: Build production Worker
        run: bun run build

      - name: Verify production bundle
        run: bun run bundle:check

      - name: Recheck main immediately before deployment
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CURRENT_SHA" != "$TARGET_SHA" ]; then
            echo "main moved during build from $TARGET_SHA to $CURRENT_SHA; refusing production deploy."
            exit 1
          fi

      - name: Deploy Worker from GitHub
        run: bunx wrangler deploy --keep-vars

      - name: Verify live production
        shell: bash
        run: |
          set -euo pipefail
          check_live() {
            local root privacy terms mcp
            root="$(curl -fsS --max-time 20 "$BASE_URL/")" || return 1
            privacy="$(curl -fsS --max-time 20 "$BASE_URL/privacy")" || return 1
            terms="$(curl -fsS --max-time 20 "$BASE_URL/terms")" || return 1
            mcp="$(curl -fsS --max-time 20 "$BASE_URL/mcp")" || return 1
            grep -qi 'BIXBO' <<<"$root" || return 1
            grep -q 'Privacy Policy' <<<"$privacy" || return 1
            grep -q 'Terms of Service' <<<"$terms" || return 1
            grep -q 'bixbo-my-health-diary' <<<"$mcp" || return 1
            ! grep -Fq 'BIXBO operator' <<<"$privacy" || return 1
            ! grep -Fq 'BIXBO operator' <<<"$terms" || return 1
            grep -Fq "$VITE_LEGAL_CONTROLLER_NAME" <<<"$privacy" || return 1
            grep -Fq "$VITE_LEGAL_CONTROLLER_NAME" <<<"$terms" || return 1
          }
          for attempt in $(seq 1 30); do
            if check_live; then
              echo "First GitHub-owned Cloudflare production deploy verified on attempt $attempt."
              exit 0
            fi
            echo "Production is not ready yet (attempt $attempt/30); retrying in 10 seconds."
            sleep 10
          done
          echo "Production did not satisfy the post-deploy smoke contract within 5 minutes."
          exit 1
