name: Apply bowel field drag
on:
  push:
    branches: [agent/linear-log-field-drag]
    paths:
      - '.github/scripts/apply_bowel_field_drag.py'
      - '.github/workflows/apply-bowel-field-drag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linear-log-field-drag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_bowel_field_drag.py
      - run: rm .github/scripts/apply_bowel_field_drag.py .github/workflows/apply-bowel-field-drag.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'make bowel fields truly reorderable'
          git push
