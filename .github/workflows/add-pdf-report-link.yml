name: Add PDF report link
on:
  push:
    paths:
      - '.github/workflows/add-pdf-report-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Patch export page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/profile.tsx')
          s=p.read_text(encoding='utf-8')
          anchor='''          <button type="button" onClick={exportCsv} className="min-h-11 w-full rounded-xl border border-input bg-background px-4 text-sm font-semibold text-foreground">
            Export daily health CSV
          </button>'''
          if 'to="/report"' not in s:
              if anchor not in s:
                  raise SystemExit('CSV export button not found')
              s=s.replace(anchor,anchor+'''\n          <Link\n            to="/report"\n            className="inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-primary/10 px-4 text-sm font-semibold text-primary ring-1 ring-primary/20"\n          >\n            {t("PDF Reports")}\n          </Link>''',1)
              p.write_text(s,encoding='utf-8')
          PY
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/profile.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add PDF reports to Health Export'
            git push
          fi
