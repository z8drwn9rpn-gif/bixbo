name: Calendar CSS refactor

on:
  push:
    branches:
      - refactor/calendar-css-architecture

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refactor/calendar-css-architecture
          fetch-depth: 0
      - name: Refactor calendar styling
        run: python .github/scripts/calendar_css_refactor.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor calendar styling to semantic hooks"
          git push origin HEAD:refactor/calendar-css-architecture
