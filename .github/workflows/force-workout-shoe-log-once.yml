name: Force Workout shoe in Log once
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Hardwire Workout shoe in Log menu
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/features/logging/LogSheetRoot.tsx')
          s = p.read_text()
          old = '<Ico e={c.emoji} size={30} />'
          new = '<Ico e={c.id === "workout" ? "👟" : c.emoji} size={30} />'
          if old not in s:
              raise SystemExit('Log menu icon render not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/force-workout-shoe-log-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/logging/LogSheetRoot.tsx .github/workflows/force-workout-shoe-log-once.yml
          git commit -m "Force Workout shoe icon in Log menu"
          git push
