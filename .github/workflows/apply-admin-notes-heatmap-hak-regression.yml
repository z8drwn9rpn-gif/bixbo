name: Apply BIXBO icon and HAK admin cleanup

on:
  push:
    branches:
      - agent/fix-admin-icons-hak-cleanup
    paths:
      - scripts/apply_admin_notes_heatmap_hak_regression.py
      - .github/workflows/apply-admin-notes-heatmap-hak-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-admin-icons-hak-cleanup
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/apply_admin_notes_heatmap_hak_regression.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminEditOverlay.tsx src/components/GlobalAdminModeController.tsx \
            src/lib/__tests__/admin-bixbo-icons-hak-regression.test.ts
          git rm .github/workflows/apply-admin-notes-heatmap-hak-regression.yml \
            scripts/apply_admin_notes_heatmap_hak_regression.py
          git commit -m "Use BIXBO icons in Admin and finish HAK admin routing"
          git push origin HEAD:agent/fix-admin-icons-hak-cleanup
