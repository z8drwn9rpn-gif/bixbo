name: Apply admin notes heatmap HAK regression

on:
  push:
    branches:
      - agent/fix-admin-notes-heatmap-hak
    paths:
      - scripts/apply_admin_notes_heatmap_hak_regression.py
      - .github/workflows/apply-admin-notes-heatmap-hak-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-admin-notes-heatmap-hak
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: python scripts/apply_admin_notes_heatmap_hak_regression.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/insights.tsx src/routes/index.tsx src/routes/notes-editor.tsx \
            src/components/UniversalAdminPageEditor.tsx src/components/UniversalTextAdminEditor.tsx \
            src/components/AdminCustomPageBlocks.tsx src/components/NavigationAdminEditor.tsx \
            src/components/HakAdminEditOverlay.tsx src/components/GlobalAdminModeController.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix inline admin, Notes input, HAK editor and heatmap anchoring"
            git push origin HEAD:agent/fix-admin-notes-heatmap-hak
          fi
