name: Fix admin cycle custom metrics
on:
  push:
    branches:
      - agent/admin-cycle-custom-metrics
    paths:
      - .github/workflows/fix-admin-cycle-metrics.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-cycle-custom-metrics
      - name: Fix optional max
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/patterns.tsx')
          t=p.read_text()
          old='bars={metric.bars} max={metric.max} decimals={1} unit={metric.unit}'
          if old not in t:
              raise SystemExit('target not found')
          p.write_text(t.replace(old,'bars={metric.bars} max={metric.max ?? 10} decimals={1} unit={metric.unit}',1))
          PY
          rm .github/workflows/fix-admin-cycle-metrics.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix cycle custom metric max typing'
          git push origin HEAD:agent/admin-cycle-custom-metrics
