name: Refactor monoliths final v2
on:
  push:
    paths:
      - '.github/workflows/refactor-monoliths-final-v2.yml'
permissions:
  contents: write
concurrency:
  group: bixbo-monolith-final-v2
  cancel-in-progress: false
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run corrected modularizer
        run: |
          python3 <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/refactor-monoliths-final-once.yml').read_text()
          start=src.index("          const ts = require('typescript');")
          end=src.index("\n          JS",start)
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines())
          script=script.replace(
            "const body=selected.map(d=>exportify(d.st,sf,text)).join('\\n\\n');",
            "const body=selected.map(d=>{ let s=exportify(d.st,sf,text); if(opts.adjustBody) s=opts.adjustBody(s); return s; }).join('\\n\\n');"
          )
          script=script.replace(
            "defaults:d=>d.start>=883&&d.start<1008,",
            "defaults:d=>d.start>=883&&d.start<974,"
          )
          script=script.replace(
            "runtime:d=>d.start>=1526&&d.start<2149,",
            "runtime:d=>(d.start>=1526&&d.start<2149)||d.names.includes('hasStoredBixboSnapshot')||d.names.includes('clearBixboLocalStorage'),"
          )
          script=script.replace(
            "buildGroupedModules(source,'src/lib/storage',groups,{ext:'ts',adjustImports:s=>s.replace(/\"\\.\\//g,'\"../'),extraPrelude:{types:exportDecls}});",
            "buildGroupedModules(source,'src/lib/storage',groups,{ext:'ts',adjustImports:s=>s.replace(/\"\\.\\//g,'\"../'),adjustBody:s=>s.replace(/\"\\.\\//g,'\"../'),extraPrelude:{types:exportDecls}});"
          )
          marker="// Remove temporary one-shot audit/refactor workflows."
          patch=r'''// Repair pre-existing strict TypeScript callback inference in CustomLogBuilder.
          {
            const p='src/components/CustomLogBuilder.tsx';
            let s=read(p);
            s=s.replace('(field.options ?? []).map((option, optionIndex) => (','(field.options ?? []).map((option: string, optionIndex: number) => (');
            s=s.replace('(field.options ?? []).filter((_, i) => i !== optionIndex)','(field.options ?? []).filter((_: string, i: number) => i !== optionIndex)');
            write(p,s);
          }

          '''
          script=script.replace(marker,patch+marker)
          Path('/tmp/refactor-monoliths.js').write_text(script)
          PY
          node /tmp/refactor-monoliths.js
      - name: Verify typecheck tests build and size ceiling
        run: |
          bun run typecheck
          bun test
          bun run build
          python3 <<'PY'
          from pathlib import Path
          roots=['src/components/LogSheet.tsx','src/routes/patterns.tsx','src/routes/profile.tsx','src/lib/storage.ts','src/lib/i18n.ts']
          print('ROOT SIZES')
          for p in roots: print(p,Path(p).stat().st_size)
          dirs=['src/features/logging','src/features/patterns','src/features/profile','src/lib/storage','src/lib/i18n']
          bad=[]
          for d in dirs:
            for p in Path(d).glob('*.ts*'):
              n=p.stat().st_size
              print(p,n)
              if n>50000: bad.append((str(p),n))
          if bad: raise SystemExit('oversized modules remain: '+repr(bad))
          PY
      - name: Commit only verified result
        run: |
          rm -f .github/workflows/refactor-monoliths-final-v2.yml .github/workflows/refactor-monoliths-final-once.yml .github/workflows/audit-monolith-structure-once.yml .github/workflows/audit-large-components-once.yml .github/workflows/refactor-i18n-locales-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: modularize remaining monoliths"
          git fetch origin main
          git rebase origin/main
          git push origin main
