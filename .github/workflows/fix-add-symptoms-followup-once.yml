name: Fix Add symptoms follow-up once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-add-symptoms-followup-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fix repeated Add symptoms parent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sheet_path = Path('src/components/LogSheet.tsx')
          src = sheet_path.read_text()
          old = (
              '    const entries = data.dayLogs[date]?.pain ?? [];\n'
              '    if (!entries.length) return undefined;\n\n'
              '    return entries.reduce((latest, entry) =>\n'
              '      (entry.time ?? "").localeCompare(latest.time ?? "") >= 0 ? entry : latest,\n'
              '    );'
          )
          new = (
              '    // Symptom-only follow-ups are children of a real pain entry, not new pain measurements.\n'
              '    // Always attach repeated Add symptoms entries to the newest REAL pain entry.\n'
              '    const entries = (data.dayLogs[date]?.pain ?? []).filter((entry) => entry.entryKind !== "symptom-update");\n'
              '    if (!entries.length) return undefined;\n\n'
              '    return entries.reduce((latest, entry) =>\n'
              '      (entry.time ?? "").localeCompare(latest.time ?? "") >= 0 ? entry : latest,\n'
              '    );'
          )
          if old not in src:
              raise SystemExit('latestPain block not found; refusing unsafe patch')
          sheet_path.write_text(src.replace(old, new, 1))

          test_path = Path('src/lib/__tests__/pain-symptom-update-regression.test.ts')
          test = test_path.read_text()
          marker = 'it("quick Add symptoms keeps an optional note field", () => {'
          addition = (
              'it("repeated Add symptoms entries always attach to the latest real pain entry", () => {\n'
              '  const source = readFileSync(resolve(process.cwd(), "src/components/LogSheet.tsx"), "utf8");\n'
              '  expect(source).toContain(\'(data.dayLogs[date]?.pain ?? []).filter((entry) => entry.entryKind !== "symptom-update")\');\n'
              '  expect(source).toContain(\'setCopiedFromId(latestPain.id)\');\n'
              '});\n\n'
          )
          if 'repeated Add symptoms entries always attach' not in test:
              if marker not in test:
                  raise SystemExit('test insertion marker not found')
              test_path.write_text(test.replace(marker, addition + marker, 1))
          PY

      - name: Verify
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test src/lib/__tests__/pain-symptom-update-regression.test.ts

      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-add-symptoms-followup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LogSheet.tsx src/lib/__tests__/pain-symptom-update-regression.test.ts .github/workflows/fix-add-symptoms-followup-once.yml
          git commit -m "fix: keep repeated Add symptoms under source pain"
          git push origin HEAD:main
