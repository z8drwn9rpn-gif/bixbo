name: Final admin customization
on:
  push:
    branches: [agent/final-admin-customization-audit]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-admin-customization-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/final_admin_customization.py
      - run: rm .github/scripts/final_admin_customization.py .github/workflows/final-admin-customization.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/appRegistry.ts src/components/CustomLogBuilder.tsx src/routes/index.tsx .github
          git commit -m 'finish safe admin customization lifecycle'
          git push origin HEAD:agent/final-admin-customization-audit