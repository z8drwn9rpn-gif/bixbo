name: Clean analytics on kind change

on:
  push:
    branches:
      - agent/clean-analytics-on-kind-change

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clean-analytics-on-kind-change
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/clean_analytics_on_kind_change.py
      - run: rm .github/scripts/clean_analytics_on_kind_change.py .github/workflows/clean-analytics-on-kind-change.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CoreFeatureCustomFieldBuilder.tsx .github
          git commit -m 'clean analytics refs on custom field kind changes'
          git push origin HEAD:agent/clean-analytics-on-kind-change
