name: Apply admin custom field reorder
on:
  push:
    branches:
      - agent/admin-custom-field-reorder
    paths:
      - .github/scripts/apply_admin_field_reorder.py
      - .github/workflows/apply-admin-field-reorder.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-custom-field-reorder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_admin_field_reorder.py
      - run: rm .github/scripts/apply_admin_field_reorder.py .github/workflows/apply-admin-field-reorder.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'add admin supplementary field reorder'
          git push origin HEAD:agent/admin-custom-field-reorder
