name: BIXBO Cloudflare production deploy

on:
  push:
    branches: [main]
  issues:
    types: [reopened]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to confirm the production release"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: bixbo-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issues' || github.event.issue.number == 229)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.sha }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      VITE_LEGAL_CONTROLLER_NAME: ${{ vars.VITE_LEGAL_CONTROLLER_NAME }}
      VITE_LEGAL_CONTROLLER_ADDRESS: ${{ vars.VITE_LEGAL_CONTROLLER_ADDRESS }}
      VITE_LEGAL_PRIVACY_EMAIL: ${{ vars.VITE_LEGAL_PRIVACY_EMAIL }}
      BASE_URL: https://bixbo.z8drwn9rpn.workers.dev

    steps:
      - name: Checkout deploy commit
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Confirm manual production release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM_PRODUCTION" != "DEPLOY" ]; then
            echo "Production confirmation must be exactly DEPLOY."
            exit 1
          fi

      - name: Verify target is current main
        id: target
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
            echo "main moved from $DEPLOY_SHA to $CURRENT_SHA; refusing to deploy a stale commit."
            exit 1
          fi

      - name: Verify deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

          python3 - <<'PY'
          import base64
          import os
          import re
          import uuid

          public_vars = (
              "VITE_SUPABASE_URL",
              "VITE_SUPABASE_PUBLISHABLE_KEY",
              "VITE_VAPID_PUBLIC_KEY",
              "VITE_LEGAL_CONTROLLER_NAME",
              "VITE_LEGAL_CONTROLLER_ADDRESS",
              "VITE_LEGAL_PRIVACY_EMAIL",
          )
          values = {name: os.environ.get(name, "").strip() for name in public_vars}
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit("Missing required GitHub Actions configuration: " + ", ".join(missing))
          if values["VITE_LEGAL_CONTROLLER_NAME"] == "BIXBO operator":
              raise SystemExit("Fallback legal controller identity is forbidden in production.")
          if not values["VITE_SUPABASE_URL"].startswith("https://"):
              raise SystemExit("VITE_SUPABASE_URL must use HTTPS.")
          key = values["VITE_VAPID_PUBLIC_KEY"]
          if not re.fullmatch(r"B[A-Za-z0-9_-]{86}", key):
              raise SystemExit("VITE_VAPID_PUBLIC_KEY is not a valid uncompressed P-256 public key encoding.")
          raw = base64.urlsafe_b64decode(key + "=" * (-len(key) % 4))
          if len(raw) != 65 or raw[0] != 4:
              raise SystemExit("VITE_VAPID_PUBLIC_KEY does not decode to an uncompressed P-256 public key.")
          email = values["VITE_LEGAL_PRIVACY_EMAIL"]
          if "@" not in email or email.startswith("@") or email.endswith("@"):
              raise SystemExit("VITE_LEGAL_PRIVACY_EMAIL does not look like a valid email address.")

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  delimiter = f"BIXBO_{uuid.uuid4().hex}"
                  env_file.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Release safety guards
        id: guards
        shell: bash
        run: |
          set -euo pipefail
          bun run audit:independence
          bun run typecheck
          bun run test

      - name: Build production Worker
        id: build
        run: bun run build

      - name: Verify production bundle
        id: bundle
        run: bun run bundle:check

      - name: Smoke built app
        id: smoke
        run: timeout 75s bun run smoke:ssr

      - name: Recheck main immediately before deployment
        id: recheck
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
            echo "main moved during the release from $DEPLOY_SHA to $CURRENT_SHA; refusing production deploy."
            exit 1
          fi

      - name: Deploy Worker from GitHub
        id: deploy_worker
        run: bunx wrangler deploy --keep-vars

      - name: Verify live production
        id: verify_live
        shell: bash
        run: |
          set -euo pipefail

          check_live() {
            local root privacy terms mcp
            root="$(curl -fsS --max-time 20 "$BASE_URL/")" || return 1
            privacy="$(curl -fsS --max-time 20 "$BASE_URL/privacy")" || return 1
            terms="$(curl -fsS --max-time 20 "$BASE_URL/terms")" || return 1
            mcp="$(curl -fsS --max-time 20 "$BASE_URL/mcp")" || return 1

            grep -qi 'BIXBO' <<<"$root" || return 1
            grep -q 'Privacy Policy' <<<"$privacy" || return 1
            grep -q 'Terms of Service' <<<"$terms" || return 1
            grep -q 'bixbo-my-health-diary' <<<"$mcp" || return 1
            ! grep -Fq 'BIXBO operator' <<<"$privacy" || return 1
            ! grep -Fq 'BIXBO operator' <<<"$terms" || return 1
          }

          for attempt in $(seq 1 30); do
            if check_live; then
              echo "GitHub-owned Cloudflare production deploy verified on attempt $attempt."
              exit 0
            fi
            echo "Production is not ready yet (attempt $attempt/30); retrying in 10 seconds."
            sleep 10
          done

          echo "Production did not satisfy the post-deploy smoke contract within 5 minutes."
          exit 1

      - name: Record deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_OUTCOME: ${{ steps.target.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GUARDS_OUTCOME: ${{ steps.guards.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_worker.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_live.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bixbo-deploy-status.md <<EOF
          Automated GitHub → Cloudflare production deployment status.

          **Commit:** `${DEPLOY_SHA}`
          **Job:** ${JOB_STATUS}
          **Run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          | Step | Outcome |
          |---|---|
          | Current-main check | ${TARGET_OUTCOME:-not-run} |
          | Production config | ${CONFIG_OUTCOME:-not-run} |
          | Install | ${INSTALL_OUTCOME:-not-run} |
          | Safety guards | ${GUARDS_OUTCOME:-not-run} |
          | Build | ${BUILD_OUTCOME:-not-run} |
          | Bundle check | ${BUNDLE_OUTCOME:-not-run} |
          | SSR smoke | ${SMOKE_OUTCOME:-not-run} |
          | Final main check | ${RECHECK_OUTCOME:-not-run} |
          | Wrangler deploy | ${DEPLOY_OUTCOME:-not-run} |
          | Live production verify | ${VERIFY_OUTCOME:-not-run} |
          EOF

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/229" --raw-field body="$(cat /tmp/bixbo-deploy-status.md)" >/dev/null
