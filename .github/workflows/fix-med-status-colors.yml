name: Fix medication status colors

on:
  push:
    branches:
      - fix/med-status-colors

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[med-status-colors-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/med-status-colors
          fetch-depth: 0

      - name: Restore Taken green and Missed red in Day Overview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/home/DayOverview.tsx')
          text = path.read_text()

          old_taken = '''                    className="text-left text-green-700 hover:underline"\n                    title={t("Tap to edit meds")}'''
          new_taken = '''                    className="text-left hover:underline"\n                    style={{ color: "var(--success)" }}\n                    title={t("Tap to edit meds")}'''

          old_missed = '''                  className="flex-1 text-left text-destructive/90"\n                  title={t("Tap to edit meds")}'''
          new_missed = '''                  className="flex-1 text-left"\n                  style={{ color: "var(--destructive)" }}\n                  title={t("Tap to edit meds")}'''

          if text.count(old_taken) != 1:
              raise SystemExit(f'Expected one Taken style block, found {text.count(old_taken)}')
          if text.count(old_missed) != 1:
              raise SystemExit(f'Expected one Missed style block, found {text.count(old_missed)}')

          text = text.replace(old_taken, new_taken, 1)
          text = text.replace(old_missed, new_missed, 1)
          path.write_text(text)

          Path('.github/workflows/fix-med-status-colors.yml').unlink()
          PY

          git config user.name "bixbo-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/DayOverview.tsx .github/workflows/fix-med-status-colors.yml
          git commit -m "Restore Taken green and Missed red [med-status-colors-applied]"
          git push origin HEAD:fix/med-status-colors
