name: Agent release hardening generated files

on:
  push:
    branches: [agent/independent-release-hardening]
    paths-ignore:
      - bun.lock
      - src/routeTree.gen.ts

permissions:
  contents: write

jobs:
  sync-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/independent-release-hardening
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate dependency lock
        run: bun install
      - name: Regenerate routes and verify native build
        run: bun run build
      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git add bun.lock src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync generated lock and routes"
          git push
