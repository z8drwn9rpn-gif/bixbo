name: Make mascot transparent once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/make-mascot-transparent-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove white mascot background
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path

          src = Path('public/bixbo-mascot-user.png')
          im = Image.open(src).convert('RGBA')
          px = im.load()
          w, h = im.size

          def is_white(x, y):
              r, g, b, a = px[x, y]
              return a > 0 and r >= 245 and g >= 245 and b >= 245

          seen = set()
          q = deque()
          for x in range(w):
              if is_white(x, 0): q.append((x, 0))
              if is_white(x, h - 1): q.append((x, h - 1))
          for y in range(h):
              if is_white(0, y): q.append((0, y))
              if is_white(w - 1, y): q.append((w - 1, y))

          while q:
              x, y = q.popleft()
              if (x, y) in seen or not (0 <= x < w and 0 <= y < h) or not is_white(x, y):
                  continue
              seen.add((x, y))
              r, g, b, _ = px[x, y]
              px[x, y] = (r, g, b, 0)
              q.extend(((x-1,y),(x+1,y),(x,y-1),(x,y+1)))

          # Soften only near-white antialiased pixels touching transparency.
          for _ in range(2):
              updates = []
              for y in range(h):
                  for x in range(w):
                      r, g, b, a = px[x, y]
                      if a == 0 or min(r, g, b) <= 220:
                          continue
                      touches_transparent = any(
                          0 <= nx < w and 0 <= ny < h and px[nx, ny][3] == 0
                          for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1))
                      )
                      if touches_transparent:
                          new_a = min(a, max(0, min(255, (255 - min(r,g,b)) * 8)))
                          updates.append((x, y, (r, g, b, new_a)))
              for x, y, value in updates:
                  px[x, y] = value

          im.save(src, optimize=True)
          Path('src/assets').mkdir(parents=True, exist_ok=True)
          im.save('src/assets/bixbo-mascot-user.png', optimize=True)

          # Hard verification: transparent corner + visible mascot pixels remain.
          check = Image.open(src).convert('RGBA')
          assert check.getpixel((0, 0))[3] == 0, check.getpixel((0,0))
          assert check.getbbox() is not None
          print('Mascot:', check.size, check.mode, 'bbox=', check.getbbox())
          PY

      - name: Refresh Home cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/home/HomePage.tsx')
          s = p.read_text()
          s = s.replace('/bixbo-mascot-user.png?v=20260813-full', '/bixbo-mascot-user.png?v=20260813-transparent')
          p.write_text(s)
          PY

      - name: Build
        run: |
          npm install
          npm run build

      - name: Commit transparent mascot
        shell: bash
        run: |
          rm -f .github/workflows/make-mascot-transparent-once.yml
          rm -f .github/workflows/force-transparent-mascot-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bixbo-mascot-user.png src/assets/bixbo-mascot-user.png src/features/home/HomePage.tsx .github/workflows/make-mascot-transparent-once.yml .github/workflows/force-transparent-mascot-once.yml
          git commit -m "fix: make BIXBO mascot background transparent"
          git pull --rebase origin main
          git push origin HEAD:main
